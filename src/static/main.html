<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鳳凰主頁</title>
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    <div class="navbar">
        <!-- 根據使用者要求，標題已更新，右上角的漢堡圖示已移除 -->
        <a href="/" class="navbar-brand">鳳凰主頁</a>
        <ul class="navbar-links" id="navbar-links">
            <!-- 根據新的導覽架構，此處不需連結 -->
        </ul>
    </div>

    <div class="content">
        <div class="panel" style="text-align: center;">
            <!-- 根據使用者要求，標題已更新 -->
            <h1>歡迎來到鳳凰主頁</h1>
            <p>請選擇您要使用的功能模組。</p>
            <a href="/static/mp3.html" class="button">音訊轉錄儀</a>
            <!-- 根據使用者要求，連結已修正，指向 page1 -->
            <a href="/page1" class="button secondary">文件分析儀</a>
        </div>
    </div>

    <!-- 根據使用者要求，用於切換漢堡選單的 JavaScript 已移除 -->

    <!-- V5.5 Readiness Overlay Start -->
    <style>
        #readiness-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5em;
            z-index: 9999;
            flex-direction: column;
            text-align: center;
        }
        #readiness-overlay .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #fff;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <div id="readiness-overlay">
        <div class="spinner"></div>
        <p>系統正在初始化核心服務，請稍候...</p>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const overlay = document.getElementById('readiness-overlay');
            const buttons = document.querySelectorAll('button, a.button, input[type="button"], input[type="submit"]');

            // 1. 預設禁用所有按鈕並顯示遮罩
            buttons.forEach(btn => {
                if (!btn.closest('.navbar')) {
                    btn.disabled = true;
                }
            });
            overlay.style.display = 'flex';

            // 2. 定期輪詢 /api/health/ready 端點
            const readinessInterval = setInterval(() => {
                fetch('/api/health/ready')
                    .then(response => {
                        if (response.ok) {
                            // 3. 一旦請求成功，啟用按鈕並隱藏遮罩
                            clearInterval(readinessInterval);
                            overlay.style.display = 'none';
                            buttons.forEach(btn => {
                                btn.disabled = false;
                            });
                            console.log('系統已就緒，UI 已啟用。');
                        } else {
                            console.log('等待核心服務就緒...');
                        }
                    })
                    .catch(error => {
                        console.error('輪詢就緒狀態時發生錯誤:', error);
                        const overlayText = overlay.querySelector('p');
                        if(overlayText) {
                            overlayText.innerText = '無法連接到後端服務，請檢查連線或稍後重試。';
                        }
                    });
            }, 2000); // 每 2 秒輪詢一次
        });
    </script>
    <!-- V5.5 Readiness Overlay End -->
</body>
</html>
