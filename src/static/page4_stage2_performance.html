<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 分析 - 階段二</title>
    <link rel="stylesheet" href="/static/css/nav.css">
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/page4.css">
</head>
<body>
    <nav class="top-nav">
        <ul>
            <li><a href="/">鳳凰主頁</a></li>
            <li><a href="/page1">網址提取</a></li>
            <li><a href="/page2">批次下載</a></li>
            <li><a href="/page3">檔案處理</a></li>
            <li><a href="/page4_stage1_ai" class="active">AI 分析</a></li>
            <li><a href="/page5">備份管理</a></li>
            <li><a href="/page6">金鑰管理</a></li>
            <li><a href="/page7">提示詞管理</a></li>
            <li><a href="/page9">績效儀表板</a></li>
        </ul>
    </nav>

    <div class="content">
        <h1>AI 分析流程</h1>

        <div class="sub-nav">
            <a href="/page4_stage1_ai" class="sub-nav-button">1. AI 分析</a>
            <a href="/page4_stage2_performance" class="sub-nav-button active">2. 績效分析</a>
            <a href="/page4_stage3_report" class="sub-nav-button">3. 報告生成</a>
        </div>

        <div class="panel">
            <h2>階段二：績效分析</h2>
            <p>此處顯示已完成 AI 文字擷取，但尚未進行量化績效分析的任務。勾選後即可開始分析。完成後，項目將會出現在「報告生成」頁面。</p>

            <div style="margin-bottom: 10px; margin-top: 20px;">
                <button id="select-all-button">全選</button>
                <button id="deselect-all-button">取消全選</button>
            </div>

            <div id="task-list-container">
                <p>正在載入待分析任務...</p>
            </div>

            <div style="margin-top: 20px;">
                <button id="start-performance-btn">📊 開始績效分析</button>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <h2>狀態日誌</h2>
                <button id="copy-log-button" class="copy-button" title="複製日誌">複製</button>
            </div>
            <div id="status-area"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const taskListContainer = document.getElementById('task-list-container');
            const selectAllButton = document.getElementById('select-all-button');
            const deselectAllButton = document.getElementById('deselect-all-button');
            const startPerformanceBtn = document.getElementById('start-performance-btn');
            const statusArea = document.getElementById('status-area');
            const copyLogButton = document.getElementById('copy-log-button');

            const logStatus = (message, color = 'black') => {
                const timestamp = new Date().toLocaleTimeString('zh-TW', { hour12: false });
                statusArea.insertAdjacentHTML('afterbegin', `<p style="color: ${color};">[${timestamp}] ${message}</p>`);
            };

            const renderTaskList = async () => {
                try {
                    const response = await fetch('/api/analyzer/files_for_performance_analysis');
                    if (!response.ok) throw new Error('無法獲取待處理任務');
                    const tasks = await response.json();
                    if (tasks.length === 0) {
                        taskListContainer.innerHTML = '<p>目前沒有可進行績效分析的任務。</p>';
                        return;
                    }
                    let html = `<table class="results-table"><thead><tr><th><input type="checkbox" id="select-all-header-checkbox"></th><th>檔案名稱</th><th>第一階段狀態</th></tr></thead><tbody>`;
                    tasks.forEach(task => {
                        html += `<tr>
                                     <td><input type="checkbox" class="task-checkbox" value="${task.id}"></td>
                                     <td title="${task.filename}">${task.filename}</td>
                                     <td><span class="status-completed">✅ 完成</span></td>
                                 </tr>`;
                    });
                    html += '</tbody></table>';
                    taskListContainer.innerHTML = html;
                } catch (error) {
                    taskListContainer.innerHTML = `<p style="color:red;">載入任務列表失敗: ${error.message}</p>`;
                }
            };

            startPerformanceBtn.addEventListener('click', async () => {
                const selectedIds = Array.from(document.querySelectorAll('.task-checkbox:checked')).map(cb => parseInt(cb.value, 10));
                if (selectedIds.length === 0) return alert('請至少選擇一個任務。');

                logStatus(`啟動績效分析，共 ${selectedIds.length} 個任務...`, 'blue');
                try {
                    const response = await fetch('/api/analyzer/start_performance_analysis', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ task_ids: selectedIds })
                    });
                    const result = await response.json();
                    if (response.ok) {
                        logStatus(`分析請求已成功發送: ${result.message}`, 'green');
                        logStatus('請稍後至「報告生成」頁面查看結果。正在重新整理列表...', 'purple');
                        setTimeout(renderTaskList, 1000);
                    } else {
                        throw new Error(result.detail || '未知錯誤');
                    }
                } catch (error) {
                    logStatus(`啟動分析失敗: ${error.message}`, 'red');
                }
            });

            taskListContainer.addEventListener('change', e => {
                if (e.target.id === 'select-all-header-checkbox') {
                    document.querySelectorAll('.task-checkbox').forEach(cb => e.target.checked ? cb.checked = true : cb.checked = false);
                }
            });
            selectAllButton.addEventListener('click', () => document.querySelectorAll('.task-checkbox').forEach(cb => cb.checked = true));
            deselectAllButton.addEventListener('click', () => document.querySelectorAll('.task-checkbox').forEach(cb => cb.checked = false));

            copyLogButton.addEventListener('click', () => {
                navigator.clipboard.writeText(statusArea.innerText).then(() => {
                    const originalText = copyLogButton.innerText;
                    copyLogButton.innerText = '已複製 ✅';
                    setTimeout(() => { copyLogButton.innerText = originalText; }, 2000);
                });
            });

            const setupWebSocket = () => {
                const ws = new WebSocket(`${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}/api/ws`);
                ws.onopen = () => logStatus('WebSocket 連線成功。', 'blue');
                ws.onclose = () => {
                    logStatus('WebSocket 連線已中斷。5 秒後嘗試重新連線...', 'orange');
                    setTimeout(setupWebSocket, 5000);
                };
                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    if (data.task_type === 'analysis_stage_performance' && (data.status === 'completed' || data.status === 'failed')) {
                         logStatus(`收到績效分析任務 #${data.task_id} 完成通知，正在刷新列表...`, 'purple');
                         renderTaskList();
                    } else if (data.task_type === 'analysis_stage_1' && data.status === 'completed') {
                         logStatus(`收到第一階段任務 #${data.task_id} 完成通知，正在刷新列表...`, 'purple');
                         renderTaskList();
                    }
                };
            };

            (async () => {
                logStatus('頁面載入完成，正在初始化...');
                await renderTaskList();
                setupWebSocket();
                logStatus('初始化完成。', 'green');
            })();
        });
    </script>
</body>
</html>
