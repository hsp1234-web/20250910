<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <!-- 版本同步：2025-09-15，確保前端與後端 API 一致 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 分析 - 階段二 績效分析</title>
    <link rel="stylesheet" href="/static/css/nav.css">
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/page4.css">
</head>
<body>
    <nav class="top-nav">
        <ul>
            <li><a href="/">鳳凰主頁</a></li>
            <li><a href="/page1">網址提取</a></li>
            <li><a href="/page2">批次下載</a></li>
            <li><a href="/page3">檔案處理</a></li>
            <li><a href="/page4_stage1_ai" class="active">AI 分析</a></li>
            <li><a href="/page5">備份管理</a></li>
            <li><a href="/page6">金鑰管理</a></li>
            <li><a href="/page7">提示詞管理</a></li>
            <li><a href="/page9">績效儀表板</a></li>
        </ul>
    </nav>

    <div class="content">
        <h1>AI 分析流程</h1>

        <div class="sub-nav">
            <a href="/page4_stage1_ai" class="sub-nav-button">1. AI 分析</a>
            <a href="/page4_stage1_5_date" class="sub-nav-button">1.5. 日期推斷</a>
            <a href="/page4_stage2_performance" class="sub-nav-button active">2. 績效分析</a>
            <a href="/page4_stage3_report" class="sub-nav-button">3. 報告生成</a>
        </div>

        <div class="panel">
            <h2>階段二：本地績效分析</h2>
            <p>此處顯示已完成日期推斷的任務。勾選後即可開始進行本地量化績效分析 (使用 yfinance)。</p>

            <div class="action-bar">
                <div class="action-group">
                    <button id="select-all-button">全選可分析項</button>
                    <button id="deselect-all-button">取消全選</button>
                </div>
                <div class="action-group">
                    <button id="start-analysis-btn" class="primary-action">📊 開始績效分析</button>
                </div>
            </div>

            <!-- 卡片容器 -->
            <div id="file-cards-container">
                <p>正在載入已完成日期推斷的任務...</p>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <h2>狀態日誌</h2>
                <button id="copy-log-button" class="copy-button" title="複製日誌">複製</button>
            </div>
            <div id="status-area"></div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // --- DOM Element Cache ---
        const fileCardsContainer = document.getElementById('file-cards-container');
        const selectAllButton = document.getElementById('select-all-button');
        const deselectAllButton = document.getElementById('deselect-all-button');
        const startAnalysisBtn = document.getElementById('start-analysis-btn');
        const statusArea = document.getElementById('status-area');
        const copyLogButton = document.getElementById('copy-log-button');

        // --- Utility Functions ---
        const logStatus = (message, color = 'black') => {
            const timestamp = new Date().toLocaleTimeString('zh-TW', { hour12: false });
            statusArea.insertAdjacentHTML('afterbegin', `<p style="color: ${color};">[${timestamp}] ${message}</p>`);
        };

        // --- Core Render Functions ---
        const renderTaskList = async () => {
            try {
                logStatus('正在從後端獲取任務列表...');
                const response = await fetch('/api/analyzer/files_for_performance_analysis');
                if (!response.ok) throw new Error(`無法獲取待處理任務 (HTTP ${response.status})`);
                const tasks = await response.json();
                logStatus(`成功獲取 ${tasks.length} 個任務的資訊。`, 'green');

                if (tasks.length === 0) {
                    fileCardsContainer.innerHTML = '<p>目前沒有可進行績效分析的任務。請先完成日期推斷。</p>';
                    return;
                }

                const statusMap = {
                    'pending': '待分析',
                    'processing': '佇列中...',
                    'gemini_processing': 'AI 分析中...',
                    'completed': '✅ 分析完成',
                    'failed': '❌ 分析失敗'
                };

                let cardsHtml = '';
                tasks.forEach(task => {
                    const status = task.performance_status || 'pending';
                    const statusText = statusMap[status] || status;
                    const isPending = status === 'pending';
                    const isCompleted = status === 'completed';
                    const isFailed = status === 'failed';
                    const taskId = task.id;

                    cardsHtml += `
                        <div class="file-card status-${status}" data-task-id="${taskId}">
                            <div class="card-header">
                                <input type="checkbox" class="task-checkbox" value="${taskId}" ${!isPending ? 'disabled' : ''}>
                                <h3 class="filename" title="${task.filename}">${task.filename}</h3>
                            </div>
                            <div class="card-body">
                                <div class="info-grid">
                                    <div class="info-item"><strong>分析狀態:</strong> <span class="status-badge">${statusText}</span></div>
                                    <div class="info-item"><strong>分析工具:</strong> <span class="model-name">yfinance (本地)</span></div>
                                </div>
                            </div>
                            <div class="card-footer">
                                <button class="action-btn btn-performance" data-task-id="${taskId}" ${!(isCompleted || isFailed) ? 'disabled' : ''}>查看績效報告</button>
                                <a href="/page8?hash=${task.file_hash}" class="action-btn btn-details" ${!task.file_hash ? 'style="display:none;"' : ''}>詳細資料</a>
                                <button class="action-btn btn-retry" data-task-id="${taskId}" style="display: ${isFailed ? 'inline-block' : 'none'};">重試分析</button>
                            </div>
                            <div class="json-viewer-container" style="display: none;"></div>
                            ${isFailed ? `<div class="error-log-container"><strong class="error-title">錯誤日誌:</strong><pre class="error-log">${task.performance_error_log || '無詳細錯誤資訊。'}</pre></div>` : ''}
                        </div>
                    `;
                });
                fileCardsContainer.innerHTML = cardsHtml;
            } catch (error) {
                logStatus(`載入任務列表失敗: ${error.message}`, 'red');
                fileCardsContainer.innerHTML = `<p style="color:red;">載入任務列表失敗: ${error.message}</p>`;
            }
        };

        // --- API Call Functions ---
        const startAnalysisForTasks = async (taskIds, buttonToUpdate = null) => {
            if (taskIds.length === 0) return alert('請至少選擇一個任務。');

            if (buttonToUpdate) {
                buttonToUpdate.disabled = true;
                buttonToUpdate.textContent = '請求中...';
            }

            logStatus(`啟動績效分析，共 ${taskIds.length} 個任務...`, 'blue');
            try {
                const response = await fetch('/api/analyzer/start_performance_analysis', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ task_ids: taskIds })
                });
                const result = await response.json();
                if (response.ok) {
                    logStatus(`分析請求已成功發送: ${result.message}`, 'green');
                    logStatus('稍後將自動更新列表...', 'purple');
                    setTimeout(renderTaskList, 1000);
                } else {
                    throw new Error(result.detail || '未知錯誤');
                }
            } catch (error) {
                logStatus(`啟動分析失敗: ${error.message}`, 'red');
                if (buttonToUpdate) {
                    buttonToUpdate.disabled = false;
                    buttonToUpdate.textContent = '重試分析';
                }
            }
        };

        // --- Event Listeners ---
        startAnalysisBtn.addEventListener('click', () => {
            const selectedIds = Array.from(document.querySelectorAll('.task-checkbox:checked')).map(cb => parseInt(cb.value, 10));
            startAnalysisForTasks(selectedIds);
        });

        fileCardsContainer.addEventListener('click', async (e) => {
            if (e.target.classList.contains('btn-performance')) {
                const button = e.target;
                const card = button.closest('.file-card');
                const viewer = card.querySelector('.json-viewer-container');
                const taskId = button.dataset.taskId;

                if (viewer.style.display === 'none') {
                    button.disabled = true;
                    button.textContent = '載入中...';
                    try {
                        const response = await fetch(`/api/analyzer/stage2_result/${taskId}`);
                        if (!response.ok) {
                             const errorData = await response.json().catch(() => ({ detail: '無法解析錯誤訊息。' }));
                             throw new Error(errorData.detail || `無法獲取績效報告 (HTTP ${response.status})`);
                        }
                        const data = await response.json();

                        let contentHtml = '';

                        // 處理圖表
                        if (data && data.chart_html) {
                            contentHtml += `<div class="performance-chart">${data.chart_html}</div>`;
                        } else {
                            contentHtml += `<p>此報告沒有可用的圖表。</p>`;
                        }

                        // 處理績效統計數據
                        if (data && data.stats) {
                            contentHtml += `
                                <details class="performance-stats-details">
                                    <summary>顯示/隱藏詳細績效數據</summary>
                                    <pre>${JSON.stringify(data.stats, null, 2)}</pre>
                                </details>
                            `;
                        }

                        // 處理錯誤訊息
                        if (data && data.error) {
                            contentHtml += `<div class="error-log-container"><strong class="error-title">分析錯誤:</strong><pre class="error-log">${data.error}</pre></div>`;
                        }


                        viewer.innerHTML = contentHtml;
                        viewer.style.display = 'block';
                        button.textContent = '隱藏報告';
                    } catch (error) {
                        viewer.innerHTML = `<p style="color:red;">載入失敗: ${error.message}</p>`;
                        viewer.style.display = 'block';
                        button.textContent = '查看績效報告';
                    } finally {
                        button.disabled = false;
                    }
                } else {
                    viewer.style.display = 'none';
                    viewer.innerHTML = '';
                    button.textContent = '查看績效報告';
                }
            }

            if (e.target.classList.contains('btn-retry')) {
                const button = e.target;
                const taskId = parseInt(button.dataset.taskId, 10);
                startAnalysisForTasks([taskId], button);
            }
        });

        selectAllButton.addEventListener('click', () => document.querySelectorAll('.task-checkbox:not(:disabled)').forEach(cb => cb.checked = true));
        deselectAllButton.addEventListener('click', () => document.querySelectorAll('.task-checkbox:checked').forEach(cb => cb.checked = false));

        copyLogButton.addEventListener('click', () => {
            navigator.clipboard.writeText(statusArea.innerText).then(() => {
                const originalText = copyLogButton.innerText;
                copyLogButton.innerText = '已複製 ✅';
                setTimeout(() => { copyLogButton.innerText = originalText; }, 2000);
            });
        });

        const setupWebSocket = () => {
            const ws = new WebSocket(`${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}/api/ws`);
            ws.onopen = () => logStatus('WebSocket 狀態更新連線成功。', 'blue');
            ws.onclose = () => {
                logStatus('WebSocket 連線已中斷。5 秒後嘗試重新連線...', 'orange');
                setTimeout(setupWebSocket, 5000);
            };
            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.task_type === 'analysis_stage_performance') {
                         logStatus(`收到績效分析任務 #${data.task_id} 狀態更新: ${data.status}。正在刷新列表...`, 'purple');
                         renderTaskList();
                    } else if (data.task_type === 'analysis_stage_date_inference' && data.status === 'completed') {
                         logStatus(`收到日期推斷任務 #${data.task_id} 完成通知，正在刷新列表...`, 'purple');
                         renderTaskList();
                    }
                } catch (err) {
                    logStatus(`處理 WebSocket 訊息時發生錯誤: ${err}`, 'red');
                }
            };
        };

        (async () => {
            logStatus('頁面載入完成，正在初始化...');
            await renderTaskList();
            setupWebSocket();
            logStatus('初始化完成，等待操作。', 'green');
        })();
    });
    </script>
</body>
</html>
