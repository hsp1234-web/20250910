<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一級交易商與美國公債分析</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <style>
        /* --- 此頁面專用樣式 --- */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
        }
        .chart-container {
            width: 100%;
            background-color: #f9f9f9;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chart-container img {
            width: 100%;
            height: auto;
            border: 1px solid #ddd;
        }
        .chart-container .placeholder {
            color: #888;
            font-size: 1rem;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background-color: #fff;
            border-bottom: 1px solid #ddd;
        }
        .navbar-brand {
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
            text-decoration: none;
        }
        .navbar-links {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
        }
        .navbar-links li {
            margin-left: 20px;
        }
        .navbar-links a {
            text-decoration: none;
            color: #555;
            font-size: 1rem;
        }
        .navbar-links a.active {
            font-weight: bold;
            color: #007bff;
        }
        /* --- 新增的日期選擇器樣式 --- */
        .date-selector-container {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #eef7ff; /* 淡藍色背景 */
            border: 1px solid #d1e7fd;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap; /* 在小螢幕上換行 */
        }
        .date-selector-container label {
            font-weight: bold;
            color: #333;
        }
        .date-selector-container input[type="date"] {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        .date-selector-container button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
        }
        .date-selector-container button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <!-- 導覽列 -->
    <nav class="navbar">
        <a href="/" class="navbar-brand">返回主頁</a>
    </nav>

    <div class="content">
        <h1>一級交易商壓力指數儀表板</h1>

        <!-- 日期選擇器容器 -->
        <div class="date-selector-container">
            <label for="start-date">起始日期:</label>
            <input type="date" id="start-date">
            <label for="end-date">結束日期:</label>
            <input type="date" id="end-date">
            <button id="update-charts-btn">更新圖表</button>
        </div>

        <div class="dashboard-grid">
            <!-- 12 張圖表卡片 -->
            <div class="panel" data-indicator-id="sofr">
                <h2>SOFR (擔保隔夜融資利率)</h2>
                <div class="chart-container">
                    <img id="chart-img-sofr" src="" alt="圖表載入中..." />
                </div>
            </div>
            <div class="panel" data-indicator-id="ofr_fci">
                <h2>OFR FCI (金融壓力指數)</h2>
                <div class="chart-container">
                    <img id="chart-img-ofr_fci" src="" alt="圖表載入中..." />
                </div>
            </div>
            <div class="panel" data-indicator-id="vix">
                <h2>VIX (恐慌指數)</h2>
                <div class="chart-container">
                    <img id="chart-img-vix" src="" alt="圖表載入中..." />
                </div>
            </div>
            <div class="panel" data-indicator-id="us_bond_2y_10y_spread">
                <h2>美債2年與10年利差</h2>
                <div class="chart-container">
                    <img id="chart-img-us_bond_2y_10y_spread" src="" alt="圖表載入中..." />
                </div>
            </div>
            <div class="panel" data-indicator-id="us_high_yield_spread">
                <h2>高收益債利差</h2>
                <div class="chart-container">
                    <img id="chart-img-us_high_yield_spread" src="" alt="圖表載入中..." />
                </div>
            </div>
            <div class="panel" data-indicator-id="stress_index">
                <h2>綜合壓力指數</h2>
                <div class="chart-container">
                    <img id="chart-img-stress_index" src="" alt="圖表載入中..." />
                </div>
            </div>
            <div class="panel" data-indicator-id="dealer_net_positions">
                <h2>淨部位</h2>
                <div class="chart-container">
                    <img id="chart-img-dealer_net_positions" src="" alt="圖表載入中..." />
                </div>
            </div>
            <div class="panel" data-indicator-id="dealer_long_term_positions">
                <h2>長天期淨部位</h2>
                <div class="chart-container">
                    <img id="chart-img-dealer_long_term_positions" src="" alt="圖表載入中..." />
                </div>
            </div>
            <div class="panel" data-indicator-id="dealer_short_term_positions">
                <h2>短天期淨部位</h2>
                <div class="chart-container">
                    <img id="chart-img-dealer_short_term_positions" src="" alt="圖表載入中..." />
                </div>
            </div>
            <div class="panel" data-indicator-id="dealer_net_position_ranking">
                <h2>淨部位排名</h2>
                <div class="chart-container">
                    <img id="chart-img-dealer_net_position_ranking" src="" alt="圖表載入中..." />
                </div>
            </div>
            <div class="panel" data-indicator-id="dealer_position_change_ranking">
                <h2>淨部位變動排名</h2>
                <div class="chart-container">
                    <img id="chart-img-dealer_position_change_ranking" src="" alt="圖表載入中..." />
                </div>
            </div>
            <div class="panel" data-indicator-id="stress_index_macd">
                <h2>壓力指數MACD</h2>
                <div class="chart-container">
                    <img id="chart-img-stress_index_macd" src="" alt="圖表載入中..." />
                </div>
            </div>
        </div>
    </div>

    <!-- 引用對應的 JavaScript 檔案 -->
    <script src="/static/js/primary_dealer_analysis.js"></script>
</body>
</html>
