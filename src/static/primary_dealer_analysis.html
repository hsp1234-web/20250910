<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一級交易商分析儀表板</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <!-- 引入 Chart.js 和其日期適配器 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/date-fns"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <style>
        /* --- 此頁面專用樣式 --- */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
        }
        .chart-container {
            width: 100%;
            background-color: #f9f9f9;
            min-height: 300px; /* 避免圖表載入前容器塌陷 */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            position: relative; /* 用於可能的加載指示器定位 */
        }
        /* 更新樣式以適應 canvas */
        .chart-container canvas {
            max-width: 100%;
            max-height: 100%;
        }
        .chart-container .placeholder {
            color: #888;
            font-size: 1rem;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background-color: #fff;
            border-bottom: 1px solid #ddd;
        }
        .navbar-brand {
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
            text-decoration: none;
        }
        .navbar-links {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
        }
        .navbar-links li {
            margin-left: 20px;
        }
        .navbar-links a {
            text-decoration: none;
            color: #555;
            font-size: 1rem;
        }
        .navbar-links a.active {
            font-weight: bold;
            color: #007bff;
        }
        @media (max-width: 600px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- 導覽列 -->
    <nav class="navbar">
        <a href="/" class="navbar-brand">返回主頁</a>
    </nav>

    <div class="content">
        <h1>一級交易商壓力指數儀表板</h1>

        <div class="panel date-filter-panel">
            <label for="start-date">開始日期:</label>
            <input type="date" id="start-date">
            <label for="end-date">結束日期:</label>
            <input type="date" id="end-date">
            <button id="update-charts-btn">更新圖表</button>
        </div>

        <div class="dashboard-grid">
            <!-- 12 張圖表卡片 (img 已被替換為 canvas) -->
            <div class="panel" data-indicator-id="sofr">
                <h2>SOFR (擔保隔夜融資利率)</h2>
                <div class="chart-container">
                    <canvas id="chart-canvas-sofr"></canvas>
                </div>
            </div>
            <div class="panel" data-indicator-id="ofr_fci">
                <h2>OFR FCI (金融壓力指數)</h2>
                <div class="chart-container">
                    <canvas id="chart-canvas-ofr_fci"></canvas>
                </div>
            </div>
            <div class="panel" data-indicator-id="vix">
                <h2>VIX (恐慌指數)</h2>
                <div class="chart-container">
                    <canvas id="chart-canvas-vix"></canvas>
                </div>
            </div>
            <div class="panel" data-indicator-id="us_bond_2y_10y_spread">
                <h2>美債2年與10年利差</h2>
                <div class="chart-container">
                    <canvas id="chart-canvas-us_bond_2y_10y_spread"></canvas>
                </div>
            </div>
            <div class="panel" data-indicator-id="us_high_yield_spread">
                <h2>高收益債數據 (HYG)</h2>
                <div class="chart-container">
                    <canvas id="chart-canvas-us_high_yield_spread"></canvas>
                </div>
            </div>
            <div class="panel" data-indicator-id="stress_index">
                <h2>綜合壓力指數</h2>
                <div class="chart-container">
                    <canvas id="chart-canvas-stress_index"></canvas>
                </div>
            </div>
            <div class="panel" data-indicator-id="dealer_net_positions">
                <h2>淨部位</h2>
                <div class="chart-container">
                    <canvas id="chart-canvas-dealer_net_positions"></canvas>
                </div>
            </div>
            <div class="panel" data-indicator-id="dealer_long_term_positions">
                <h2>長天期淨部位</h2>
                <div class="chart-container">
                    <canvas id="chart-canvas-dealer_long_term_positions"></canvas>
                </div>
            </div>
            <div class="panel" data-indicator-id="dealer_short_term_positions">
                <h2>短天期淨部位</h2>
                <div class="chart-container">
                    <canvas id="chart-canvas-dealer_short_term_positions"></canvas>
                </div>
            </div>
            <div class="panel" data-indicator-id="dealer_net_position_ranking">
                <h2>淨部位排名</h2>
                <div class="chart-container">
                    <canvas id="chart-canvas-dealer_net_position_ranking"></canvas>
                </div>
            </div>
            <div class="panel" data-indicator-id="dealer_position_change_ranking">
                <h2>淨部位變動排名</h2>
                <div class="chart-container">
                    <canvas id="chart-canvas-dealer_position_change_ranking"></canvas>
                </div>
            </div>
            <div class="panel" data-indicator-id="stress_index_macd">
                <h2>壓力指數MACD</h2>
                <div class="chart-container">
                    <canvas id="chart-canvas-stress_index_macd"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- 引用對應的 JavaScript 檔案 -->
    <script src="/static/js/primary_dealer_analysis.js"></script>
</body>
</html>
