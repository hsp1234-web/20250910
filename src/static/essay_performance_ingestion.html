<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小作文績效 - 資料擷取</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/essay_performance_tabs.css">
    <!-- 參考 page1_sub_ingestion.html 的樣式 -->
    <link rel="stylesheet" href="/static/css/page1_unified.css">
</head>
<body>
    <div class="navbar">
        <a href="/" class="navbar-brand">鳳凰主頁</a>
        <ul class="navbar-links" id="navbar-links">
        </ul>
    </div>
    <div class="content">
        <div class="panel">
            <h1>小作文績效</h1>
            <div class="tab-container" style="margin-top: 20px;">
                <a href="/essay_performance/ingestion" class="tab-button active">資料擷取與處理</a>
                <a href="/essay_performance/processing" class="tab-button">本地AI處理</a>
                <a href="/essay_performance/report" class="tab-button">報告生成</a>
            </div>
        </div>
        <div class="panel">
            <div class="ingestion-buttons">
                <button id="submit-button-top">開始處理</button>
            </div>
            <h2>資料擷取與處理</h2>
            <p>請在此處貼上 LINE 聊天記錄...</p>
            <textarea id="text-input" rows="20" placeholder="在此貼上來源文字..."></textarea>
            <div class="ingestion-buttons">
                <button id="submit-button-bottom">開始處理</button>
            </div>
            <div id="status-message" style="margin-top: 20px; font-weight: bold; text-align: center;"></div>
        </div>
    </div>

    <script>
        const textInput = document.getElementById('text-input');
        const submitButtonTop = document.getElementById('submit-button-top');
        const submitButtonBottom = document.getElementById('submit-button-bottom');
        const statusMessage = document.getElementById('status-message');

        const handleSubmit = async () => {
            const text = textInput.value;
            if (!text.trim()) {
                statusMessage.textContent = '錯誤：輸入文字不可為空。';
                statusMessage.style.color = 'var(--error-color)';
                return;
            }

            statusMessage.textContent = '正在處理中，請稍候...';
            statusMessage.style.color = 'var(--primary-color)';

            try {
                // 核心修改：呼叫新的代理端點
                const response = await fetch('/api/essay_performance/ingest_text', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text }),
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.detail || '伺服器發生錯誤');
                }

                // 核心修改：顯示來自微服務的回應訊息
                statusMessage.textContent = result.message || '處理完成。';
                statusMessage.style.color = 'var(--success-color)';

            } catch (error) {
                statusMessage.textContent = `發生錯誤：${error.message}`;
                statusMessage.style.color = 'var(--error-color)';
            }
        };

        submitButtonTop.addEventListener('click', handleSubmit);
        submitButtonBottom.addEventListener('click', handleSubmit);
    </script>

    <!-- V5.5 Readiness Overlay Start -->
    <style>
        #readiness-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5em;
            z-index: 9999;
            flex-direction: column;
            text-align: center;
        }
        #readiness-overlay .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #fff;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <div id="readiness-overlay">
        <div class="spinner"></div>
        <p>系統正在初始化核心服務，請稍候...</p>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const overlay = document.getElementById('readiness-overlay');
            const buttons = document.querySelectorAll('button, a.button, input[type="button"], input[type="submit"]');

            function enableUI() {
                overlay.style.display = 'none';
                buttons.forEach(btn => {
                    btn.disabled = false;
                });
            }

            if (sessionStorage.getItem('isSystemReady') === 'true') {
                enableUI();
                const overlayText = overlay.querySelector('p');
                if(overlayText) {
                    overlayText.innerText = '系統已就緒';
                }
                return;
            }

            buttons.forEach(btn => {
                if (!btn.closest('.navbar')) {
                    btn.disabled = true;
                }
            });
            overlay.style.display = 'flex';

            const readinessInterval = setInterval(() => {
                fetch('/api/health/ready')
                    .then(response => {
                        if (response.ok) {
                            clearInterval(readinessInterval);
                            sessionStorage.setItem('isSystemReady', 'true');
                            enableUI();
                        } else {
                            console.log('等待核心服務就緒...');
                        }
                    })
                    .catch(error => {
                        console.error('輪詢就緒狀態時發生錯誤:', error);
                        const overlayText = overlay.querySelector('p');
                        if(overlayText) {
                            overlayText.innerText = '無法連接到後端服務，請檢查連線或稍後重試。';
                        }
                    });
            }, 2000);
        });
    </script>
    <!-- V5.5 Readiness Overlay End -->
</body>
</html>
