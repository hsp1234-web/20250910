<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小作文績效 - 資料擷取</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/nav.css"> <!-- (Jules) 補上導覽列樣式 -->
    <link rel="stylesheet" href="/static/css/essay_performance_tabs.css">
    <link rel="stylesheet" href="/static/css/page1_unified.css">
</head>
<body>
    <!-- (Jules) 替換為標準的 top-nav 導覽列 -->
    <nav class="top-nav">
        <ul>
            <li><a href="/">鳳凰主頁</a></li>
            <li><a href="/page1">資料處理</a></li>
            <li><a href="/page2">批次下載</a></li>
            <li><a href="/page3">檔案處理</a></li>
            <li><a href="/page4_stage1_ai">AI 分析</a></li>
            <li><a href="/page5">備份管理</a></li>
            <li><a href="/page6">金鑰管理</a></li>
            <li><a href="/page7">提示詞管理</a></li>
            <li><a href="/page9">績效儀表板</a></li>
            <li><a href="/essay_performance/ingestion" class="active">小作文績效</a></li>
        </ul>
    </nav>
    <div class="content">
        <div class="panel">
            <h1>小作文績效</h1>
            <div class="tab-container" style="margin-top: 20px;">
                <a href="/essay_performance/ingestion" class="tab-button active">資料擷取與處理</a>
                <a href="/essay_performance/processing" class="tab-button">本地AI處理</a>
                <a href="/essay_performance/report" class="tab-button">報告生成</a>
            </div>
        </div>
        <div class="panel">
            <div class="ingestion-buttons">
                <button id="submit-button-top">開始處理</button>
            </div>
            <h2>資料擷取與處理</h2>
            <p>請在此處貼上 LINE 聊天記錄...</p>
            <textarea id="text-input" rows="15" placeholder="在此貼上來源文字..."></textarea>
            <div class="ingestion-buttons">
                <button id="submit-button-bottom">開始處理</button>
            </div>
            <div id="status-message" style="margin-top: 20px; font-weight: bold; text-align: center;"></div>
        </div>

        <!-- (Jules @ 2025-10-07) 新增的結果區塊 -->
        <div id="result-panel" class="panel" style="display: none;">
            <h2>處理結果</h2>
            <div class="action-bar">
                <button id="select-all-btn">全選</button>
                <button id="deselect-all-btn">取消全選</button>
                <button id="next-step-btn" class="button-primary">下一步：開始本地AI處理 &raquo;</button>
            </div>
            <div class="table-container">
                <table class="results-table">
                    <thead>
                        <tr>
                            <th>選取</th>
                            <th>日期</th>
                            <th>作者</th>
                            <th>標題</th>
                            <th>連結</th>
                        </tr>
                    </thead>
                    <tbody id="result-body">
                        <!-- JavaScript 動態填入 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const textInput = document.getElementById('text-input');
        const submitButtonTop = document.getElementById('submit-button-top');
        const submitButtonBottom = document.getElementById('submit-button-bottom');
        const statusMessage = document.getElementById('status-message');
        const resultPanel = document.getElementById('result-panel');
        const resultBody = document.getElementById('result-body');
        const selectAllBtn = document.getElementById('select-all-btn');
        const deselectAllBtn = document.getElementById('deselect-all-btn');
        const nextStepBtn = document.getElementById('next-step-btn');

        // (Jules @ 2025-10-10) 整合修改：
        // 1. 新增 renderTable 函式，用於將項目資料渲染到表格中。
        // 2. 新增 loadExistingItems 函式，用於在頁面載入時從後端獲取並顯示所有項目。
        // 3. 修改 handleSubmit，使其在處理完成後呼叫 loadExistingItems 來刷新整個列表。
        // 4. 在頁面載入完成時 (DOMContentLoaded) 呼叫 loadExistingItems。

        const renderTable = (items) => {
            resultBody.innerHTML = ''; // 清空現有表格內容
            if (items && items.length > 0) {
                items.forEach(item => {
                    const row = document.createElement('tr');
                    row.dataset.itemId = item.id; // 方便未來操作
                    row.innerHTML = `
                        <td><input type="checkbox" class="result-checkbox" value="${item.id}"></td>
                        <td>${item.message_date ? item.message_date.split(' ')[0] : '---'}</td>
                        <td>${item.author || '---'}</td>
                        <td>${item.title || '無標題'}</td>
                        <td><a href="${item.url}" target="_blank" rel="noopener noreferrer">查看連結</a></td>
                    `;
                    resultBody.appendChild(row);
                });
                resultPanel.style.display = 'block';
            } else {
                // 如果沒有項目，可以選擇隱藏表格或顯示提示訊息
                resultPanel.style.display = 'none';
            }
        };

        const loadExistingItems = async () => {
            statusMessage.textContent = '正在從資料庫載入既有項目...';
            statusMessage.style.color = 'var(--primary-color)';
            try {
                const response = await fetch('/api/essay_performance/items');
                if (!response.ok) {
                    const errorResult = await response.json();
                    throw new Error(errorResult.detail || '無法載入項目列表');
                }
                const items = await response.json();
                renderTable(items);
                statusMessage.textContent = items.length > 0 ? `成功載入 ${items.length} 個項目。` : '資料庫目前沒有已處理的項目。';
                statusMessage.style.color = 'var(--success-color)';
            } catch (error) {
                statusMessage.textContent = `載入歷史項目時發生錯誤：${error.message}`;
                statusMessage.style.color = 'var(--error-color)';
                resultPanel.style.display = 'none';
            }
        };

        const handleSubmit = async () => {
            const text = textInput.value;
            if (!text.trim()) {
                statusMessage.textContent = '錯誤：輸入文字不可為空。';
                statusMessage.style.color = 'var(--error-color)';
                return;
            }

            statusMessage.textContent = '正在處理中，請稍候...';
            statusMessage.style.color = 'var(--primary-color)';

            try {
                const response = await fetch('/api/essay_performance/ingest_text', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text }),
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.detail || '伺服器發生錯誤');
                }

                // 處理成功後，清除輸入框並重新載入整個列表
                textInput.value = '';
                statusMessage.textContent = result.message || '處理完成，正在刷新列表...';
                statusMessage.style.color = 'var(--success-color)';

                await loadExistingItems(); // 重新載入以顯示包含新項目的完整列表

            } catch (error) {
                statusMessage.textContent = `發生錯誤：${error.message}`;
                statusMessage.style.color = 'var(--error-color)';
            }
        };

        const setAllCheckboxes = (checked) => {
            document.querySelectorAll('.result-checkbox').forEach(cb => {
                cb.checked = checked;
            });
        };

        selectAllBtn.addEventListener('click', () => setAllCheckboxes(true));
        deselectAllBtn.addEventListener('click', () => setAllCheckboxes(false));

        nextStepBtn.addEventListener('click', () => {
            const selectedIds = Array.from(document.querySelectorAll('.result-checkbox:checked'))
                                     .map(cb => cb.value);

            if (selectedIds.length === 0) {
                alert('請至少選取一個項目以進行下一步處理。');
                return;
            }

            const idsQueryString = selectedIds.join(',');
            window.location.href = `/essay_performance/processing?ids=${idsQueryString}`;
        });

        submitButtonTop.addEventListener('click', handleSubmit);
        submitButtonBottom.addEventListener('click', handleSubmit);
    </script>

    <!-- V5.5 Readiness Overlay -->
    <style>
        #readiness-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7); color: white;
            display: flex; justify-content: center; align-items: center;
            font-size: 1.5em; z-index: 9999; flex-direction: column; text-align: center;
        }
        #readiness-overlay .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3); border-radius: 50%;
            border-top: 4px solid #fff; width: 40px; height: 40px;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <div id="readiness-overlay"><div class="spinner"></div><p>系統正在初始化核心服務，請稍候...</p></div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // (Jules @ 2025-10-10) 在頁面載入後，立即載入既有項目
            loadExistingItems();

            const overlay = document.getElementById('readiness-overlay');
            const buttons = document.querySelectorAll('button, a.button, input[type="button"], input[type="submit"]');

            function enableUI() {
                overlay.style.display = 'none';
                buttons.forEach(btn => { btn.disabled = false; });
            }

            if (sessionStorage.getItem('isSystemReady') === 'true') {
                enableUI();
                const overlayText = overlay.querySelector('p');
                if(overlayText) overlayText.innerText = '系統已就緒';
                return;
            }

            buttons.forEach(btn => { if (!btn.closest('.navbar')) btn.disabled = true; });
            overlay.style.display = 'flex';

            const readinessInterval = setInterval(() => {
                fetch('/api/health/ready')
                    .then(response => {
                        if (response.ok) {
                            clearInterval(readinessInterval);
                            sessionStorage.setItem('isSystemReady', 'true');
                            enableUI();
                        }
                    })
                    .catch(error => {
                        console.error('輪詢就緒狀態時發生錯誤:', error);
                        const overlayText = overlay.querySelector('p');
                        if(overlayText) overlayText.innerText = '無法連接到後端服務。';
                    });
            }, 2000);
        });
    </script>
</body>
</html>
