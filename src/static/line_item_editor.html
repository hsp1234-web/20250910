<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>項目編輯器</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/nav.css">
    <style>
        .editor-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
        }
        .metadata-panel, .content-panel {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 1.5rem;
        }
        .metadata-item {
            margin-bottom: 1rem;
        }
        .metadata-label {
            font-weight: bold;
            color: #495057;
        }
        .metadata-value {
            color: #212529;
            word-break: break-all;
        }
        textarea {
            width: 100%;
            min-height: 200px;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ced4da;
            font-family: monospace;
            font-size: 0.9em;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
    <nav class="top-nav">
        <ul>
            <li><a href="/">鳳凰主頁</a></li>
            <li><a href="/line_data_viewer">返回資料檢視器</a></li>
        </ul>
    </nav>

    <div class="content">
        <div class="panel">
            <h1 id="editor-title">項目編輯器</h1>
            <div id="editor-grid" class="editor-grid">
                <div id="metadata-panel" class="metadata-panel">
                    <h2>項目元數據</h2>
                    <!-- 元數據將由 JS 填入 -->
                </div>
                <div id="content-panel" class="content-panel">
                    <h2>內容編輯</h2>
                    <form id="edit-form">
                        <div class="form-group">
                            <label for="content-text" class="metadata-label">提取的文字內容</label>
                            <textarea id="content-text" name="extracted_text"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="ai-summary" class="metadata-label">AI 摘要</label>
                            <textarea id="ai-summary" name="ai_summary"></textarea>
                        </div>
                        <button type="submit" class="button-primary">儲存變更</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const editorTitleEl = document.getElementById('editor-title');
            const metadataPanelEl = document.getElementById('metadata-panel');
            const contentTextArea = document.getElementById('content-text');
            const summaryTextArea = document.getElementById('ai-summary');
            const editForm = document.getElementById('edit-form');

            const urlParams = new URLSearchParams(window.location.search);
            const itemId = urlParams.get('id');

            const renderMetadata = (item) => {
                let statusesHTML = '<h3>精細化狀態</h3>';
                const statusFields = {
                    'status_download': '下載狀態',
                    'status_extraction': '提取狀態',
                    'status_ocr': 'OCR 狀態',
                    'status_ai_summary': 'AI 摘要狀態'
                };
                for (const [key, label] of Object.entries(statusFields)) {
                    statusesHTML += `<p><strong>${label}:</strong> ${item[key] || 'N/A'}</p>`;
                }

                metadataPanelEl.innerHTML = `
                    <h2>項目元數據</h2>
                    <div class="metadata-item">
                        <div class="metadata-label">ID</div>
                        <div class="metadata-value">${item.id}</div>
                    </div>
                    <div class="metadata-item">
                        <div class="metadata-label">發言者</div>
                        <div class="metadata-value">${item.author || 'N/A'}</div>
                    </div>
                    <div class="metadata-item">
                        <div class="metadata-label">原始訊息/網址</div>
                        <div class="metadata-value">${item.url}</div>
                    </div>
                     <div class="metadata-item">
                        <div class="metadata-label">總體狀態</div>
                        <div class="metadata-value">${item.status}</div>
                    </div>
                    <hr>
                    ${statusesHTML}
                `;
            };

            const fetchItemDetails = async () => {
                if (!itemId) {
                    editorTitleEl.textContent = '錯誤：未提供項目 ID';
                    return;
                }
                try {
                    const response = await fetch(`/api/line_data/item/${itemId}`);
                    if (!response.ok) {
                        throw new Error('無法獲取項目詳情');
                    }
                    const item = await response.json();

                    editorTitleEl.textContent = `編輯項目 #${item.id}`;
                    renderMetadata(item);
                    contentTextArea.value = item.extracted_text || '';
                    summaryTextArea.value = item.ai_summary || '';

                } catch (error) {
                    editorTitleEl.textContent = `錯誤: ${error.message}`;
                }
            };

            editForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const saveButton = e.target.querySelector('button[type="submit"]');
                saveButton.disabled = true;
                saveButton.textContent = '儲存中...';

                const payload = {
                    extracted_text: contentTextArea.value,
                    ai_summary: summaryTextArea.value
                };

                try {
                    const response = await fetch(`/api/line_data/item/${itemId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.detail || '儲存失敗');
                    }

                    alert('儲存成功！');

                } catch (error) {
                    alert(`錯誤: ${error.message}`);
                } finally {
                    saveButton.disabled = false;
                    saveButton.textContent = '儲存變更';
                }
            });

            fetchItemDetails();
        });
    </script>
</body>
</html>
