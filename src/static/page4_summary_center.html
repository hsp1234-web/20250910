<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摘要中心</title>
    <link rel="stylesheet" href="/static/css/nav.css">
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/page4.css">
    <link rel="stylesheet" href="/static/css/page4_summary.css">
</head>
<body>
    <nav class="top-nav">
        <ul>
            <li><a href="/">鳳凰主頁</a></li>
            <li><a href="/page1">資料擷取</a></li>
            <li><a href="/page2">批次下載</a></li>
            <li><a href="/page3">檔案處理</a></li>
            <li><a href="/page4_stage1_ai" class="active">AI分析</a></li>
            <li><a href="/page5">系統備份</a></li>
            <li><a href="/page6">金鑰管理</a></li>
            <li><a href="/page7">提示詞管理</a></li>
            <li><a href="/page9">績效儀表板</a></li>
            <li><a href="/page_bond">債券分析</a></li>
        </ul>
    </nav>

    <div class="main-container">
        <h1>AI 分析流程</h1>

        <div class="sub-nav">
            <a href="/page4_summary_center" class="sub-nav-button active">0. 重點摘要</a>
            <a href="/page4_stage1_ai" class="sub-nav-button">1. AI 分析</a>
            <a href="/page4_stage1_5_date" class="sub-nav-button">1.5. 日期推斷</a>
            <a href="/page4_stage2_performance" class="sub-nav-button">2. 績效分析</a>
            <a href="/page4_stage3_report" class="sub-nav-button">3. 報告生成</a>
            <a href="/page4_stage4_download" class="sub-nav-button">4. Word 報告下載</a>
        </div>

        <div class="content">
            <div class="panel">
                <h2>階段零：重點摘要生成</h2>
                <p>在此處，您可以為已完成內容提取的文件，生成 AI 重點摘要「小作文」。</p>
                <div class="controls">
                    <button id="select-all">全選</button>
                    <button id="deselect-all">取消全選</button>
                    <div class="model-selector">
                        <label for="model-select">分析模型:</label>
                        <select id="model-select" disabled>
                            <option>正在檢查金鑰...</option>
                        </select>
                    </div>
                    <button id="start-summary-btn" class="start-btn" disabled>✨ 開始生成重點摘要</button>
                    <button id="toggle-all-summaries">📖 全部展開/收合</button>
                </div>
            </div>

            <div class="panel">
                <div id="card-container" class="card-grid">
                    <!-- Cards will be dynamically generated here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const modelSelect = document.getElementById('model-select');
            const startBtn = document.getElementById('start-summary-btn');
            const cardContainer = document.getElementById('card-container');
            const selectAllBtn = document.getElementById('select-all');
            const deselectAllBtn = document.getElementById('deselect-all');
            const toggleAllBtn = document.getElementById('toggle-all-summaries');
            // JULES: Add status area reference
            const statusArea = document.getElementById('status-area');

            let tasks = [];

            // JULES: Add logStatus function
            const logStatus = (message, color = 'black') => {
                const statusAreaForLog = document.getElementById('status-area'); // Re-fetch in case of DOM re-render
                if (!statusAreaForLog) return;
                const timestamp = new Date().toLocaleTimeString('zh-TW', { hour12: false });
                statusAreaForLog.insertAdjacentHTML('afterbegin', `<p style="color: ${color};">[${timestamp}] ${message}</p>`);
            };

            const getStatusHTML = (status) => {
                const statusMap = {
                    'pending': '待處理',
                    'processing': '佇列中...',
                    'gemini_processing': '🤖 AI 分析中...',
                    'completed': '✅ 已完成',
                    'failed': '❌ 失敗'
                };
                const statusText = statusMap[status] || status || '待處理';
                const statusClass = status || 'pending';
                return `<span class="status-badge status-${statusClass}">${statusText}</span>`;
            };

            const escapeHtml = (unsafe) => {
                if (unsafe === null || typeof unsafe === 'undefined') return '';
                return unsafe.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
            }

            function renderCards() {
                cardContainer.innerHTML = '';
                if (tasks.length === 0) {
                    cardContainer.innerHTML = '<p>沒有可供摘要的檔案。請先完成「檔案處理」步驟。</p>';
                }

                tasks.forEach(task => {
                    const card = document.createElement('div');
                    card.className = 'file-card';
                    card.dataset.taskId = task.id;

                    const isActionable = task.summary_status === 'pending' || !task.summary_status;

                    card.innerHTML = `
                        <div class="card-header">
                            <input type="checkbox" class="task-checkbox" value="${task.id}" ${!isActionable ? 'disabled' : ''}>
                            <span class="card-title">任務 #${escapeHtml(task.id)}</span>
                        </div>
                        <div class="card-body">
                            <div class="info-grid">
                                <div class="info-item"><strong>標題:</strong> <span>${escapeHtml(task.title || task.filename)}</span></div>
                                <div class="info-item"><strong>作者:</strong> <span>${escapeHtml(task.author || 'N/A')}</span></div>
                                <div class="info-item"><strong>日期:</strong> <span>${escapeHtml(task.message_date || 'N/A')}</span></div>
                                <div class="info-item"><strong>摘要狀態:</strong> ${getStatusHTML(task.summary_status)}</div>
                                <div class="info-item"><strong>模型:</strong> <span class="model-name">${escapeHtml(task.summary_model || 'N/A')}</span></div>
                                <div class="info-item"><strong>Token 消耗:</strong> <span class="token-usage">${task.summary_token_usage || 'N/A'}</span></div>
                            </div>
                            ${task.summary_status === 'completed' || task.summary_status === 'failed' ? `
                            <div class="summary-container">
                                <button class="toggle-summary" data-task-id="${task.id}">▶️ 顯示詳細資訊</button>
                                <div class="summary-content" id="summary-${task.id}">
                                    ${task.summary_status === 'failed' ? `<pre class="error-log">${escapeHtml(task.summary_error_log)}</pre>` : ''}
                                    ${task.summary_status === 'completed' ? `<pre>${escapeHtml(task.summary_content)}</pre>` : ''}
                                </div>
                            </div>
                            ` : ''}
                        </div>
                    `;
                    cardContainer.appendChild(card);
                });
                updateButtonStates();
            }

            function updateButtonStates() {
                const anyChecked = document.querySelector('.task-checkbox:checked');
                startBtn.disabled = !anyChecked || modelSelect.disabled;
            }

            const populateModelSelector = (models) => {
                modelSelect.innerHTML = '';
                const priorityOrder = [
                    "models/gemini-2.0-flash-lite",
                    "models/gemini-1.5-flash",
                    "models/gemini-1.5-pro",
                    "models/gemini-pro"
                ];

                const sortedModels = [...models].sort((a, b) => {
                    let aPriority = priorityOrder.indexOf(a);
                    let bPriority = priorityOrder.indexOf(b);
                    if (aPriority === -1) aPriority = priorityOrder.length;
                    if (bPriority === -1) bPriority = priorityOrder.length;

                    if (aPriority !== bPriority) return aPriority - bPriority;
                    return a.localeCompare(b);
                });

                sortedModels.forEach(modelName => {
                    const option = new Option(modelName.replace('models/', ''), modelName);
                    modelSelect.add(option);
                });

                const defaultModel = "models/gemini-2.0-flash-lite";
                if (sortedModels.includes(defaultModel)) {
                    modelSelect.value = defaultModel;
                }
            };

            const checkKeysAndLoadModels = async () => {
                try {
                    const response = await fetch('/api/keys');
                    if (!response.ok) throw new Error('無法獲取 API 金鑰狀態');
                    const keys = await response.json();
                    const validKeys = keys.filter(k => k.is_valid);

                    if (validKeys.length > 0) {
                        const modelResponse = await fetch('/api/keys/models');
                        if (!modelResponse.ok) throw new Error('無法獲取模型列表');
                        const models = await modelResponse.json();
                        populateModelSelector(models);
                        modelSelect.disabled = false;
                    } else {
                        modelSelect.innerHTML = '<option value="">請先在「金鑰管理」頁面新增有效的 API 金鑰</option>';
                        modelSelect.disabled = true;
                    }
                } catch (error) {
                    console.error('檢查金鑰或載入模型時出錯:', error);
                    modelSelect.innerHTML = `<option value="">${error.message}</option>`;
                    modelSelect.disabled = true;
                }
                updateButtonStates();
            };

            const fetchTasks = async () => {
                try {
                    const response = await fetch('/api/analyzer/files_for_summary');
                    if (!response.ok) throw new Error(`獲取任務列表失敗 (HTTP ${response.status})`);
                    tasks = await response.json();
                    renderCards();
                } catch (error) {
                    cardContainer.innerHTML = `<p style="color:red;">${error.message}</p>`;
                }
            };

            // --- Event Listeners ---
            startBtn.addEventListener('click', async () => {
                const selectedIds = Array.from(document.querySelectorAll('.task-checkbox:checked')).map(cb => parseInt(cb.value));
                const modelName = modelSelect.value;
                if (selectedIds.length === 0 || !modelName) return;

                logStatus(`收到 ${selectedIds.length} 個摘要任務請求，正在發送至後端...`, 'blue');
                startBtn.disabled = true;
                startBtn.textContent = '正在啟動...';

                try {
                    // Optimistic UI update
                    selectedIds.forEach(id => {
                        const task = tasks.find(t => t.id === id);
                        if (task) {
                            task.summary_status = 'gemini_processing';
                        }
                    });
                    renderCards();

                    await fetch('/api/analyzer/start_summary_generation', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ task_ids: selectedIds, model_name: modelName })
                    });

                } catch (error) {
                    logStatus(`啟動分析失敗: ${error.message}`, 'red');
                    alert('啟動失敗，請查看控制台日誌。');
                    fetchTasks(); // Re-fetch to revert optimistic update on error
                } finally {
                    startBtn.textContent = '✨ 開始生成重點摘要';
                    updateButtonStates();
                }
            });

            selectAllBtn.addEventListener('click', () => {
                document.querySelectorAll('.task-checkbox:not(:disabled)').forEach(cb => cb.checked = true);
                updateButtonStates();
            });

            deselectAllBtn.addEventListener('click', () => {
                document.querySelectorAll('.task-checkbox:checked').forEach(cb => cb.checked = false);
                updateButtonStates();
            });

            cardContainer.addEventListener('change', e => {
                if (e.target.classList.contains('task-checkbox')) {
                    updateButtonStates();
                }
            });

            cardContainer.addEventListener('click', e => {
                if (e.target.classList.contains('toggle-summary')) {
                    const button = e.target;
                    const summaryContent = button.closest('.card-body').querySelector('.summary-content');
                    const isVisible = summaryContent.classList.toggle('visible');
                    button.textContent = isVisible ? '🔽 收合摘要' : '▶️ 展開摘要';
                }
            });

            toggleAllBtn.addEventListener('click', () => {
                const allSummaries = document.querySelectorAll('.summary-content');
                const allButtons = document.querySelectorAll('.toggle-summary');
                const shouldOpen = Array.from(allSummaries).some(s => !s.classList.contains('visible'));

                allSummaries.forEach(s => s.classList.toggle('visible', shouldOpen));
                allButtons.forEach(b => b.textContent = shouldOpen ? '🔽 收合摘要' : '▶️ 展開摘要');
            });

            // --- WebSocket ---
            function connectWebSocket() {
                const ws = new WebSocket(`${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}/api/ws`);

                ws.onopen = () => {
                    console.log('WebSocket 連線已建立。');
                    logStatus('WebSocket 連線成功。', 'blue');
                };

                ws.onmessage = (event) => {
                    console.log('收到 WebSocket 訊息:', event.data);
                    try {
                        const data = JSON.parse(event.data);
                        if (data.type === 'analysis_update' && data.task_id) {
                            logStatus(`收到任務 #${data.task_id} 的更新通知，正在刷新列表...`, 'purple');
                            fetchTasks();
                        }
                    } catch (e) {
                        console.error('處理 WebSocket 訊息時發生錯誤:', e);
                    }
                };

                ws.onerror = (error) => {
                    console.error('WebSocket 發生錯誤:', error);
                    logStatus('WebSocket 發生錯誤。', 'red');
                };

                ws.onclose = () => {
                    console.log('WebSocket 連線已關閉，將在 5 秒後嘗試重新連線...');
                    logStatus('WebSocket 連線已中斷。5 秒後嘗試重新連線...', 'orange');
                    setTimeout(connectWebSocket, 5000);
                };
            }

            // --- Initialization ---
            checkKeysAndLoadModels();
            fetchTasks();
            connectWebSocket();
        });
    </script>
</body>
</html>
