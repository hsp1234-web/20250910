<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 分析 - 階段三</title>
    <link rel="stylesheet" href="/static/css/nav.css">
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/page4_common.css">
</head>
<body>
    <!-- 主導覽列 -->
    <nav class="top-nav">
        <ul>
            <li><a href="/">鳳凰主頁</a></li>
            <li><a href="/page1">資料擷取</a></li>
            <li><a href="/page2">批次下載</a></li>
            <li><a href="/page3">檔案處理</a></li>
            <li><a href="/page4_1" class="active">AI 分析</a></li>
            <li><a href="/page5">備份管理</a></li>
            <li><a href="/page6">金鑰管理</a></li>
            <li><a href="/page7">提示詞管理</a></li>
            <li><a href="/page9">績效儀表板</a></li>
        </ul>
    </nav>

    <div class="content">
        <!-- 副導覽列 -->
        <nav class="sub-nav">
            <a href="/page4_1" class="sub-nav-button">第一階段：AI 資料提取</a>
            <a href="/page4_2" class="sub-nav-button">第二階段：績效分析</a>
            <a href="/page4_3" class="sub-nav-button active">第三階段：報告生成</a>
        </nav>

        <div class="panel">
            <h1>第三階段：報告生成</h1>
            <p>此處列出所有已完成績效分析的任務。請勾選您想生成最終 HTML 報告的項目，並選擇要使用的 AI 模型。</p>

            <div class="form-group" style="margin-top: 20px;">
                <label for="model-select">選擇報告生成模型:</label>
                <select id="model-select" disabled>
                    <option value="">請先在「金鑰管理」頁面新增有效的 API 金鑰</option>
                </select>
            </div>

            <div style="margin: 20px 0 10px 0;">
                <button id="select-all-button">全選</button>
                <button id="deselect-all-button">取消全選</button>
            </div>

            <div id="task-list-container" class="table-container">
                <p>正在載入可生成報告的任務...</p>
            </div>

            <div style="margin-top: 20px;">
                <button id="start-stage2-btn" class="action-button" disabled>📄 生成 HTML 報告</button>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const taskListContainer = document.getElementById('task-list-container');
        const selectAllButton = document.getElementById('select-all-button');
        const deselectAllButton = document.getElementById('deselect-all-button');
        const startStage2Btn = document.getElementById('start-stage2-btn');
        const modelSelect = document.getElementById('model-select');

        const fetchAndRenderTasks = async () => {
            try {
                const response = await fetch('/api/analyzer/files_for_stage2');
                if (!response.ok) throw new Error('無法獲取待處理任務列表');
                const tasks = await response.json();

                if (tasks.length === 0) {
                    taskListContainer.innerHTML = '<p>目前沒有可生成報告的任務。</p>';
                    startStage2Btn.disabled = true;
                    return;
                }

                let tableHtml = `<table class="results-table"><thead><tr><th><input type="checkbox" id="header-checkbox"></th><th>檔案名稱</th><th>績效分析完成時間</th></tr></thead><tbody>`;
                tasks.forEach(task => {
                    const completedDate = new Date(task.updated_at).toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', hour12: false });
                    tableHtml += `<tr><td><input type="checkbox" class="task-checkbox" value="${task.id}"></td><td>${task.filename}</td><td>${completedDate}</td></tr>`;
                });
                tableHtml += `</tbody></table>`;
                taskListContainer.innerHTML = tableHtml;
                startStage2Btn.disabled = false;
            } catch (error) {
                taskListContainer.innerHTML = `<p style="color:red;">載入任務列表失敗: ${error.message}</p>`;
            }
        };

        const checkKeysAndLoadModels = async () => {
             try {
                const response = await fetch('/api/keys');
                if (!response.ok) throw new Error('無法獲取金鑰狀態');
                const keys = await response.json();
                const hasValidKeys = keys.some(k => k.is_valid);

                if (hasValidKeys) {
                    const modelsResponse = await fetch('/api/keys/models');
                    if (!modelsResponse.ok) throw new Error('無法載入模型列表');
                    const models = await modelsResponse.json();

                    modelSelect.innerHTML = '';
                    models.forEach(modelName => {
                        const option = document.createElement('option');
                        option.value = modelName;
                        option.textContent = modelName.replace('models/', '');
                        modelSelect.appendChild(option);
                    });
                    modelSelect.disabled = false;
                } else {
                    modelSelect.disabled = true;
                }
            } catch (error) {
                console.error("檢查金鑰或載入模型時出錯:", error);
                modelSelect.disabled = true;
                modelSelect.innerHTML = `<option value="">${error.message}</option>`;
            }
        };

        selectAllButton.addEventListener('click', () => document.querySelectorAll('.task-checkbox:not(:disabled)').forEach(cb => cb.checked = true));
        deselectAllButton.addEventListener('click', () => document.querySelectorAll('.task-checkbox').forEach(cb => cb.checked = false));
        taskListContainer.addEventListener('change', (e) => {
            if (e.target.id === 'header-checkbox') {
                 document.querySelectorAll('.task-checkbox:not(:disabled)').forEach(cb => cb.checked = e.target.checked);
            }
        });

        startStage2Btn.addEventListener('click', async () => {
            const selectedIds = Array.from(document.querySelectorAll('.task-checkbox:checked')).map(cb => parseInt(cb.value));
            if (selectedIds.length === 0) {
                alert('請至少選擇一個任務。');
                return;
            }
            if (modelSelect.disabled || !modelSelect.value) {
                alert('請選擇一個有效的報告生成模型。');
                return;
            }

            startStage2Btn.disabled = true;
            startStage2Btn.textContent = '正在發送請求...';

            try {
                const response = await fetch('/api/analyzer/start_stage2_analysis', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ task_ids: selectedIds, model_name: modelSelect.value })
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.detail || '啟動報告生成失敗');

                alert('報告生成任務已成功啟動！您可以在「績效儀表板」頁面查看最終報告。');
                fetchAndRenderTasks();
            } catch (error) {
                alert(`錯誤: ${error.message}`);
            } finally {
                startStage2Btn.disabled = false;
                startStage2Btn.textContent = '📄 生成 HTML 報告';
            }
        });

        checkKeysAndLoadModels();
        fetchAndRenderTasks();
    });
    </script>
</body>
</html>
