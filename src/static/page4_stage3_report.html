<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <!-- 版本同步：2025-09-15，確保前端與後端 API 一致 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 分析 - 階段三 報告生成</title>
    <link rel="stylesheet" href="/static/css/nav.css">
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/page4.css">
</head>
<body>
    <nav class="top-nav">
        <ul>
            <li><a href="/">鳳凰主頁</a></li>
            <li><a href="/page1">網址提取</a></li>
            <li><a href="/page2">批次下載</a></li>
            <li><a href="/page3">檔案處理</a></li>
            <li><a href="/page4_stage1_ai" class="active">AI 分析</a></li>
            <li><a href="/page5">備份管理</a></li>
            <li><a href="/page6">金鑰管理</a></li>
            <li><a href="/page7">提示詞管理</a></li>
            <li><a href="/page9">績效儀表板</a></li>
        </ul>
    </nav>

    <div class="content">
        <h1>AI 分析流程</h1>

        <div class="sub-nav">
            <a href="/page4_stage1_ai" class="sub-nav-button">1. AI 分析</a>
            <a href="/page4_stage1_5_date" class="sub-nav-button">1.5. 日期推斷</a>
            <a href="/page4_stage2_performance" class="sub-nav-button">2. 績效分析</a>
            <a href="/page4_stage3_report" class="sub-nav-button active">3. 報告生成</a>
            <a href="/page4_stage4_download" class="sub-nav-button">4. Word 報告下載</a>
        </div>

        <div class="panel">
            <h2>階段三：生成最終報告</h2>
            <p>此處顯示已完成績效分析的任務。勾選後即可開始生成最終的 HTML 報告。</p>

            <div class="form-group" style="margin-top: 20px;">
                <label for="model-select">選擇報告生成模型:</label>
                <select id="model-select" disabled>
                    <option value="">正在檢查 API 金鑰...</option>
                </select>
            </div>

            <div class="action-bar">
                <div class="action-group">
                    <button id="select-all-button">全選可生成項</button>
                    <button id="deselect-all-button">取消全選</button>
                </div>
                <div class="action-group">
                    <button id="start-generation-btn" class="primary-action">🔥 生成最終報告</button>
                </div>
            </div>

            <!-- 卡片容器 -->
            <div id="file-cards-container">
                <p>正在載入已完成績效分析的任務...</p>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <h2>狀態日誌</h2>
                <button id="copy-log-button" class="copy-button" title="複製日誌">複製</button>
            </div>
            <div id="status-area"></div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // --- DOM Element Cache ---
        const fileCardsContainer = document.getElementById('file-cards-container');
        const selectAllButton = document.getElementById('select-all-button');
        const deselectAllButton = document.getElementById('deselect-all-button');
        const startGenerationBtn = document.getElementById('start-generation-btn');
        const statusArea = document.getElementById('status-area');
        const copyLogButton = document.getElementById('copy-log-button');
        const modelSelect = document.getElementById('model-select');

        // --- Utility Functions ---
        const logStatus = (message, color = 'black') => {
            const timestamp = new Date().toLocaleTimeString('zh-TW', { hour12: false });
            statusArea.insertAdjacentHTML('afterbegin', `<p style="color: ${color};">[${timestamp}] ${message}</p>`);
        };

        // --- Core Render Functions ---
        const renderTaskList = async () => {
            try {
                logStatus('正在從後端獲取任務列表...');
                const response = await fetch('/api/analyzer/files_for_stage2');
                if (!response.ok) throw new Error(`無法獲取待處理任務 (HTTP ${response.status})`);
                const tasks = await response.json();
                logStatus(`成功獲取 ${tasks.length} 個任務的資訊。`, 'green');

                if (tasks.length === 0) {
                    fileCardsContainer.innerHTML = '<p>目前沒有可生成報告的任務。請先完成績效分析。</p>';
                    return;
                }

                const statusMap = {
                    'pending': '待生成',
                    'processing': '佇列中...',
                    'gemini_processing': 'AI 生成中...',
                    'completed': '✅ 報告完成',
                    'failed': '❌ 生成失敗'
                };

                let cardsHtml = '';
                tasks.forEach(task => {
                    // JULES: 使用 'stage2_status' 欄位
                    const status = task.stage2_status || 'pending';
                    const statusText = statusMap[status] || status;
                    const isPending = status === 'pending';
                    const isCompleted = status === 'completed';
                    const isFailed = status === 'failed';
                    const taskId = task.id;
                    const reportPath = task.stage2_report_path;
                    const reportLink = reportPath ? `<a href="/reports/${reportPath.split(/[\\/]/).pop()}" target="_blank" class="action-btn btn-report">查看報告</a>` : '';


                    cardsHtml += `
                        <div class="file-card status-${status}" data-task-id="${taskId}">
                            <div class="card-header">
                                <input type="checkbox" class="task-checkbox" value="${taskId}" ${!isPending ? 'disabled' : ''}>
                                <h3 class="filename" title="${task.filename}">${task.filename}</h3>
                            </div>
                            <div class="card-body">
                                <div class="info-grid">
                                    <div class="info-item"><strong>報告狀態:</strong> <span class="status-badge">${statusText}</span></div>
                                    <div class="info-item"><strong>生成模型:</strong> <span class="model-name">${task.stage2_model || 'N/A'}</span></div>
                                    <div class="info-item"><strong>Token 耗用:</strong> <span class="token-usage">${task.stage2_token_usage || 'N/A'}</span></div>
                                </div>
                            </div>
                            <div class="card-footer">
                                ${reportLink}
                                <a href="/page8?hash=${task.file_hash}" class="action-btn btn-details" ${!task.file_hash ? 'style="display:none;"' : ''}>詳細資料</a>
                                <button class="action-btn btn-retry" data-task-id="${taskId}" style="display: ${isFailed ? 'inline-block' : 'none'};">重試生成</button>
                            </div>
                            ${isFailed ? `<div class="error-log-container"><strong class="error-title">錯誤日誌:</strong><pre class="error-log">${task.stage2_error_log || '無詳細錯誤資訊。'}</pre></div>` : ''}
                        </div>
                    `;
                });
                fileCardsContainer.innerHTML = cardsHtml;
            } catch (error) {
                logStatus(`載入任務列表失敗: ${error.message}`, 'red');
                fileCardsContainer.innerHTML = `<p style="color:red;">載入任務列表失敗: ${error.message}</p>`;
            }
        };

        // --- API Call Functions ---
        const populateModelSelector = (models) => {
            modelSelect.innerHTML = '';
            const priorityOrder = ["models/gemini-2.0-flash-lite", "models/gemini-2.0-flash", "models/gemini-2.5-flash-lite", "models/gemini-2.5-flash"];
            const sortedModels = [...models].sort((a, b) => {
                let aPriority = priorityOrder.indexOf(a);
                let bPriority = priorityOrder.indexOf(b);
                if (aPriority === -1) aPriority = priorityOrder.length;
                if (bPriority === -1) bPriority = priorityOrder.length;
                if (aPriority !== bPriority) return aPriority - bPriority;
                return a.localeCompare(b);
            });
            sortedModels.forEach((modelName, index) => {
                const option = document.createElement('option');
                option.value = modelName;
                option.textContent = modelName.replace('models/', '');
                if (index === 0) option.selected = true;
                modelSelect.appendChild(option);
            });
        };

        const checkKeysAndLoadModels = async () => {
            try {
                const response = await fetch('/api/keys');
                const keys = await response.json();
                const validKeys = keys.filter(k => k.is_valid);
                if (validKeys.length > 0) {
                    const modelResponse = await fetch('/api/keys/models');
                    const models = await modelResponse.json();
                    populateModelSelector(models);
                    modelSelect.disabled = false;
                } else {
                    modelSelect.innerHTML = '<option value="">請先在「金鑰管理」頁面新增有效的 API 金鑰</option>';
                    modelSelect.disabled = true;
                    logStatus('偵測到無有效 API 金鑰，模型選單已禁用。', 'orange');
                }
            } catch (error) {
                logStatus(`檢查 API 金鑰或載入模型時發生錯誤: ${error.message}`, 'red');
                modelSelect.disabled = true;
            }
        };

        const startGenerationForTasks = async (taskIds, buttonToUpdate = null) => {
            if (taskIds.length === 0) return alert('請至少選擇一個任務。');
            if (modelSelect.disabled) return alert('請先新增有效的 API 金鑰才能開始生成。');
            const modelName = modelSelect.value;
            if (!modelName) return alert('請選擇生成模型。');

            if (buttonToUpdate) {
                buttonToUpdate.disabled = true;
                buttonToUpdate.textContent = '請求中...';
            }

            logStatus(`啟動報告生成，共 ${taskIds.length} 個任務...`, 'blue');
            try {
                const response = await fetch('/api/analyzer/start_stage2_analysis', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ task_ids: taskIds, model_name: modelName })
                });
                const result = await response.json();
                if (response.ok) {
                    logStatus(`生成請求已成功發送: ${result.message}`, 'green');
                    logStatus('稍後將自動更新列表...', 'purple');
                    setTimeout(renderTaskList, 1000);
                } else {
                    throw new Error(result.detail || '未知錯誤');
                }
            } catch (error) {
                logStatus(`啟動生成失敗: ${error.message}`, 'red');
                if (buttonToUpdate) {
                    buttonToUpdate.disabled = false;
                    buttonToUpdate.textContent = '重試生成';
                }
            }
        };

        // --- Event Listeners ---
        startGenerationBtn.addEventListener('click', () => {
            const selectedIds = Array.from(document.querySelectorAll('.task-checkbox:checked')).map(cb => parseInt(cb.value, 10));
            startGenerationForTasks(selectedIds);
        });

        fileCardsContainer.addEventListener('click', async (e) => {
            if (e.target.classList.contains('btn-retry')) {
                const button = e.target;
                const taskId = parseInt(button.dataset.taskId, 10);
                startGenerationForTasks([taskId], button);
            }
        });

        selectAllButton.addEventListener('click', () => document.querySelectorAll('.task-checkbox:not(:disabled)').forEach(cb => cb.checked = true));
        deselectAllButton.addEventListener('click', () => document.querySelectorAll('.task-checkbox:checked').forEach(cb => cb.checked = false));

        copyLogButton.addEventListener('click', () => {
            navigator.clipboard.writeText(statusArea.innerText).then(() => {
                const originalText = copyLogButton.innerText;
                copyLogButton.innerText = '已複製 ✅';
                setTimeout(() => { copyLogButton.innerText = originalText; }, 2000);
            });
        });

        const setupWebSocket = () => {
            const ws = new WebSocket(`${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}/api/ws`);
            ws.onopen = () => logStatus('WebSocket 狀態更新連線成功。', 'blue');
            ws.onclose = () => {
                logStatus('WebSocket 連線已中斷。5 秒後嘗試重新連線...', 'orange');
                setTimeout(setupWebSocket, 5000);
            };
            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.task_type === 'analysis_stage_2') {
                         logStatus(`收到報告生成任務 #${data.task_id} 狀態更新: ${data.status}。正在刷新列表...`, 'purple');
                         renderTaskList();
                    } else if (data.task_type === 'analysis_stage_performance' && data.status === 'completed') {
                         logStatus(`收到績效分析任務 #${data.task_id} 完成通知，正在刷新列表...`, 'purple');
                         renderTaskList();
                    }
                } catch (err) {
                    logStatus(`處理 WebSocket 訊息時發生錯誤: ${err}`, 'red');
                }
            };
        };

        (async () => {
            logStatus('頁面載入完成，正在初始化...');
            await Promise.all([
                checkKeysAndLoadModels(),
                renderTaskList()
            ]);
            setupWebSocket();
            logStatus('初始化完成，等待操作。', 'green');
        })();
    });
    </script>
</body>
</html>
