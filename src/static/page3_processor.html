<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>頁面三：檔案處理</title>
    <link rel="stylesheet" href="/static/css/nav.css">
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/page3.css">
    <!-- 根據使用者回饋，使用獨立的 page3 樣式 -->
    <link rel="stylesheet" href="/static/css/page3_refactored.css">
</head>
<body>
    <nav class="top-nav">
        <ul>
            <li><a href="/">鳳凰主頁</a></li>
            <li><a href="/page1">網址提取</a></li>
            <li><a href="/page2">批次下載</a></li>
            <li><a href="/page3" class="active">檔案處理</a></li>
            <li><a href="/page4_stage1_ai">AI 分析</a></li>
            <li><a href="/page5">備份管理</a></li>
            <li><a href="/page6">金鑰管理</a></li>
            <li><a href="/page7">提示詞管理</a></li>
            <li><a href="/page9">績效儀表板</a></li>
        </ul>
    </nav>

    <div class="content page3-container">
        <h1>頁面三：檔案處理</h1>
        <p>此頁面會列出所有已下載完成、可以進行處理的檔案。列表會透過 WebSocket 自動更新。</p>

        <!-- Panel 1: 待處理檔案 -->
        <div class="panel">
            <h2>待處理的檔案</h2>
            <div class="action-bar">
                <div class="action-group">
                    <button id="select-all-pending-button">全選</button>
                    <button id="deselect-all-pending-button">取消全選</button>
                </div>
                <div class="action-group">
                    <button id="process-button" class="primary-action">⚙️ 開始處理選中項目</button>
                </div>
            </div>

            <div id="pending-cards-container" class="card-grid">
                <p>正在載入待處理的檔案...</p>
            </div>
        </div>

        <!-- Panel 2: 已處理/失敗檔案 -->
        <div class="panel">
            <h2>已處理 / 失敗的檔案</h2>
             <div class="action-bar">
                <div class="action-group">
                    <button id="select-all-terminal-button">全選</button>
                    <button id="deselect-all-terminal-button">取消全選</button>
                </div>
                <div class="action-group">
                    <button id="retry-selected-btn">🔄 將選中項目移回待處理</button>
                </div>
            </div>
            <div id="terminal-cards-container" class="card-grid">
                <p>正在載入已處理/失敗的檔案...</p>
            </div>
        </div>

        <!-- Panel 3: 狀態日誌 -->
        <div class="panel">
            <div class="panel-header">
                <h2>狀態日誌</h2>
                <button id="copy-log-button" class="copy-button" title="複製日誌">📄</button>
            </div>
            <div id="status-area"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const pendingCardsContainer = document.getElementById('pending-cards-container');
            const terminalCardsContainer = document.getElementById('terminal-cards-container');
            const selectAllPendingBtn = document.getElementById('select-all-pending-button');
            const deselectAllPendingBtn = document.getElementById('deselect-all-pending-button');
            const processButton = document.getElementById('process-button');
            const selectAllTerminalBtn = document.getElementById('select-all-terminal-button');
            const deselectAllTerminalBtn = document.getElementById('deselect-all-terminal-button');
            const retrySelectedBtn = document.getElementById('retry-selected-btn');
            const statusArea = document.getElementById('status-area');
            const copyLogButton = document.getElementById('copy-log-button');

            const logStatus = (message, color = 'black') => {
                const timestamp = new Date().toLocaleTimeString('zh-TW', { hour12: false });
                statusArea.insertAdjacentHTML('afterbegin', `<p style="color: ${color};">[${timestamp}] ${message}</p>`);
            };

            const refreshAllLists = () => {
                fetchAndRenderPendingFiles();
                fetchAndRenderTerminalFiles();
            };

            const escapeHtml = (unsafe) => {
                if (unsafe === null || typeof unsafe === 'undefined') return '';
                return unsafe.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
            }

            const getStatusHTML = (status) => {
                const statusMap = {
                    'completed': '✅ 已下載',
                    'processing': '⚙️ 處理中...',
                    'processed': '✅ 處理成功',
                    'processing_failed': '❌ 處理失敗',
                    'processed_unsupported': '⚠️ 格式不支援'
                };
                const statusText = statusMap[status] || status || '未知';
                const statusClass = status || 'pending';
                return `<span class="status-badge status-${statusClass}">${statusText}</span>`;
            };

            const fetchAndRenderPendingFiles = async () => {
                try {
                    const response = await fetch('/api/processor/completed_files');
                    if (!response.ok) throw new Error(`伺服器錯誤 (狀態 ${response.status})`);
                    const files = await response.json();

                    pendingCardsContainer.innerHTML = '';
                    if (files.length === 0) {
                        pendingCardsContainer.innerHTML = '<p>目前沒有待處理的檔案。</p>';
                        processButton.disabled = true;
                        return;
                    }

                    files.forEach(file => {
                        const card = document.createElement('div');
                        card.className = 'file-card status-pending';
                        card.dataset.id = file.id;

                        // V4: 根據使用者回饋，統一卡片資訊佈局
                        const author = file.author || 'N/A';
                        const messageDate = file.message_date ? new Date(file.message_date).toLocaleString('zh-TW', { hour12: false, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) : 'N/A';
                        const urlLink = file.url ? `<a href="${escapeHtml(file.url)}" target="_blank" title="${escapeHtml(file.url)}">${escapeHtml(file.url)}</a>` : '無';

                        card.innerHTML = `
                            <div class="card-header">
                                <input type="checkbox" class="pending-checkbox" value="${file.id}">
                                <h3 class="filename">ID: ${file.id}</h3>
                            </div>
                            <div class="card-body">
                                <div class="info-grid">
                                    <div class="info-item"><strong>狀態:</strong> ${getStatusHTML('completed')}</div>
                                    <div class="info-item"><strong>標題:</strong> <span class="filename-text" title="${escapeHtml(file.title || file.filename)}">${escapeHtml(file.title || file.filename)}</span></div>
                                    <div class="info-item"><strong>作者:</strong> ${escapeHtml(author)}</div>
                                    <div class="info-item"><strong>時間:</strong> ${escapeHtml(messageDate)}</div>
                                    <div class="info-item"><strong>連結:</strong> ${urlLink}</div>
                                </div>
                            </div>
                        `;
                        pendingCardsContainer.appendChild(card);
                    });
                    processButton.disabled = false;
                } catch (error) {
                    pendingCardsContainer.innerHTML = `<p style="color: red;">載入待處理檔案失敗：${error.message}</p>`;
                }
            };

            const fetchAndRenderTerminalFiles = async () => {
                try {
                    const response = await fetch('/api/processor/terminal_files');
                    if (!response.ok) throw new Error(`伺服器錯誤 (狀態 ${response.status})`);
                    const files = await response.json();

                    terminalCardsContainer.innerHTML = '';
                    if (files.length === 0) {
                        terminalCardsContainer.innerHTML = '<p>目前沒有已處理或失敗的檔案。</p>';
                        return;
                    }

                    files.forEach(file => {
                        const card = document.createElement('div');
                        card.className = `file-card status-${file.status}`;
                        card.dataset.id = file.id;

                        let detailsButton = '';
                        if (file.status === 'processed') {
                            detailsButton = `<a href="/report/${file.id}" target="_blank" class="action-btn">檢視報告</a>`;
                        }

                        // V3: 根據使用者最新回饋調整卡片佈局
                        const author = file.author || 'N/A';
                        const messageDate = file.message_date ? new Date(file.message_date).toLocaleString('zh-TW', { hour12: false, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) : 'N/A';
                        const urlLink = file.url ? `<a href="${escapeHtml(file.url)}" target="_blank" title="${escapeHtml(file.url)}">${escapeHtml(file.url)}</a>` : '無';

                        card.innerHTML = `
                             <div class="card-header">
                                <input type="checkbox" class="terminal-checkbox" value="${file.id}">
                                <h3 class="filename">ID: ${file.id}</h3>
                            </div>
                             <div class="card-body">
                                <div class="info-grid">
                                    <div class="info-item"><strong>狀態:</strong> ${getStatusHTML(file.status)}</div>
                                     <div class="info-item"><strong>標題:</strong> <span class="filename-text" title="${escapeHtml(file.title || file.filename)}">${escapeHtml(file.title || file.filename)}</span></div>
                                    <div class="info-item"><strong>作者:</strong> ${escapeHtml(author)}</div>
                                    <div class="info-item"><strong>時間:</strong> ${escapeHtml(messageDate)}</div>
                                    <div class="info-item"><strong>連結:</strong> ${urlLink}</div>
                                </div>
                                <div class="error-log-container" style="${file.status === 'processing_failed' ? '' : 'display: none;'}">
                                    <strong class="error-title">錯誤日誌:</strong>
                                    <pre class="error-log">${escapeHtml(file.status_message)}</pre>
                                </div>
                            </div>
                            <div class="card-footer">
                                ${detailsButton}
                            </div>
                        `;
                        terminalCardsContainer.appendChild(card);
                    });
                } catch (error) {
                    terminalCardsContainer.innerHTML = `<p style="color: red;">載入已處理檔案失敗：${error.message}</p>`;
                }
            };

            processButton.addEventListener('click', async () => {
                const selectedIds = Array.from(document.querySelectorAll('.pending-checkbox:checked')).map(cb => parseInt(cb.value));
                if (selectedIds.length === 0) {
                    alert('請至少選擇一個要處理的項目。');
                    return;
                }
                logStatus(`正在發送 ${selectedIds.length} 個項目的處理請求...`);
                try {
                    const response = await fetch('/api/processor/start_processing', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ ids: selectedIds })
                    });
                    const result = await response.json();
                    if (!response.ok) throw new Error(result.detail || '啟動處理時發生未知錯誤。');
                    logStatus(result.message, 'green');
                    // Optimistic UI update to show "processing" state immediately
                    selectedIds.forEach(id => {
                        const card = pendingCardsContainer.querySelector(`.file-card[data-id='${id}']`);
                        if (card) {
                            // Find the correct info-item div to update
                            const infoItems = card.querySelectorAll('.info-item');
                            infoItems.forEach(item => {
                                const strongTag = item.querySelector('strong');
                                if (strongTag && strongTag.textContent.includes('狀態')) {
                                    item.innerHTML = `<strong>狀態:</strong> ${getStatusHTML('processing')}`;
                                }
                            });
                            // Also disable the checkbox
                            const checkbox = card.querySelector('.pending-checkbox');
                            if(checkbox) checkbox.disabled = true;
                        }
                    });
                } catch (error) {
                    logStatus(`請求失敗：${error.message}`, 'red');
                }
            });

            retrySelectedBtn.addEventListener('click', async () => {
                const selectedIds = Array.from(document.querySelectorAll('.terminal-checkbox:checked')).map(cb => parseInt(cb.value));
                if (selectedIds.length === 0) {
                    alert('請至少選擇一個要重試的項目。');
                    return;
                }
                logStatus(`正在發送 ${selectedIds.length} 個項目的重試請求...`);
                try {
                    const response = await fetch('/api/processor/reset_files', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ ids: selectedIds })
                    });
                    const result = await response.json();
                    if (!response.ok) throw new Error(result.detail || '重設檔案時發生未知錯誤。');
                    logStatus(result.message, 'green');
                    refreshAllLists();
                } catch (error) {
                    logStatus(`請求失敗：${error.message}`, 'red');
                }
            });

            // --- WebSocket Setup ---
            const setupWebSocket = () => {
                const ws = new WebSocket(`${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}/api/ws`);
                ws.onopen = () => logStatus('WebSocket 連線成功。', 'blue');
                ws.onclose = () => {
                    logStatus('WebSocket 連線已中斷。5 秒後嘗試重新連線...', 'orange');
                    setTimeout(setupWebSocket, 5000);
                };
                ws.onerror = (error) => console.error("WebSocket Error:", error);

                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    if ((data.type === 'task_update' && data.task_type === 'processing') || (data.type === 'task_update' && data.task_type === 'download')) {
                        logStatus(`收到任務 #${data.task_id} 的更新通知 (${data.status})，正在刷新列表...`, 'purple');
                        refreshAllLists();
                    }
                };
            };

            // --- Init & Event Listeners ---
            selectAllPendingBtn.addEventListener('click', () => document.querySelectorAll('.pending-checkbox').forEach(cb => cb.checked = true));
            deselectAllPendingBtn.addEventListener('click', () => document.querySelectorAll('.pending-checkbox').forEach(cb => cb.checked = false));
            selectAllTerminalBtn.addEventListener('click', () => document.querySelectorAll('.terminal-checkbox').forEach(cb => cb.checked = true));
            deselectAllTerminalBtn.addEventListener('click', () => document.querySelectorAll('.terminal-checkbox').forEach(cb => cb.checked = false));
            copyLogButton.addEventListener('click', () => navigator.clipboard.writeText(statusArea.innerText));

            refreshAllLists();
            setupWebSocket();
        });
    </script>
</body>
</html>
