<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作流編輯器</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/nav.css">
    <link rel="stylesheet" href="/static/css/line_workflow.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .workflow-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        .workflow-actions button {
            margin-left: 10px;
        }
        .steps-container {
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 1.5rem;
            background-color: #f8f9fa;
        }
        .step {
            display: flex;
            align-items: flex-start;
            padding: 1rem;
            border-bottom: 1px solid #e9ecef;
        }
        .step:last-child { border-bottom: none; }
        .step-order {
            font-size: 1.5em; font-weight: bold; color: #6c757d;
            margin-right: 1.5rem; padding-top: 5px;
        }
        .step-details { flex-grow: 1; }
        .step-command { font-weight: bold; font-size: 1.1em; margin-bottom: 0.5rem; }
        .step-parameters {
            font-family: monospace; font-size: 0.9em; color: #343a40;
            background-color: #e9ecef; padding: 5px; border-radius: 4px;
            word-break: break-all;
        }
        .step-error { color: #dc3545; font-size: 0.9em; margin-top: 8px; white-space: pre-wrap; word-break: break-all; }
        .detailed-statuses { min-width: 200px; padding-left: 1rem; }
        .status-item { display: flex; justify-content: space-between; align-items: center; font-size: 0.9em; margin-bottom: 4px; }
        .status-label { color: #495057; }
        .status-value { font-weight: bold; padding: 2px 6px; border-radius: 4px; }
        .status-pending, .status-skipped, .status-not_applicable { color: #6c757d; background-color: #f8f9fa; }
        .status-running { color: #007bff; background-color: #e7f3ff; }
        .status-success, .status-completed { color: #28a745; background-color: #e9f7ef; }
        .status-failed { color: #dc3545; background-color: #fbeae; }
        .no-workflow-message { text-align: center; padding: 2rem; font-size: 1.1em; color: #6c757d; }
    </style>
</head>
<body>
    <nav class="top-nav">
        <ul>
            <li><a href="/">鳳凰主頁</a></li>
            <li><a href="/line_importer">LINE 內容整理</a></li>
        </ul>
    </nav>

    <div class="content">
        <div class="panel">
            <nav class="tab-nav">
                <a href="/line_importer">資料擷取與處理</a>
                <a href="/line_workflow_editor" class="active">工作流編輯器</a>
                <a href="/line_data_viewer">資料檢視器</a>
            </nav>
            <div class="workflow-header">
                <div>
                    <h1 id="workflow-name-title">工作流編輯器</h1>
                    <p id="workflow-info">正在載入最新的工作流...</p>
                </div>
                <div class="workflow-actions">
                    <button id="add-step-btn" class="button-secondary" disabled>新增分析步驟</button>
                    <button id="execute-btn" class="button-primary" disabled>請稍候...</button>
                </div>
            </div>
            <div id="steps-container">
                <!-- 工作流步驟將由 JavaScript 動態填入 -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const workflowInfoEl = document.getElementById('workflow-info');
            const workflowNameTitleEl = document.getElementById('workflow-name-title');
            const stepsContainerEl = document.getElementById('steps-container');
            const executeBtn = document.getElementById('execute-btn');
            const addStepBtn = document.getElementById('add-step-btn');

            let workflowId = null;
            let workflowStatus = null;
            let eventSource = null;
            const TERMINAL_STATES = ['completed', 'completed_with_errors', 'failed'];

            const statusTextMap = {
                'pending': '待處理', 'running': '執行中', 'success': '成功',
                'completed': '完成', 'failed': '失敗', 'skipped': '已跳過',
                'not_applicable': '不適用',
            };

            const renderDetailedStatuses = (stepStatus) => {
                const statuses = [
                    { label: '下載', status: stepStatus.status_download },
                    { label: '提取', status: stepStatus.status_extraction },
                    { label: 'OCR', status: stepStatus.status_ocr },
                    { label: 'AI摘要', status: stepStatus.status_ai_summary },
                ];
                return `<div class="detailed-statuses">${statuses.map(s => `<div class="status-item"><span class="status-label">${s.label}:</span><span class="status-value status-${s.status || 'pending'}">${statusTextMap[s.status] || '未知'}</span></div>`).join('')}</div>`;
            };

            const renderStep = (originalStep) => {
                const lastError = originalStep.error_message || '';
                return `
                    <div class="step" id="step-${originalStep.id}">
                        <div class="step-order">${originalStep.step_order}</div>
                        <div class="step-details">
                            <div class="step-command">${originalStep.command}</div>
                            <div class="step-parameters">${JSON.stringify(originalStep.parameters)}</div>
                            <div class="step-error">${lastError ? `<strong>錯誤訊息:</strong> ${lastError}` : ''}</div>
                        </div>
                        <div class="detailed-statuses">
                             <div class="status-item"><span class="status-label">總體狀態:</span><span class="status-value status-${originalStep.status || 'pending'}">${statusTextMap[originalStep.status] || '未知'}</span></div>
                        </div>
                    </div>`;
            };

            const updateExecuteButton = () => {
                if (TERMINAL_STATES.includes(workflowStatus)) {
                    executeBtn.textContent = '重新執行';
                    executeBtn.disabled = false;
                } else if (workflowStatus === 'running') {
                    executeBtn.textContent = '執行中...';
                    executeBtn.disabled = true;
                } else if (workflowStatus === 'pending') {
                    executeBtn.textContent = '開始執行';
                    executeBtn.disabled = false;
                } else {
                    executeBtn.textContent = '狀態未知';
                    executeBtn.disabled = true;
                }
            };

            const updateUIWithStreamData = (data) => {
                workflowStatus = data.workflow_status;
                workflowInfoEl.textContent = `工作流 #${workflowId} | 總體狀態: ${workflowStatus || '未知'}`;
                updateExecuteButton();

                data.steps.forEach(status => {
                    const stepEl = document.getElementById(`step-${status.step_id}`);
                    if (!stepEl) return;
                    const statusContainer = stepEl.querySelector('.detailed-statuses');
                    const errorContainer = stepEl.querySelector('.step-error');
                    if (statusContainer) statusContainer.innerHTML = renderDetailedStatuses(status);
                    if (errorContainer) errorContainer.innerHTML = status.last_error ? `<strong>錯誤訊息:</strong> ${status.last_error}` : '';
                });

                if (TERMINAL_STATES.includes(workflowStatus)) {
                    if (eventSource) {
                        eventSource.close();
                        eventSource = null;
                        console.log("工作流執行結束，已關閉 SSE 連線。");
                    }
                    workflowInfoEl.textContent += ' (已結束)';
                }
            };

            const startEventSource = () => {
                if (eventSource || !workflowId) return;
                eventSource = new EventSource(`/api/workflows/${workflowId}/line_status`);
                console.log(`已建立對 /api/workflows/${workflowId}/line_status 的 EventSource 連線。`);

                eventSource.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        if (data.error) throw new Error(data.error);
                        updateUIWithStreamData(data);
                    } catch (e) {
                        console.error("解析 SSE 資料失敗:", e);
                    }
                };

                eventSource.onerror = () => {
                    console.error("EventSource 發生錯誤，連線已關閉。");
                    workflowInfoEl.textContent += ' (與伺服器的即時連線中斷)';
                    if (eventSource) eventSource.close();
                    eventSource = null;
                };
            };

            const handleExecuteClick = async () => {
                if (!workflowId) return;
                executeBtn.disabled = true;

                try {
                    // 如果是終止狀態，先重置
                    if (TERMINAL_STATES.includes(workflowStatus)) {
                        executeBtn.textContent = '正在重置...';
                        const resetResponse = await fetch(`/api/workflows/${workflowId}/reset`, { method: 'POST' });
                        if (!resetResponse.ok) throw new Error('重置工作流失敗');
                    }

                    // 執行工作流
                    executeBtn.textContent = '正在啟動...';
                    const executeResponse = await fetch(`/api/workflows/${workflowId}/execute`, { method: 'POST' });
                    if (!executeResponse.ok) throw new Error('觸發執行失敗');

                    // 成功觸發後，開始監聽 SSE 事件
                    startEventSource();

                } catch (error) {
                    workflowInfoEl.textContent = `操作錯誤: ${error.message}`;
                    updateExecuteButton(); // 恢復按鈕狀態
                }
            };

            const fetchLatestWorkflow = async () => {
                try {
                    const response = await fetch('/api/workflows/latest');
                    if (response.status === 404) {
                         stepsContainerEl.innerHTML = `<div class="no-workflow-message">尚未建立任何工作流。<br>請先至「<a href="/line_importer">資料擷取與處理</a>」頁面提交新內容。</div>`;
                         workflowNameTitleEl.textContent = '無可用工作流';
                         workflowInfoEl.textContent = '請先建立一個新任務。';
                         executeBtn.disabled = true;
                         addStepBtn.disabled = true;
                         return;
                    }
                    if (!response.ok) throw new Error(`無法獲取最新工作流: ${response.statusText}`);

                    const data = await response.json();
                    const { workflow, steps } = data;

                    workflowId = workflow.id;
                    workflowStatus = workflow.status;

                    workflowNameTitleEl.textContent = workflow.name || `工作流 #${workflow.id}`;
                    workflowInfoEl.textContent = `工作流 #${workflow.id} | 總體狀態: ${workflow.status}`;

                    stepsContainerEl.innerHTML = steps.map(renderStep).join('');

                    updateExecuteButton();
                    addStepBtn.disabled = true; // 暫時禁用

                    // 如果載入時就在執行中，或已結束，則開始監聽以獲取詳細狀態
                    if (workflowStatus === 'running' || TERMINAL_STATES.includes(workflowStatus)) {
                        startEventSource();
                    }

                } catch (error) {
                    workflowInfoEl.textContent = `錯誤: ${error.message}`;
                    executeBtn.disabled = true;
                }
            };

            const init = () => {
                fetchLatestWorkflow();
                executeBtn.addEventListener('click', handleExecuteClick);
            };

            init();
        });
    </script>
</body>
</html>
