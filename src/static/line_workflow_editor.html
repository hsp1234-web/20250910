<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作流編輯器</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/nav.css">
    <link rel="stylesheet" href="/static/css/line_workflow.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .workflow-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        .workflow-actions button {
            margin-left: 10px;
        }
        .steps-container {
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 1.5rem;
            background-color: #f8f9fa;
        }
        .step {
            display: flex;
            align-items: flex-start;
            padding: 1rem;
            border-bottom: 1px solid #e9ecef;
            transition: background-color 0.2s;
        }
        .step:last-child {
            border-bottom: none;
        }
        .step-order {
            font-size: 1.5em;
            font-weight: bold;
            color: #6c757d;
            margin-right: 1.5rem;
            padding-top: 5px;
        }
        .step-details {
            flex-grow: 1;
        }
        .step-command {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 0.5rem;
        }
        .step-parameters {
            font-family: monospace;
            font-size: 0.9em;
            color: #343a40;
            background-color: #e9ecef;
            padding: 5px;
            border-radius: 4px;
            word-break: break-all;
        }
        .step-error {
            color: #dc3545;
            font-size: 0.9em;
            margin-top: 8px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .detailed-statuses {
            min-width: 200px;
            padding-left: 1rem;
        }
        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9em;
            margin-bottom: 4px;
        }
        .status-label {
            color: #495057;
        }
        .status-value {
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .status-pending, .status-skipped, .status-not_applicable {
            color: #6c757d;
            background-color: #f8f9fa;
        }
        .status-running {
            color: #007bff;
            background-color: #e7f3ff;
        }
        .status-success, .status-completed {
            color: #28a745;
            background-color: #e9f7ef;
        }
        .status-failed {
            color: #dc3545;
            background-color: #fbeae;
        }
        #rerun-btn {
            display: none; /* 預設隱藏 */
        }
    </style>
</head>
<body>
    <nav class="top-nav">
        <ul>
            <li><a href="/">鳳凰主頁</a></li>
            <li><a href="/line_importer">LINE 內容整理</a></li>
        </ul>
    </nav>

    <div class="content">
        <div class="panel">
            <nav class="tab-nav">
                <a href="/line_importer">資料擷取與處理</a>
                <a href="/line_workflow_editor" class="active">工作流編輯器</a>
                <a href="/line_data_viewer">資料檢視器</a>
            </nav>
            <div class="workflow-header">
                <div>
                    <h1 id="workflow-name-title">工作流編輯器</h1>
                    <p id="workflow-info">正在載入最新的工作流...</p>
                </div>
                <div class="workflow-actions">
                    <button id="add-step-btn" class="button-secondary" disabled>新增分析步驟</button>
                    <button id="execute-btn" class="button-primary" disabled>開始執行</button>
                    <button id="rerun-btn" class="button-primary">重新執行</button>
                </div>
            </div>
            <div id="steps-container">
                <!-- 工作流步驟將由 JavaScript 動態填入 -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const workflowInfoEl = document.getElementById('workflow-info');
            const workflowNameTitleEl = document.getElementById('workflow-name-title');
            const stepsContainerEl = document.getElementById('steps-container');
            const executeBtn = document.getElementById('execute-btn');
            const addStepBtn = document.getElementById('add-step-btn');
            const rerunBtn = document.getElementById('rerun-btn');

            let workflowId = null;
            let eventSource = null;

            const statusTextMap = {
                'pending': '待處理',
                'running': '執行中',
                'success': '成功',
                'completed': '完成',
                'failed': '失敗',
                'skipped': '已跳過',
                'not_applicable': '不適用',
            };

            const terminalStates = ['completed', 'completed_with_errors', 'failed'];

            const renderDetailedStatuses = (stepStatus) => {
                const statuses = [
                    { label: '下載', status: stepStatus.status_download },
                    { label: '提取', status: stepStatus.status_extraction },
                    { label: 'OCR', status: stepStatus.status_ocr },
                    { label: 'AI摘要', status: stepStatus.status_ai_summary },
                ];

                return `
                    <div class="detailed-statuses">
                        ${statuses.map(s => `
                            <div class="status-item">
                                <span class="status-label">${s.label}:</span>
                                <span class="status-value status-${s.status || 'pending'}">
                                    ${statusTextMap[s.status] || '未知'}
                                </span>
                            </div>
                        `).join('')}
                    </div>
                `;
            };

            const renderStep = (originalStep, detailedStatus) => {
                let statusDetailsHTML;
                if (detailedStatus) {
                    statusDetailsHTML = renderDetailedStatuses(detailedStatus);
                } else {
                    const overallStatus = originalStep.status || 'pending';
                    const statusText = statusTextMap[overallStatus] || '未知';
                    statusDetailsHTML = `
                        <div class="detailed-statuses">
                            <div class="status-item">
                                <span class="status-label">總體狀態:</span>
                                <span class="status-value status-${overallStatus}">${statusText}</span>
                            </div>
                        </div>
                    `;
                }

                const lastError = detailedStatus ? detailedStatus.last_error : (originalStep.error_message || '');
                return `
                    <div class="step" id="step-${originalStep.id}">
                        <div class="step-order">${originalStep.step_order}</div>
                        <div class="step-details">
                            <div class="step-command">${originalStep.command}</div>
                            <div class="step-parameters">${JSON.stringify(originalStep.parameters)}</div>
                            <div class="step-error">${lastError ? `<strong>錯誤訊息:</strong> ${lastError}` : ''}</div>
                        </div>
                        ${statusDetailsHTML}
                    </div>
                `;
            };

            const updateUIForTerminalState = (isTerminal) => {
                executeBtn.style.display = isTerminal ? 'none' : 'inline-block';
                rerunBtn.style.display = isTerminal ? 'inline-block' : 'none';
                executeBtn.disabled = isTerminal;
                rerunBtn.disabled = false;
                addStepBtn.disabled = true; // 新增步驟按鈕在任何情況下都先禁用
            };

            const updateUIWithStreamData = (data) => {
                const { workflow_status, steps: detailedStatuses } = data;
                workflowInfoEl.textContent = `工作流 #${workflowId} | 總體狀態: ${workflow_status || '未知'}`;

                detailedStatuses.forEach(status => {
                    const stepEl = document.getElementById(`step-${status.step_id}`);
                    if (stepEl) {
                        const statusContainer = stepEl.querySelector('.detailed-statuses');
                        const errorContainer = stepEl.querySelector('.step-error');

                        if (statusContainer) {
                           const renderedHTML = renderDetailedStatuses(status);
                           if (statusContainer.innerHTML.trim() !== renderedHTML.trim()) {
                                statusContainer.innerHTML = renderedHTML;
                           }
                        }
                        if (errorContainer) {
                            const errorHTML = status.last_error ? `<strong>錯誤訊息:</strong> ${status.last_error}` : '';
                             if (errorContainer.innerHTML.trim() !== errorHTML.trim()) {
                                errorContainer.innerHTML = errorHTML;
                            }
                        }
                    }
                });

                if (terminalStates.includes(workflow_status)) {
                    if (eventSource) {
                        eventSource.close();
                        eventSource = null;
                    }
                    updateUIForTerminalState(true);
                    workflowInfoEl.textContent += ' (已結束)';
                }
            };

            const startEventSource = () => {
                if (eventSource || !workflowId) return;
                eventSource = new EventSource(`/api/workflows/${workflowId}/stream`);

                eventSource.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                         if (data.error) {
                            workflowInfoEl.textContent = `錯誤: ${data.error}`;
                            eventSource.close();
                            return;
                        }
                        updateUIWithStreamData(data);
                    } catch (e) {
                        console.error("解析 SSE 資料失敗:", e);
                    }
                };

                eventSource.onerror = () => {
                    workflowInfoEl.textContent += ' (與伺服器的即時連線中斷)';
                    eventSource.close();
                    eventSource = null;
                };
            };

            const executeWorkflow = async () => {
                if (!workflowId || executeBtn.disabled) return;

                executeBtn.disabled = true;
                workflowInfoEl.textContent = `工作流 #${workflowId} | 正在啟動執行...`;

                try {
                    const response = await fetch(`/api/workflows/${workflowId}/execute`, { method: 'POST' });
                    if (!response.ok) throw new Error('觸發執行失敗');
                    startEventSource();
                } catch (error) {
                    workflowInfoEl.textContent = `執行錯誤: ${error.message}`;
                    executeBtn.disabled = false;
                }
            };

            const rerunWorkflow = async () => {
                if (!workflowId || rerunBtn.disabled) return;

                rerunBtn.disabled = true;
                workflowInfoEl.textContent = `工作流 #${workflowId} | 正在重置...`;

                try {
                    // 1. 重置工作流
                    const resetResponse = await fetch(`/api/workflows/${workflowId}/reset`, { method: 'POST' });
                    if (!resetResponse.ok) throw new Error('重置工作流失敗');

                    // 2. 重新載入狀態並觸發執行
                    await loadLatestWorkflow(); // 重新載入以更新 UI
                    await executeWorkflow(); // 開始執行

                } catch (error) {
                    workflowInfoEl.textContent = `重新執行錯誤: ${error.message}`;
                    rerunBtn.disabled = false;
                }
            };

            const loadLatestWorkflow = async () => {
                try {
                    const response = await fetch(`/api/workflows/latest`);
                    if (!response.ok) {
                        if (response.status === 404) {
                             throw new Error('資料庫中沒有任何工作流。請先透過「資料擷取與處理」頁面建立一個。');
                        }
                        throw new Error(`無法獲取最新的工作流: ${response.statusText}`);
                    }

                    const data = await response.json();
                    const { workflow, steps } = data;

                    workflowId = workflow.id;
                    workflowNameTitleEl.textContent = workflow.name;
                    workflowInfoEl.textContent = `工作流 #${workflow.id} | 總體狀態: ${workflow.status}`;
                    stepsContainerEl.innerHTML = steps.map(step => renderStep(step, null)).join('');

                    const isTerminal = terminalStates.includes(workflow.status);
                    updateUIForTerminalState(isTerminal);

                    if (workflow.status === 'running') {
                         startEventSource();
                         executeBtn.disabled = true;
                    } else if (!isTerminal) {
                        executeBtn.disabled = false;
                    }

                } catch (error) {
                    workflowInfoEl.textContent = `錯誤: ${error.message}`;
                    stepsContainerEl.innerHTML = `<p style="text-align:center; color: red;">${error.message}</p>`;
                    executeBtn.disabled = true;
                    addStepBtn.disabled = true;
                    rerunBtn.style.display = 'none';
                }
            };

            const init = () => {
                loadLatestWorkflow();
                executeBtn.addEventListener('click', executeWorkflow);
                rerunBtn.addEventListener('click', rerunWorkflow);
            };

            init();
        });
    </script>
</body>
</html>
