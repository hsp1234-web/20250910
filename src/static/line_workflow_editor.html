<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作流編輯器</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/nav.css">
    <link rel="stylesheet" href="/static/css/line_workflow.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .workflow-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        .workflow-actions button {
            margin-left: 10px;
        }
        .steps-container {
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 1.5rem;
            background-color: #f8f9fa;
        }
        .step {
            display: flex;
            align-items: flex-start;
            padding: 1rem;
            border-bottom: 1px solid #e9ecef;
            transition: background-color 0.2s;
        }
        .step:last-child {
            border-bottom: none;
        }
        .step-order {
            font-size: 1.5em;
            font-weight: bold;
            color: #6c757d;
            margin-right: 1.5rem;
            padding-top: 5px;
        }
        .step-details {
            flex-grow: 1;
        }
        .step-command {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 0.5rem;
        }
        .step-parameters {
            font-family: monospace;
            font-size: 0.9em;
            color: #343a40;
            background-color: #e9ecef;
            padding: 5px;
            border-radius: 4px;
            word-break: break-all;
        }
        .step-error {
            color: #dc3545;
            font-size: 0.9em;
            margin-top: 8px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .detailed-statuses {
            min-width: 200px;
            padding-left: 1rem;
        }
        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9em;
            margin-bottom: 4px;
        }
        .status-label {
            color: #495057;
        }
        .status-value {
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .status-pending, .status-skipped, .status-not_applicable {
            color: #6c757d;
            background-color: #f8f9fa;
        }
        .status-running {
            color: #007bff;
            background-color: #e7f3ff;
        }
        .status-success, .status-completed {
            color: #28a745;
            background-color: #e9f7ef;
        }
        .status-failed {
            color: #dc3545;
            background-color: #fbeae;
        }
        #rerun-btn {
            display: none; /* 預設隱藏 */
        }
    </style>
</head>
<body>
    <nav class="top-nav">
        <ul>
            <li><a href="/">鳳凰主頁</a></li>
            <li><a href="/line_importer">LINE 內容整理</a></li>
        </ul>
    </nav>

    <div class="content">
        <div class="panel">
            <nav class="tab-nav">
                <a href="/line_importer">資料擷取與處理</a>
                <a href="/line_workflow_editor" class="active">工作流編輯器</a>
                <a href="/line_data_viewer">資料檢視器</a>
            </nav>
            <div class="workflow-header">
                <div>
                    <h1 id="workflow-name-title">工作流編輯器</h1>
                    <p id="workflow-info">正在載入最新的工作流...</p>
                </div>
                <div class="workflow-actions">
                    <button id="add-step-btn" class="button-secondary" disabled>新增分析步驟</button>
                    <button id="execute-btn" class="button-primary" disabled>開始執行</button>
                    <button id="rerun-btn" class="button-primary">重新執行</button>
                </div>
            </div>
            <div id="steps-container">
                <!-- 工作流步驟將由 JavaScript 動態填入 -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const workflowInfoEl = document.getElementById('workflow-info');
            const workflowNameTitleEl = document.getElementById('workflow-name-title');
            const stepsContainerEl = document.getElementById('steps-container');
            const executeBtn = document.getElementById('execute-btn');
            const addStepBtn = document.getElementById('add-step-btn');
            const rerunBtn = document.getElementById('rerun-btn');

            let workflowId = null;
            let eventSource = null;

            const statusTextMap = {
                'pending': '待處理',
                'running': '執行中',
                'success': '成功',
                'completed': '完成',
                'failed': '失敗',
                'skipped': '已跳過',
                'not_applicable': '不適用',
            };

            const terminalStates = ['completed', 'completed_with_errors', 'failed'];

            const renderDetailedStatuses = (stepStatus) => {
                const statuses = [
                    { label: '下載', status: stepStatus.status_download },
                    { label: '提取', status: stepStatus.status_extraction },
                    { label: 'OCR', status: stepStatus.status_ocr },
                    { label: 'AI摘要', status: stepStatus.status_ai_summary },
                ];

                return `
                    <div class="detailed-statuses">
                        ${statuses.map(s => `
                            <div class="status-item">
                                <span class="status-label">${s.label}:</span>
                                <span class="status-value status-${s.status || 'pending'}">
                                    ${statusTextMap[s.status] || '未知'}
                                </span>
                            </div>
                        `).join('')}
                    </div>
                `;
            };

            const renderStep = (originalStep, detailedStatus) => {
                let statusDetailsHTML;
                if (detailedStatus) {
                    statusDetailsHTML = renderDetailedStatuses(detailedStatus);
                } else {
                    const overallStatus = originalStep.status || 'pending';
                    const statusText = statusTextMap[overallStatus] || '未知';
                    statusDetailsHTML = `
                        <div class="detailed-statuses">
                            <div class="status-item">
                                <span class="status-label">總體狀態:</span>
                                <span class="status-value status-${overallStatus}">${statusText}</span>
                            </div>
                        </div>
                    `;
                }

                const lastError = detailedStatus ? detailedStatus.last_error : (originalStep.error_message || '');
                return `
                    <div class="step" id="step-${originalStep.id}">
                        <div class="step-order">${originalStep.step_order}</div>
                        <div class="step-details">
                            <div class="step-command">${originalStep.command}</div>
                            <div class="step-parameters">${JSON.stringify(originalStep.parameters)}</div>
                            <div class="step-error">${lastError ? `<strong>錯誤訊息:</strong> ${lastError}` : ''}</div>
                        </div>
                        ${statusDetailsHTML}
                    </div>
                `;
            };

            const updateUIForTerminalState = (isTerminal) => {
                executeBtn.style.display = isTerminal ? 'none' : 'inline-block';
                rerunBtn.style.display = isTerminal ? 'inline-block' : 'none';
                executeBtn.disabled = isTerminal;
                rerunBtn.disabled = false;
                addStepBtn.disabled = true; // 新增步驟按鈕在任何情況下都先禁用
            };

            const updateUIWithStreamData = (data) => {
                const { workflow_status, steps: detailedStatuses } = data;
                workflowInfoEl.textContent = `工作流 #${workflowId} | 總體狀態: ${workflow_status || '未知'}`;

                detailedStatuses.forEach(status => {
                    const stepEl = document.getElementById(`step-${status.step_id}`);
                    if (stepEl) {
                        const statusContainer = stepEl.querySelector('.detailed-statuses');
                        const errorContainer = stepEl.querySelector('.step-error');

                        if (statusContainer) {
                           const renderedHTML = renderDetailedStatuses(status);
                           if (statusContainer.innerHTML.trim() !== renderedHTML.trim()) {
                                statusContainer.innerHTML = renderedHTML;
                           }
                        }
                        if (errorContainer) {
                            const errorHTML = status.last_error ? `<strong>錯誤訊息:</strong> ${status.last_error}` : '';
                             if (errorContainer.innerHTML.trim() !== errorHTML.trim()) {
                                errorContainer.innerHTML = errorHTML;
                            }
                        }
                    }
                });

                if (terminalStates.includes(workflow_status)) {
                    if (eventSource) {
                        eventSource.close();
                        eventSource = null;
                    }
                    updateUIForTerminalState(true);
                    workflowInfoEl.textContent += ' (已結束)';
                }
            };

            const startEventSource = () => {
                if (eventSource || !workflowId) return;
                eventSource = new EventSource(`/api/workflows/${workflowId}/stream`);

                eventSource.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                         if (data.error) {
                            workflowInfoEl.textContent = `錯誤: ${data.error}`;
                            eventSource.close();
                            return;
                        }
                        updateUIWithStreamData(data);
                    } catch (e) {
                        console.error("解析 SSE 資料失敗:", e);
                    }
                };

                eventSource.onerror = () => {
                    workflowInfoEl.textContent += ' (與伺服器的即時連線中斷)';
                    eventSource.close();
                    eventSource = null;
                };
            };

            const executeWorkflow = async () => {
                if (!workflowId || executeBtn.disabled) return;

                executeBtn.disabled = true;
                workflowInfoEl.textContent = `工作流 #${workflowId} | 正在啟動執行...`;

                try {
                    const response = await fetch(`/api/workflows/${workflowId}/execute`, { method: 'POST' });
                    if (!response.ok) throw new Error('觸發執行失敗');
                    startEventSource();
                } catch (error) {
                    workflowInfoEl.textContent = `執行錯誤: ${error.message}`;
                    executeBtn.disabled = false;
                }
            };

            const rerunWorkflow = async () => {
                if (!workflowId || rerunBtn.disabled) return;

                rerunBtn.disabled = true;
                workflowInfoEl.textContent = `工作流 #${workflowId} | 正在重置...`;

                try {
                    // 1. 重置工作流
                    const resetResponse = await fetch(`/api/workflows/${workflowId}/reset`, { method: 'POST' });
                    if (!resetResponse.ok) throw new Error('重置工作流失敗');

                    // 2. 重新載入狀態並觸發執行
                    await loadLatestWorkflow(); // 重新載入以更新 UI
                    await executeWorkflow(); // 開始執行

                } catch (error) {
                    workflowInfoEl.textContent = `重新執行錯誤: ${error.message}`;
                    rerunBtn.disabled = false;
                }
            };

            const loadLatestWorkflow = async () => {
                try {
                    // 原有邏輯：獲取最新的工作流基本資訊
                    const response = await fetch(`/api/workflows/latest`);
                    if (!response.ok) {
                        if (response.status === 404) {
                             throw new Error('資料庫中沒有任何工作流。請先透過「資料擷取與處理」頁面建立一個。');
                        }
                        throw new Error(`無法獲取最新的工作流: ${response.statusText}`);
                    }

                    const data = await response.json();
                    const { workflow, steps: originalSteps } = data; // 將 'steps' 重新命名以避免混淆

                    workflowId = workflow.id;
                    workflowNameTitleEl.textContent = workflow.name;
                    workflowInfoEl.textContent = `工作流 #${workflow.id} | 總體狀態: ${workflow.status}`;

                    // --- JULES @ 2025-10-28: 錯誤修復 ---
                    // 新增的關鍵邏輯：在頁面載入時，主動獲取並顯示每個項目的精細化生命週期狀態。
                    // 這解決了重新整理頁面後，只顯示上次「執行」的籠統狀態（如 "completed"），
                    // 而無法看到項目實際的子任務狀態（如 "AI摘要: 待處理"）的問題。
                    try {
                        const detailedStatusResponse = await fetch(`/api/workflows/${workflowId}/line_status`);
                        if (detailedStatusResponse.ok) {
                            const detailedData = await detailedStatusResponse.json();
                            const detailedStatusMap = new Map(detailedData.steps.map(s => [s.step_id, s]));

                            // 使用詳細狀態來渲染，如果找不到對應的詳細狀態，則退回使用原始步驟資訊
                            stepsContainerEl.innerHTML = originalSteps.map(step => {
                                const detailedStatus = detailedStatusMap.get(step.id);
                                return renderStep(step, detailedStatus);
                            }).join('');

                        } else {
                            // 如果無法獲取詳細狀態，則 gracefully fallback 到原有的渲染方式
                            console.warn(`無法獲取工作流 ${workflowId} 的詳細狀態，將僅顯示基本資訊。`);
                            stepsContainerEl.innerHTML = originalSteps.map(step => renderStep(step, null)).join('');
                        }
                    } catch (detailError) {
                        console.error("獲取詳細工作流狀態時發生錯誤:", detailError);
                        // 發生網路錯誤等問題時，同樣退回到僅顯示基本資訊的模式
                        stepsContainerEl.innerHTML = originalSteps.map(step => renderStep(step, null)).join('');
                    }
                    // --- 錯誤修復結束 ---

                    const isTerminal = terminalStates.includes(workflow.status);
                    updateUIForTerminalState(isTerminal);

                    if (workflow.status === 'running') {
                         startEventSource();
                         executeBtn.disabled = true;
                    } else if (!isTerminal) {
                        executeBtn.disabled = false;
                    }

                } catch (error) {
                    workflowInfoEl.textContent = `錯誤: ${error.message}`;
                    stepsContainerEl.innerHTML = `<p style="text-align:center; color: red;">${error.message}</p>`;
                    executeBtn.disabled = true;
                    addStepBtn.disabled = true;
                    rerunBtn.style.display = 'none';
                }
            };

            const init = () => {
                loadLatestWorkflow();
                executeBtn.addEventListener('click', executeWorkflow);
                rerunBtn.addEventListener('click', rerunWorkflow);
            };

            // 監聽 'app-ready' 事件以觸發主邏輯
            document.addEventListener('app-ready', init);
        });
    </script>

    <!-- JULES'S V9 REFACTOR (2025-10-16): 新增的、更穩健的啟動邏輯 -->
    <div id="readiness-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.7); color: white; display: flex; justify-content: center; align-items: center; font-size: 1.5em; z-index: 9999; flex-direction: column; text-align: center;">
        <div class="spinner" style="border: 4px solid rgba(255, 255, 255, 0.3); border-radius: 50%; border-top: 4px solid #fff; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px;"></div>
        <p>系統正在初始化核心服務，請稍候...</p>
    </div>
    <script>
        const logAction = (action, value = null) => {
            const message = value !== null ? `${action}: ${value}` : action;
            fetch('/api/log/action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: message })
            }).catch(err => console.error('logAction failed:', err));
        };

        const checkSystemReadiness = async () => {
            const overlay = document.getElementById('readiness-overlay');
            const overlayText = overlay.querySelector('p');

            document.querySelectorAll('button, a.button').forEach(btn => {
                if (!btn.closest('.top-nav')) {
                    btn.disabled = true;
                    btn.title = '正在等待後端服務完全就緒...';
                }
            });
            overlay.style.display = 'flex';

            const poll = async (url, { maxRetries = 10, delay = 500, backoff = 1.5, timeout = 3000 }) => {
                for (let i = 0; i < maxRetries; i++) {
                    try {
                        const controller = new AbortController();
                        const id = setTimeout(() => controller.abort(), timeout);
                        const response = await fetch(url, { signal: controller.signal });
                        clearTimeout(id);
                        if (response.ok) return response;
                    } catch (error) {
                        console.warn(`[輪詢] 第 ${i + 1} 次請求 ${url} 失敗: ${error.message}`);
                    }
                    await new Promise(resolve => setTimeout(resolve, delay));
                    delay *= backoff;
                }
                throw new Error(`在 ${maxRetries} 次重試後，輪詢 ${url} 超時。`);
            };

            try {
                overlayText.textContent = '正在連接後端 API 伺服器...';
                await poll('/api/system_stats', { maxRetries: 15, delay: 300, backoff: 1.3 });

                logAction('readiness-stage1-api-alive');
                overlay.style.display = 'none';
                document.getElementById('workflow-info').textContent = '核心 API 已連線。正在等待背景服務就緒...';


                await poll('/api/health/ready', { maxRetries: 60, delay: 1000, backoff: 1.1 });

                logAction('readiness-stage2-fully-ready');
                document.getElementById('workflow-info').textContent = '系統已完全就緒，正在載入工作流...';

                // 現在可以安全地呼叫 init()
                document.dispatchEvent(new Event('app-ready'));

            } catch (error) {
                logAction('readiness-check-failed', error.message);
                overlayText.innerHTML = `❌ 連接後端失敗。<br><small>${error.message}</small>`;
                overlay.style.backgroundColor = 'rgba(121, 28, 28, 0.85)';
            }
        };

        // 監聽 'app-ready' 事件以觸發主邏輯
        document.addEventListener('app-ready', () => {
             // 找到 DOMContentLoaded 中的 init 函數並呼叫
            const initFunc = document.querySelector('script:not([src])').textContent.match(/const init = \(\) => {([\s\S]*?)};/);
            if(initFunc) {
                eval(initFunc[0]); // 重新宣告
                eval('init()'); // 呼叫
            }
        });

        // 啟動就緒檢查
        checkSystemReadiness();
    </script>
</body>
</html>
