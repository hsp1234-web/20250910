<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音訊報告生成器 - 步驟1：來源管理</title>
    <style>
        :root {
            --bg-color: #F8F9FA;
            --text-color: #202124;
            --card-bg-color: rgba(255, 255, 255, 0.9);
            --card-border-color: #e0e0e0;
            --button-bg-color: #007bff;
            --button-hover-bg-color: #0056b3;
            --secondary-btn-bg: #6c757d;
            --secondary-btn-hover-bg: #5a6268;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            font-size: 100%;
            line-height: 1.6;
        }
        .container { max-width: 1200px; margin: auto; display: flex; flex-direction: column; gap: 24px; }
        .card {
            border: 1px solid var(--card-border-color);
            border-radius: 12px;
            padding: 24px;
            background-color: var(--card-bg-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .grid-2-col {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }
        @media (min-width: 768px) {
            .grid-2-col { grid-template-columns: 1fr 1fr; }
        }
        .flex-col { display: flex; flex-direction: column; gap: 16px; }
        h1 { font-size: 2em; font-weight: 700; }
        h2 { font-size: 1.4em; font-weight: 600; margin-bottom: 16px; }
        .home-button {
            display: inline-block;
            text-decoration: none;
            padding: 8px 16px;
            font-size: 0.9em;
            color: #fff;
            background-color: var(--secondary-btn-bg);
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .home-button:hover { background-color: var(--secondary-btn-hover-bg); }
        textarea, input[type="text"], select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: var(--button-bg-color);
            color: white;
            font-weight: 600;
            font-size: 1.1em;
            transition: all 0.2s;
            width: 100%;
        }
        button:hover:not(:disabled) { background-color: var(--button-hover-bg-color); }
        .file-drop-zone {
            border: 2px dashed #ccc;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .file-drop-zone:hover { background-color: #f0f8ff; border-color: var(--button-bg-color); }
        .hidden { display: none; }
        .task-list { min-height: 100px; max-height: 400px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .task-item {
            padding: 12px;
            border-radius: 8px;
            background-color: #f9f9f9;
            border: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .task-filename { font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <header class="card" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
            <div>
                <h1>步驟一：獲取音訊來源</h1>
                <p>請從網路下載或從本機上傳音訊檔案。</p>
            </div>
            <a href="/audio_report/main" class="home-button">返回功能主頁</a>
        </header>

        <div class="grid-2-col">
            <!-- 功能一：從網址下載 -->
            <div class="card flex-col">
                <h2>從網址下載</h2>
                <div>
                    <label for="downloader-urls-input"><strong>網址或播放清單</strong> (每行一個)</label>
                    <textarea id="downloader-urls-input" rows="5" placeholder="支援 YouTube, Bilibili 等多數影音網站..."></textarea>
                </div>
                <button id="start-download-btn">下載音訊</button>
            </div>

            <!-- 功能二：從本機上傳 -->
            <div class="card flex-col">
                <h2>從本機上傳</h2>
                <label for="file-input" class="file-drop-zone">
                    點擊或拖曳檔案至此處
                </label>
                <input id="file-input" type="file" accept="audio/*" multiple class="hidden">
                <div id="file-list-display" style="margin-top: 16px;">
                    <!-- 已選擇的檔案會顯示在這裡 -->
                </div>
            </div>
        </div>

        <div class="card">
            <h2>已暫存音訊列表</h2>
            <div id="staged-files-list" class="task-list">
                <p id="no-staged-files">尚未準備任何音訊檔案。</p>
                <!-- 所有已下載或上傳的音訊檔案將顯示於此 -->
            </div>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            console.log("音訊來源管理頁面已載入。");
            // 未來將在此處添加與後端互動的 JavaScript 邏輯，
            // 例如：
            // 1. 點擊「下載音訊」按鈕時，向後端發送請求。
            // 2. 處理檔案上傳。
            // 3. 定期刷新「已暫存音訊列表」。
        });
    </script>
</body>
</html>
