<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>頁面五：備份管理</title>
    <link rel="stylesheet" href="/static/css/nav.css">
    <link rel="stylesheet" href="/static/css/page5.css">
</head>
<body>
    <nav class="top-nav">
        <ul>
            <li><a href="/">鳳凰主頁</a></li>
            <li><a href="/page1">網址提取</a></li>
            <li><a href="/page2">批次下載</a></li>
            <li><a href="/page3">檔案處理</a></li>
            <li><a href="/page4_stage1_ai">AI 分析</a></li>
            <li><a href="/page11_summary_center">摘要中心</a></li>
            <li><a href="/page5" class="active">備份管理</a></li>
            <li><a href="/page6">金鑰管理</a></li>
            <li><a href="/page7">提示詞管理</a></li>
            <li><a href="/page9">績效儀表板</a></li>
        </ul>
    </nav>

    <div class="content">
        <h1>頁面五：備份管理</h1>
        <p>點擊下方的按鈕，系統將會開始在背景執行備份任務，將資料庫和已下載的檔案壓縮並上傳至 Google Drive。</p>

        <div style="margin-top: 20px;">
            <button id="backup-button" style="font-size: 1.2em; padding: 10px;">立即備份到 Google Drive</button>
        </div>

        <div id="status-area" style="margin-top: 20px; font-weight: bold;"></div>
    </div>

    <script>
        document.getElementById('backup-button').addEventListener('click', async () => {
            const statusArea = document.getElementById('status-area');
            const backupButton = document.getElementById('backup-button');

            statusArea.textContent = '正在發送備份請求...';
            statusArea.style.color = 'blue';
            backupButton.disabled = true;

            try {
                const response = await fetch('/api/backup/start_backup', {
                    method: 'POST',
                });

                const result = await response.json();

                if (response.status === 202) {
                    statusArea.textContent = `成功！${result.message} 備份正在背景執行中。`;
                    statusArea.style.color = 'green';
                } else {
                    throw new Error(result.detail || '啟動備份時發生未知錯誤。');
                }
            } catch (error) {
                statusArea.textContent = `請求失敗：${error.message}`;
                statusArea.style.color = 'red';
                backupButton.disabled = false;
            }
        });

        const centerActiveNavButton = () => {
            const activeNavButton = document.querySelector('.top-nav a.active');
            if (activeNavButton) {
                activeNavButton.scrollIntoView({
                    behavior: 'smooth',
                    inline: 'center',
                    block: 'nearest'
                });
            }
        };
        setTimeout(centerActiveNavButton, 100);
    </script>

    <!-- V5.5 Readiness Overlay Start -->
    <style>
        #readiness-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5em;
            z-index: 9999;
            flex-direction: column;
            text-align: center;
        }
        #readiness-overlay .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #fff;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <div id="readiness-overlay">
        <div class="spinner"></div>
        <p>系統正在初始化核心服務，請稍候...</p>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const overlay = document.getElementById('readiness-overlay');
            const buttons = document.querySelectorAll('button, a.button, input[type="button"], input[type="submit"]');

            // 輔助函數：啟用UI
            function enableUI() {
                overlay.style.display = 'none';
                buttons.forEach(btn => {
                    btn.disabled = false;
                });
                console.log('系統已就緒，UI 已啟用。');
            }

            // 檢查 sessionStorage 中是否已有就緒標記
            if (sessionStorage.getItem('isSystemReady') === 'true') {
                enableUI();
                const overlayText = overlay.querySelector('p');
                if(overlayText) {
                    overlayText.innerText = '系統已就緒';
                }
                return; // 如果已就緒，則不執行後續的輪詢
            }

            // 1. 預設禁用所有按鈕並顯示遮罩
            buttons.forEach(btn => {
                if (!btn.closest('.navbar')) {
                    btn.disabled = true;
                }
            });
            overlay.style.display = 'flex';

            // 2. 定期輪詢 /api/health/ready 端點
            const readinessInterval = setInterval(() => {
                fetch('/api/health/ready')
                    .then(response => {
                        if (response.ok) {
                            // 3. 一旦請求成功，設定標記、啟用按鈕並隱藏遮罩
                            clearInterval(readinessInterval);
                            sessionStorage.setItem('isSystemReady', 'true'); // 設定標記
                            enableUI();
                        } else {
                            console.log('等待核心服務就緒...');
                        }
                    })
                    .catch(error => {
                        console.error('輪詢就緒狀態時發生錯誤:', error);
                        const overlayText = overlay.querySelector('p');
                        if(overlayText) {
                            overlayText.innerText = '無法連接到後端服務，請檢查連線或稍後重試。';
                        }
                    });
            }, 2000); // 每 2 秒輪詢一次
        });
    </script>
    <!-- V5.5 Readiness Overlay End -->
</body>
</html>
