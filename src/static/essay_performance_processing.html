<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小作文績效 - 本地 AI 處理</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/nav.css">
    <link rel="stylesheet" href="/static/css/essay_performance_tabs.css">
    <link rel="stylesheet" href="/static/css/page1_unified.css">
    <!-- Jules: 為了顯示狀態圖示，引入 Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- (Jules @ 2025-10-08) 樣式直接參考 page1_sub_overview.html 以確保視覺一致性 -->
    <style>
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-id {
            font-size: 0.9em;
            color: #6c757d;
        }
        .item-status {
            font-size: 0.85em;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 12px;
            text-transform: uppercase;
        }
        /* 狀態顏色映射 */
        .status-waiting { color: #383d41; background-color: #e2e3e5; }
        .status-downloading { color: #0c5460; background-color: #d1ecf1; }
        .status-downloaded { color: #155724; background-color: #d4edda; }
        .status-failed { color: #721c24; background-color: #f8d7da; }

        .card-body p {
            margin-bottom: 0.5rem;
        }
        .card-body p:last-child {
            margin-bottom: 0;
        }
        .error-message {
            color: #721c24;
            font-size: 0.9em;
            word-break: break-all;
        }
        #summary-panel {
            font-size: 1.2em;
            padding: 1rem;
            background-color: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            border: 1px solid #dee2e6;
        }
    </style>
</head>
<body>
    <nav class="top-nav">
        <ul>
            <li><a href="/">鳳凰主頁</a></li>
            <li><a href="/page1">資料處理</a></li>
            <li><a href="/page2">批次下載</a></li>
            <li><a href="/page3">檔案處理</a></li>
            <li><a href="/page4_stage1_ai">AI 分析</a></li>
            <li><a href="/page5">備份管理</a></li>
            <li><a href="/page6">金鑰管理</a></li>
            <li><a href="/page7">提示詞管理</a></li>
            <li><a href="/page9">績效儀表板</a></li>
            <li><a href="/essay_performance/ingestion" class="active">小作文績效</a></li>
        </ul>
    </nav>

    <div class="content">
        <div class="panel">
            <h1>小作文績效</h1>
            <div class="tab-container" style="margin-top: 20px;">
                <a href="/essay_performance/ingestion" class="tab-button">資料擷取與處理</a>
                <a href="/essay_performance/processing" class="tab-button active">本地AI處理</a>
                <a href="/essay_performance/report" class="tab-button">報告生成</a>
            </div>
        </div>

        <div class="panel">
            <h2>本地AI處理進度</h2>
            <div id="summary-panel">
                <p id="summary-status">正在初始化...</p>
            </div>
            <!-- Jules: 新增操作按鈕和全選框 -->
            <div id="actions-panel" style="margin-top: 1rem; display: flex; align-items: center; gap: 20px;">
                <button id="start-analysis-btn" class="button-primary" disabled>開始 OCR 與 AI 分析</button>
                <div style="display: flex; align-items: center;">
                    <input type="checkbox" id="select-all-checkbox" style="margin-right: 8px;">
                    <label for="select-all-checkbox">全選</label>
                </div>
                <span id="selection-counter">已選取 0 項</span>
            </div>
        </div>

        <div id="cards-container" class="card-grid">
            <!-- 卡片將由 JavaScript 動態生成 -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- DOM 元素參照 ---
            const summaryStatusEl = document.getElementById('summary-status');
            const cardsContainer = document.getElementById('cards-container');
            const startAnalysisBtn = document.getElementById('start-analysis-btn');
            const selectAllCheckbox = document.getElementById('select-all-checkbox');
            const selectionCounter = document.getElementById('selection-counter');

            // --- 狀態管理 ---
            let currentTaskId = null;
            let statusInterval = null;
            let startTime = null;
            const selectedItemIds = new Set(); // 使用 Set 結構以高效新增/刪除

            // --- 狀態對應與輔助函式 ---

            // (Jules): 統一管理狀態顯示，包括下載和分析流程的各種狀態
            const statusDisplayMap = {
                // 分析狀態 (用於 OCR 和 AI)
                'pending': { text: '未完成', icon: 'fa-regular fa-clock', color: '#6c757d' },
                'processing': { text: '處理中...', icon: 'fa-solid fa-spinner fa-spin', color: '#007bff' },
                'completed': { text: '已完成', icon: 'fa-solid fa-check-circle', color: '#28a745' },
                'failed': { text: '失敗', icon: 'fa-solid fa-times-circle', color: '#dc3545' },
                'unknown': { text: '未知', icon: 'fa-solid fa-question-circle', color: '#6c757d' },
            };

            // (Jules): 輔助函式，專門用來渲染 OCR 或 AI 的狀態欄位
            const renderAnalysisStatus = (statusKey) => {
                const status = statusDisplayMap[statusKey] || statusDisplayMap['unknown'];
                return `<span style="color: ${status.color};"><i class="${status.icon}" style="margin-right: 5px;"></i>${status.text}</span>`;
            };

            // --- 核心渲染邏輯 ---
            const render = (data) => {
                if (!data || !data.items) {
                    summaryStatusEl.textContent = '無法獲取任務資料，請重試。';
                    return;
                }

                // 更新上方摘要面板
                const isOverallCompleted = data.status === 'COMPLETED';
                const timeElapsed = startTime ? ((new Date() - startTime) / 1000).toFixed(1) : 0;
                if (isOverallCompleted) {
                    summaryStatusEl.textContent = `全部處理完成！ | 總耗時: ${timeElapsed} 秒`;
                } else {
                    summaryStatusEl.textContent = `正在處理中... | 總耗時: ${timeElapsed} 秒`;
                }

                // 重新渲染所有卡片
                cardsContainer.innerHTML = '';
                const allItemIdsOnPage = [];
                for (const itemId in data.items) {
                    allItemIdsOnPage.push(itemId.toString());
                    const item = data.items[itemId];
                    const card = document.createElement('div');
                    card.className = 'card';

                    const isChecked = selectedItemIds.has(item.id.toString());

                    // (Jules): 根據不同流程狀態，決定右上角徽章的顯示內容
                    const statusMap = {
                        'WAITING': { text: '⌛ 等待中', class: 'status-waiting' },
                        'DOWNLOADING': { text: '📥 下載中...', class: 'status-downloading' },
                        'DOWNLOADED': { text: '✅ 已下載', class: 'status-downloaded' },
                        'FAILED': { text: '❌ 失敗', class: 'status-failed' },
                        'PROCESSING_ANALYSIS': { text: '🤖 分析中...', class: 'status-downloading' }, // 借用下載中樣式
                        'COMPLETED_ANALYSIS': { text: '✅ 分析完成', class: 'status-downloaded' },
                    };
                    const statusInfo = statusMap[item.status] || { text: '❓ 未知', class: 'status-waiting' };

                    let errorHtml = '';
                    if (item.status === 'FAILED' && item.error_message) {
                        errorHtml = `<p class="error-message"><strong>錯誤:</strong> ${item.error_message}</p>`;
                    }

                    // (Jules): 動態產生卡片的 HTML，包含複選框和新的狀態欄位
                    card.innerHTML = `
                        <div class="card-header">
                            <div style="display: flex; align-items: center;">
                                <input type="checkbox" class="card-checkbox" data-id="${item.id}" ${isChecked ? 'checked' : ''}>
                                <span class="item-id" style="margin-left: 10px;">ID: ${item.id}</span>
                            </div>
                            <span class="item-status ${statusInfo.class}">${statusInfo.text}</span>
                        </div>
                        <div class="card-body">
                            <p><strong>標題:</strong> ${item.title || '讀取中...'}</p>
                            <p><strong>作者:</strong> ${item.author || '讀取中...'}</p>
                            <p><strong>時間:</strong> ${item.message_date || ''} ${item.message_time || ''}</p>
                            <hr style="margin: 8px 0;">
                            <p><strong>OCR 狀態:</strong> ${renderAnalysisStatus(item.ocr_status || 'pending')}</p>
                            <p><strong>AI 分析狀態:</strong> ${renderAnalysisStatus(item.ai_status || 'pending')}</p>
                            ${errorHtml}
                        </div>
                    `;
                    cardsContainer.appendChild(card);
                }

                // (Jules): 根據當前頁面所有項目的選取狀態，更新「全選」複選框的狀態
                const allVisibleChecked = allItemIdsOnPage.length > 0 && allItemIdsOnPage.every(id => selectedItemIds.has(id));
                selectAllCheckbox.checked = allVisibleChecked;
            };

            // --- 根據選取狀態更新 UI ---
            const updateActionsPanel = () => {
                const selectionCount = selectedItemIds.size;
                selectionCounter.textContent = `已選取 ${selectionCount} 項`;
                startAnalysisBtn.disabled = selectionCount === 0;
            };

            // --- API 呼叫與輪詢邏輯 ---
            const fetchStatus = async () => {
                if (!currentTaskId) return;

                try {
                    // (Jules): 將 API 端點從舊的 download_status 改為新的通用 status 端點
                    const response = await fetch(`/api/essay_performance/status/${currentTaskId}`);
                    if (!response.ok) {
                        throw new Error(`伺服器錯誤: ${response.status}`);
                    }
                    const data = await response.json();
                    render(data);

                    if (data.status === 'COMPLETED') {
                        clearInterval(statusInterval);
                        statusInterval = null; // 重置計時器 ID 很重要
                        console.log('任務完成，停止輪詢。');
                    }
                } catch (error) {
                    summaryStatusEl.textContent = `輪詢狀態失敗: ${error.message}`;
                    console.error('輪詢狀態時發生錯誤:', error);
                    clearInterval(statusInterval);
                    statusInterval = null;
                }
            };

            // (Jules): 抽象出一個通用的函式來啟動任務並開始輪詢
            const startTask = async (endpoint, payload, initialSummary) => {
                if (statusInterval) {
                    alert('已有一個任務正在執行中，請稍候。');
                    return;
                }
                summaryStatusEl.textContent = initialSummary;
                try {
                    const response = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                    });
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.detail || '啟動任務失敗');
                    }
                    const result = await response.json();
                    currentTaskId = result.task_id;
                    startTime = new Date();
                    await fetchStatus(); // 立即獲取一次初始狀態
                    statusInterval = setInterval(fetchStatus, 3000); // 開始輪詢
                } catch (error) {
                    summaryStatusEl.textContent = `啟動處理程序時發生錯誤: ${error.message}`;
                    console.error('啟動處理程序時發生錯誤:', error);
                }
            };

            // --- 頁面初始載入 ---
            const initialPageLoad = () => {
                const params = new URLSearchParams(window.location.search);
                const idsParam = params.get('ids');
                if (!idsParam) {
                    summaryStatusEl.textContent = '錯誤：URL 中缺少有效的 "ids" 參數。';
                    return;
                }
                const ids = idsParam.split(',').map(id => parseInt(id.trim())).filter(id => !isNaN(id));
                if (ids.length === 0) {
                    summaryStatusEl.textContent = '錯誤：未提供有效的項目 ID。';
                    return;
                }
                // 啟動初始的下載任務
                startTask(
                    '/api/essay_performance/start_download',
                    { ids: ids },
                    `正在向伺服器請求開始處理 ${ids.length} 個項目...`
                );
            };

            // --- 事件監聽器設定 ---

            // (Jules): 使用事件委派來處理所有卡片複選框的點擊事件
            cardsContainer.addEventListener('change', (e) => {
                if (e.target.classList.contains('card-checkbox')) {
                    const itemId = e.target.dataset.id;
                    if (e.target.checked) {
                        selectedItemIds.add(itemId);
                    } else {
                        selectedItemIds.delete(itemId);
                    }
                    updateActionsPanel();
                }
            });

            // (Jules): 處理「全選」複選框的邏輯
            selectAllCheckbox.addEventListener('change', () => {
                const cardCheckboxes = cardsContainer.querySelectorAll('.card-checkbox');
                cardCheckboxes.forEach(checkbox => {
                    const itemId = checkbox.dataset.id;
                    checkbox.checked = selectAllCheckbox.checked;
                    if (selectAllCheckbox.checked) {
                        selectedItemIds.add(itemId);
                    } else {
                        selectedItemIds.delete(itemId);
                    }
                });
                updateActionsPanel();
            });

            // (Jules): 處理「開始分析」按鈕的點擊事件
            startAnalysisBtn.addEventListener('click', () => {
                const selectedIds = Array.from(selectedItemIds).map(id => parseInt(id));
                if (selectedIds.length === 0) {
                    alert('請至少選取一個項目進行分析。');
                    return;
                }

                // (Jules): 收集當前頁面上所有項目的 ID，以維持 UI 上下文
                const allItemIdsOnPage = Array.from(cardsContainer.querySelectorAll('.card-checkbox'))
                                              .map(cb => parseInt(cb.dataset.id));

                startTask(
                    '/api/essay_performance/start_analysis',
                    {
                        ids: selectedIds,
                        all_item_ids: allItemIdsOnPage
                    },
                    `正在向伺服器請求開始分析 ${selectedIds.length} 個項目...`
                );
            });

            // --- 程式啟動！ ---
            initialPageLoad();
            updateActionsPanel(); // 初始呼叫以設定按鈕的禁用狀態
        });
    </script>
</body>
</html>
