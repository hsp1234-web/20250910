<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小作文績效 - 本地 AI 處理</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/nav.css">
    <link rel="stylesheet" href="/static/css/essay_performance_tabs.css">
    <link rel="stylesheet" href="/static/css/page1_unified.css">
    <!-- Jules: 為了顯示狀態圖示，引入 Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- (Jules @ 2025-10-08) 樣式直接參考 page1_sub_overview.html 以確保視覺一致性 -->
    <style>
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-id {
            font-size: 0.9em;
            color: #6c757d;
        }
        .item-status {
            font-size: 0.85em;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 12px;
            text-transform: uppercase;
        }
        /* 狀態顏色映射 */
        .status-waiting { color: #383d41; background-color: #e2e3e5; }
        .status-downloading { color: #0c5460; background-color: #d1ecf1; }
        .status-downloaded { color: #155724; background-color: #d4edda; }
        .status-failed { color: #721c24; background-color: #f8d7da; }

        .card-body p {
            margin-bottom: 0.5rem;
        }
        .card-body p:last-child {
            margin-bottom: 0;
        }
        .error-message {
            color: #721c24;
            font-size: 0.9em;
            word-break: break-all;
        }
        #summary-panel {
            font-size: 1.2em;
            padding: 1rem;
            background-color: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            border: 1px solid #dee2e6;
        }
    </style>
</head>
<body>
    <nav class="top-nav">
        <ul>
            <li><a href="/">鳳凰主頁</a></li>
            <li><a href="/page1">資料處理</a></li>
            <li><a href="/page2">批次下載</a></li>
            <li><a href="/page3">檔案處理</a></li>
            <li><a href="/page4_stage1_ai">AI 分析</a></li>
            <li><a href="/page5">備份管理</a></li>
            <li><a href="/page6">金鑰管理</a></li>
            <li><a href="/page7">提示詞管理</a></li>
            <li><a href="/page9">績效儀表板</a></li>
            <li><a href="/essay_performance/ingestion" class="active">小作文績效</a></li>
        </ul>
    </nav>

    <div class="content">
        <div class="panel">
            <h1>小作文績效</h1>
            <div class="tab-container" style="margin-top: 20px;">
                <a href="/essay_performance/ingestion" class="tab-button">資料擷取與處理</a>
                <a href="/essay_performance/processing" class="tab-button active">本地AI處理</a>
                <a href="/essay_performance/report" class="tab-button">報告生成</a>
            </div>
        </div>

        <div class="panel">
            <h2>本地AI處理進度</h2>
            <div id="summary-panel">
                <p id="summary-status">正在初始化...</p>
            </div>
            <!-- Jules: 新增操作按鈕和全選框 -->
            <div id="actions-panel" style="margin-top: 1rem; display: flex; align-items: center; gap: 20px;">
                <button id="start-analysis-btn" class="button-primary" disabled>開始 OCR 與 AI 分析</button>
                <div style="display: flex; align-items: center;">
                    <input type="checkbox" id="select-all-checkbox" style="margin-right: 8px;">
                    <label for="select-all-checkbox">全選</label>
                </div>
                <span id="selection-counter">已選取 0 項</span>
            </div>
        </div>

        <div id="cards-container" class="card-grid">
            <!-- 卡片將由 JavaScript 動態生成 -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- DOM 元素參照 ---
            const summaryStatusEl = document.getElementById('summary-status');
            const cardsContainer = document.getElementById('cards-container');
            const startAnalysisBtn = document.getElementById('start-analysis-btn');
            const selectAllCheckbox = document.getElementById('select-all-checkbox');
            const selectionCounter = document.getElementById('selection-counter');

            // --- 狀態管理 ---
            let currentTaskId = null;
            let statusInterval = null;
            let startTime = null;
            const selectedItemIds = new Set(); // 使用 Set 結構以高效新增/刪除

            // --- 狀態對應與輔助函式 ---

            // (Jules @ 2025-10-11) 重構 v2：狀態與歷程渲染
            const statusIconMap = {
                'QUEUED': { icon: 'fa-regular fa-clock', color: '#6c757d' },
                'DOWNLOADING': { icon: 'fa-solid fa-download', color: '#007bff' },
                'DOWNLOAD_SUCCESS': { icon: 'fa-solid fa-check', color: '#28a745' },
                'ANALYSIS_SENT': { icon: 'fa-solid fa-share-square', color: '#17a2b8' },
                'ANALYSIS_SUCCESS': { icon: 'fa-solid fa-check-double', color: '#28a745' },
                'PIPELINE_FAILED': { icon: 'fa-solid fa-times-circle', color: '#dc3545' },
                'ERROR': { icon: 'fa-solid fa-exclamation-triangle', color: '#ffc107' },
            };

            const overallStatusMap = {
                'QUEUED': { text: '⏳ 等待中...', class: 'status-waiting' },
                'DOWNLOADING': { text: '📥 下載中...', class: 'status-downloading' },
                'DOWNLOAD_SUCCESS': { text: '📥 下載完成', class: 'status-downloaded' },
                'ANALYSIS_SENT': { text: '🤖 分析中...', class: 'status-downloading' },
                'ANALYSIS_SUCCESS': { text: '✅ 完成', class: 'status-downloaded' },
                'PIPELINE_FAILED': { text: '❌ 失敗', class: 'status-failed' },
                'default': { text: '❔ 未知', class: 'status-waiting' }
            };

            const renderHistory = (history) => {
                if (!history || history.length === 0) {
                    return '<li>尚無處理歷程</li>';
                }
                return history.map(event => {
                    const statusInfo = statusIconMap[event.status] || statusIconMap['ERROR'];
                    let detailsText = '';
                    if (event.status === 'PIPELINE_FAILED' && event.details && event.details.error) {
                        detailsText = `<div class="error-message" style="margin-top: 5px; padding-left: 20px;"><strong>錯誤詳情:</strong> ${event.details.error}</div>`;
                    }
                    return `<li style="color: ${statusInfo.color};">
                                <i class="${statusInfo.icon}" style="margin-right: 8px; width: 20px;"></i>
                                ${event.message}
                                ${detailsText}
                            </li>`;
                }).join('');
            };

            const getOverallStatus = (history) => {
                if (!history || history.length === 0) {
                    return overallStatusMap['default'];
                }
                const lastEvent = history[history.length - 1];
                return overallStatusMap[lastEvent.status] || overallStatusMap['default'];
            };

            const renderCard = (item) => {
                const isChecked = selectedItemIds.has(item.id.toString());
                const history = item.processing_history || [];
                const overallStatus = getOverallStatus(history);

                return `
                    <div class="card-header">
                        <div style="display: flex; align-items: center;">
                            <input type="checkbox" class="card-checkbox" data-id="${item.id}" ${isChecked ? 'checked' : ''}>
                            <span class="item-id" style="margin-left: 10px;">ID: ${item.id}</span>
                        </div>
                        <span class="item-status ${overallStatus.class}">${overallStatus.text}</span>
                    </div>
                    <div class="card-body">
                        <p><strong>標題:</strong> ${item.title || '無標題'}</p>
                        <p><strong>作者:</strong> ${item.author || '未知'}</p>
                        <p><strong>時間:</strong> ${item.message_date ? item.message_date.split(' ')[0] : ''} ${item.message_time || ''}</p>
                        <hr style="margin: 8px 0;">
                        <p><strong>處理歷程:</strong></p>
                        <ul class="processing-history" style="list-style-type: none; padding-left: 0; font-size: 0.9em;">
                            ${renderHistory(history)}
                        </ul>
                    </div>
                `;
            };

            const renderItemList = (items) => {
                cardsContainer.innerHTML = '';
                if (!items || items.length === 0) {
                    summaryStatusEl.textContent = '資料庫中沒有可供處理的項目。';
                    return;
                }

                summaryStatusEl.textContent = `找到 ${items.length} 個可處理的項目。請選取後開始分析。`;

                items.forEach(item => {
                    const cardEl = document.createElement('div');
                    cardEl.className = 'card';
                    cardEl.id = `card-${item.id}`;
                    cardEl.innerHTML = renderCard(item);
                    cardsContainer.appendChild(cardEl);
                });

                updateActionsPanel();
            };

            const updateTaskStatusInUI = (taskData) => {
                const isOverallCompleted = taskData.status === 'COMPLETED';
                const timeElapsed = startTime ? ((new Date() - startTime) / 1000).toFixed(1) : 0;
                if (isOverallCompleted) {
                    summaryStatusEl.textContent = `全部處理完成！ | 總耗時: ${timeElapsed} 秒`;
                } else {
                    summaryStatusEl.textContent = `正在處理中... | 總耗時: ${timeElapsed} 秒`;
                }

                for (const itemId in taskData.items) {
                    const itemData = taskData.items[itemId];
                    const card = document.getElementById(`card-${itemId}`);
                    if (!card) continue;

                    // 重新渲染整個卡片以更新所有資訊
                    card.innerHTML = renderCard(itemData);
                }
            };

            // --- 根據選取狀態更新 UI ---
            const updateActionsPanel = () => {
                const selectionCount = selectedItemIds.size;
                selectionCounter.textContent = `已選取 ${selectionCount} 項`;
                startAnalysisBtn.disabled = selectionCount === 0;
            };

            // --- API 呼叫與輪詢邏輯 ---
            const fetchStatus = async () => {
                if (!currentTaskId) return;

                try {
                    const response = await fetch(`/api/essay_performance/status/${currentTaskId}`);
                    if (!response.ok) {
                        throw new Error(`伺服器錯誤: ${response.status}`);
                    }
                    const data = await response.json();
                    updateTaskStatusInUI(data); // (Jules): 改為呼叫僅更新狀態的函式

                    if (data.status === 'COMPLETED') {
                        clearInterval(statusInterval);
                        statusInterval = null;
                        console.log('任務完成，停止輪詢。');
                        // (Jules): 任務完成後，重新載入整個列表以同步最終狀態
                        await initialPageLoad();
                    }
                } catch (error) {
                    summaryStatusEl.textContent = `輪詢狀態失敗: ${error.message}`;
                    console.error('輪詢狀態時發生錯誤:', error);
                    clearInterval(statusInterval);
                    statusInterval = null;
                }
            };

            // (Jules): 抽象出一個通用的函式來啟動任務並開始輪詢
            const startTask = async (endpoint, payload, initialSummary) => {
                if (statusInterval) {
                    alert('已有一個任務正在執行中，請稍候。');
                    return;
                }
                summaryStatusEl.textContent = initialSummary;
                try {
                    const response = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                    });
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.detail || '啟動任務失敗');
                    }
                    const result = await response.json();
                    currentTaskId = result.task_id;
                    startTime = new Date();
                    await fetchStatus(); // 立即獲取一次初始狀態
                    statusInterval = setInterval(fetchStatus, 3000); // 開始輪詢
                } catch (error) {
                    summaryStatusEl.textContent = `啟動處理程序時發生錯誤: ${error.message}`;
                    console.error('啟動處理程序時發生錯誤:', error);
                }
            };

            // --- 頁面初始載入 (Jules @ 2025-10-10) 重構 ---
            const initialPageLoad = async () => {
                summaryStatusEl.textContent = '正在從資料庫載入所有可處理的項目...';
                try {
                    const response = await fetch('/api/essay_performance/processing_items');
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.detail || '無法載入項目');
                    }
                    const items = await response.json();
                    renderItemList(items); // 使用新的渲染函式
                } catch (error) {
                    summaryStatusEl.textContent = `載入頁面時發生錯誤: ${error.message}`;
                    console.error('載入頁面時發生錯誤:', error);
                }
            };

            // --- 事件監聽器設定 ---

            // (Jules): 使用事件委派來處理所有卡片複選框的點擊事件
            cardsContainer.addEventListener('change', (e) => {
                if (e.target.classList.contains('card-checkbox')) {
                    const itemId = e.target.dataset.id;
                    if (e.target.checked) {
                        selectedItemIds.add(itemId);
                    } else {
                        selectedItemIds.delete(itemId);
                    }
                    updateActionsPanel();
                }
            });

            // (Jules): 處理「全選」複選框的邏輯
            selectAllCheckbox.addEventListener('change', () => {
                const cardCheckboxes = cardsContainer.querySelectorAll('.card-checkbox');
                cardCheckboxes.forEach(checkbox => {
                    const itemId = checkbox.dataset.id;
                    checkbox.checked = selectAllCheckbox.checked;
                    if (selectAllCheckbox.checked) {
                        selectedItemIds.add(itemId);
                    } else {
                        selectedItemIds.delete(itemId);
                    }
                });
                updateActionsPanel();
            });

            // (Jules @ 2025-10-11) 處理「開始分析」按鈕的點擊事件，改為呼叫完整流程 API
            startAnalysisBtn.addEventListener('click', () => {
                const selectedIds = Array.from(selectedItemIds).map(id => parseInt(id));
                if (selectedIds.length === 0) {
                    alert('請至少選取一個項目進行分析。');
                    return;
                }

                const allItemIdsOnPage = Array.from(cardsContainer.querySelectorAll('.card-checkbox'))
                                              .map(cb => parseInt(cb.dataset.id));

                startTask(
                    '/api/essay_performance/start_full_analysis', // 改為呼叫新的合併後端點
                    {
                        ids: selectedIds,
                        all_item_ids: allItemIdsOnPage
                    },
                    `正在啟動完整處理流程，共 ${selectedIds.length} 個項目...`
                );
            });

            // --- 程式啟動！ ---
            initialPageLoad();
            updateActionsPanel(); // 初始呼叫以設定按鈕的禁用狀態
        });
    </script>
</body>
</html>
