<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>頁面六：金鑰管理</title>
    <link rel="stylesheet" href="/static/css/nav.css">
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/page6.css">
</head>
<body>
    <nav class="top-nav">
        <ul>
            <li><a href="/">鳳凰主頁</a></li>
            <li><a href="/page1">網址提取</a></li>
            <li><a href="/page2">批次下載</a></li>
            <li><a href="/page3">檔案處理</a></li>
            <li><a href="/page4_stage1_ai">AI 分析</a></li>
            <li><a href="/page5">備份管理</a></li>
            <li><a href="/page6" class="active">金鑰管理</a></li>
            <li><a href="/page7">提示詞管理</a></li>
            <li><a href="/page9">績效儀表板</a></li>
        </ul>
    </nav>

    <div class="content">
        <div class="panel">
            <h1>金鑰管理</h1>
            <p>此頁面用於管理您的 Google API 金鑰池。有效的金鑰將被用於 AI 分析任務。</p>
        </div>

        <!-- 新增：模式選擇 -->
        <div class="panel">
            <h2>金鑰輸入模式</h2>
            <div class="form-group radio-group">
                <input type="radio" id="mode-manual" name="key-mode" value="manual" checked>
                <label for="mode-manual">手動輸入</label>
                <input type="radio" id="mode-authorized" name="key-mode" value="authorized">
                <label for="mode-authorized">從授權來源載入</label>
            </div>
        </div>

        <!-- 模式一：手動輸入 -->
        <div id="manual-input-panel" class="panel">
            <h2>新增金鑰 (手動)</h2>
            <div class="form-group">
                <textarea id="new-keys-textarea" placeholder="在此貼上多個 API 金鑰（一行一個）" rows="5"></textarea>
                <input type="text" id="new-key-name-input" placeholder="為金鑰設定一個別名 (可選)">
                <small>說明：若貼上多個金鑰，別名只會套用於第一個金鑰。</small>
                <button id="add-key-btn">新增金鑰</button>
            </div>
            <div id="add-key-status"></div>
        </div>

        <!-- 模式二：從授權來源載入 -->
        <div id="authorized-load-panel" class="panel" style="display: none;">
            <h2>從授權來源載入 (自動)</h2>
            <p>此模式會嘗試從伺服器環境變數中讀取名為 <code>GOOGLE_API_KEY</code>, <code>GOOGLE_API_KEY_1</code>... 的金鑰。</p>
            <div class="form-group">
                <label for="key-load-count">金鑰載入數量 (0-20):</label>
                <input type="number" id="key-load-count" min="0" max="20" value="5">
                <button id="load-from-env-btn">開始載入</button>
            </div>
            <div id="load-from-env-status"></div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <h2>金鑰池</h2>
                <button id="validate-all-btn">重新驗證所有金鑰</button>
            </div>
            <div id="key-list-container">
                <p>正在載入金鑰列表...</p>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <h2>可用模型</h2>
                <button id="fetch-models-btn">查詢可用模型</button>
            </div>
            <div id="model-list-container">
                <p>點擊按鈕以查詢目前所有可用的模型。</p>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // --- 元素選擇器 ---
        const keyListContainer = document.getElementById('key-list-container');
        const validateAllBtn = document.getElementById('validate-all-btn');
        const fetchModelsBtn = document.getElementById('fetch-models-btn');
        const modelListContainer = document.getElementById('model-list-container');

        // 模式選擇
        const modeManualRadio = document.getElementById('mode-manual');
        const modeAuthorizedRadio = document.getElementById('mode-authorized');
        const manualInputPanel = document.getElementById('manual-input-panel');
        const authorizedLoadPanel = document.getElementById('authorized-load-panel');

        // 手動模式元素
        const addKeyBtn = document.getElementById('add-key-btn');
        const newKeysTextarea = document.getElementById('new-keys-textarea');
        const newKeyNameInput = document.getElementById('new-key-name-input');
        const addKeyStatus = document.getElementById('add-key-status');

        // 授權模式元素
        const loadFromEnvBtn = document.getElementById('load-from-env-btn');
        const keyLoadCountInput = document.getElementById('key-load-count');
        const loadFromEnvStatus = document.getElementById('load-from-env-status');

        // --- 通用函式 ---
        const renderStatus = (element, message, isError = false, append = false) => {
            if (append) {
                const p = document.createElement('p');
                p.textContent = message;
                p.style.color = isError ? 'red' : 'green';
                element.appendChild(p);
            } else {
                element.innerHTML = ''; // 清空
                element.textContent = message;
                element.style.color = isError ? 'red' : 'green';
            }
        };

        const renderKeyList = (keys) => {
            if (keys.length === 0) {
                keyListContainer.innerHTML = '<p>目前沒有已儲存的金鑰。</p>';
                return;
            }
            let html = '<ul class="key-list">';
            keys.forEach(key => {
                const statusClass = key.is_valid === true ? 'status-valid' : (key.is_valid === false ? 'status-invalid' : 'status-untested');
                const statusText = key.is_valid === true ? '有效' : (key.is_valid === false ? '無效' : '未驗證');
                const lastValidated = key.last_validated ? new Date(key.last_validated).toLocaleString('zh-TW') : '從未';

                html += `
                    <li class="key-item">
                        <span class="key-name">${key.name}</span>
                        <span class="key-hash">雜湊值: ...${key.key_hash.slice(-8)}</span>
                        <span class="key-status ${statusClass}">${statusText}</span>
                        <span class="key-validated">上次驗證: ${lastValidated}</span>
                        <button class="delete-btn" data-hash="${key.key_hash}">刪除</button>
                    </li>
                `;
            });
            html += '</ul>';
            keyListContainer.innerHTML = html;
        };

        const fetchKeys = async () => {
            try {
                const response = await fetch('/api/keys');
                if (!response.ok) throw new Error('無法獲取金鑰列表');
                const keys = await response.json();
                renderKeyList(keys);
            } catch (error) {
                keyListContainer.innerHTML = `<p style="color: red;">${error.message}</p>`;
            }
        };

        // --- 事件監聽器 ---

        // 模式切換邏輯
        modeManualRadio.addEventListener('change', () => {
            manualInputPanel.style.display = 'block';
            authorizedLoadPanel.style.display = 'none';
        });

        modeAuthorizedRadio.addEventListener('change', () => {
            manualInputPanel.style.display = 'none';
            authorizedLoadPanel.style.display = 'block';
        });

        // 手動模式邏輯
        addKeyBtn.addEventListener('click', async () => {
            const keys = newKeysTextarea.value.trim().split('\\n').filter(k => k.trim() !== '');
            const name = newKeyNameInput.value.trim();

            if (keys.length === 0) {
                renderStatus(addKeyStatus, 'API 金鑰不可為空。', true);
                return;
            }

            addKeyBtn.disabled = true;
            addKeyBtn.textContent = '新增中...';
            addKeyStatus.innerHTML = ''; // 清空狀態區

            for (let i = 0; i < keys.length; i++) {
                const key = keys[i].trim();
                // 別名只套用在第一個金鑰上
                const keyName = (i === 0 && name) ? name : null;
                renderStatus(addKeyStatus, `正在處理金鑰 #${i + 1}...`, false, true);

                try {
                    const response = await fetch('/api/keys', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ api_key: key, name: keyName })
                    });
                    const result = await response.json();
                    if (!response.ok) throw new Error(result.detail || '新增失敗');
                    renderStatus(addKeyStatus, `✅ 金鑰 #${i + 1} (${result.name}) 新增成功。`, false, true);
                } catch (error) {
                    renderStatus(addKeyStatus, `❌ 金鑰 #${i + 1} 新增失敗: ${error.message}`, true, true);
                }
            }

            newKeysTextarea.value = '';
            newKeyNameInput.value = '';
            addKeyBtn.disabled = false;
            addKeyBtn.textContent = '新增金鑰';
            fetchKeys();
        });

        // 授權模式邏輯
        loadFromEnvBtn.addEventListener('click', async () => {
            const count = parseInt(keyLoadCountInput.value, 10);
            if (isNaN(count) || count < 0 || count > 20) {
                renderStatus(loadFromEnvStatus, '請輸入 0-20 之間的有效數字。', true);
                return;
            }

            loadFromEnvBtn.disabled = true;
            loadFromEnvBtn.textContent = '載入中...';
            renderStatus(loadFromEnvStatus, `正在從授權來源請求載入 ${count + 1} 組金鑰...`, false);

            try {
                const response = await fetch('/api/keys/load_from_authorized_source', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ count: count })
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.detail || '請求失敗');

                const summary = result.summary;
                let report = `<b>載入報告:</b><br>`;
                report += `嘗試總數: ${summary.total_attempted}<br>`;
                report += `成功新增: ${summary.successfully_added}<br>`;
                report += `已存在: ${summary.already_existed}<br>`;
                report += `未找到: ${summary.not_found}<br>`;
                report += `無效金鑰: ${summary.invalid_keys}`;
                loadFromEnvStatus.innerHTML = report;
                loadFromEnvStatus.style.color = 'black';

            } catch (error) {
                renderStatus(loadFromEnvStatus, `錯誤: ${error.message}`, true);
            } finally {
                loadFromEnvBtn.disabled = false;
                loadFromEnvBtn.textContent = '開始載入';
                fetchKeys();
            }
        });


        // 其他既有功能
        keyListContainer.addEventListener('click', async (e) => {
            if (e.target.classList.contains('delete-btn')) {
                const keyHash = e.target.dataset.hash;
                if (!confirm(`您確定要刪除雜湊值結尾為 ...${keyHash.slice(-8)} 的金鑰嗎？`)) {
                    return;
                }
                try {
                    const response = await fetch(`/api/keys/${keyHash}`, { method: 'DELETE' });
                    const result = await response.json();
                    if (!response.ok) throw new Error(result.detail || '刪除失敗');
                    fetchKeys();
                } catch (error) {
                    alert(`刪除失敗: ${error.message}`);
                }
            }
        });

        validateAllBtn.addEventListener('click', async () => {
            validateAllBtn.disabled = true;
            validateAllBtn.textContent = '正在驗證所有金鑰...';
            keyListContainer.innerHTML = '<p>請稍候，正在逐一驗證所有金鑰...</p>';
            try {
                const response = await fetch('/api/keys/validate', { method: 'POST' });
                const result = await response.json();
                if (!response.ok) throw new Error(result.detail || '驗證失敗');
                renderKeyList(result.keys);
            } catch (error) {
                 keyListContainer.innerHTML = `<p style="color: red;">驗證時發生錯誤: ${error.message}</p>`;
            } finally {
                validateAllBtn.disabled = false;
                validateAllBtn.textContent = '重新驗證所有金鑰';
            }
        });

        fetchModelsBtn.addEventListener('click', async () => {
            fetchModelsBtn.disabled = true;
            fetchModelsBtn.textContent = '查詢中...';
            modelListContainer.innerHTML = '<p>正在向 Google API 查詢可用的模型，請稍候...</p>';

            try {
                const response = await fetch('/api/keys/models');
                const result = await response.json();
                if (!response.ok) {
                    throw new Error(result.detail || '查詢失敗');
                }

                if (result.length > 0) {
                    let modelHtml = '<ul>';
                    result.forEach(model => {
                        modelHtml += `<li>${model}</li>`;
                    });
                    modelHtml += '</ul>';
                    modelListContainer.innerHTML = modelHtml;
                } else {
                    modelListContainer.innerHTML = '<p>未找到任何可用的模型。</p>';
                }

            } catch (error) {
                modelListContainer.innerHTML = `<p style="color: red;">查詢模型時發生錯誤: ${error.message}</p>`;
            } finally {
                fetchModelsBtn.disabled = false;
                fetchModelsBtn.textContent = '重新查詢可用模型';
            }
        });

        // --- 初始載入 ---
        fetchKeys();

        const centerActiveNavButton = () => {
            const activeNavButton = document.querySelector('.top-nav a.active');
            if (activeNavButton) {
                activeNavButton.scrollIntoView({
                    behavior: 'smooth',
                    inline: 'center',
                    block: 'nearest'
                });
            }
        };
        setTimeout(centerActiveNavButton, 100);
    });
    </script>
</body>
</html>
