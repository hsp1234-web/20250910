<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINE 貼文批量整理工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
        }
        .result-item {
            border-left: 3px solid #4f46e5;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1f2937;
        }
        ::-webkit-scrollbar-thumb {
            background: #4f46e5;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4338ca;
        }
        .btn-action {
            @apply bg-gray-700 hover:bg-gray-600 text-white font-semibold py-2 px-4 rounded-lg transition-colors duration-200 flex items-center gap-2;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-200 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-4xl mx-auto bg-gray-800 rounded-2xl shadow-2xl p-6 md:p-10 space-y-8">
        <!-- 標題區 -->
        <div class="text-center">
            <h1 class="text-3xl md:text-4xl font-bold text-white">LINE 貼文批量整理工具</h1>
            <p class="text-gray-400 mt-2">將您的 LINE 聊天記錄，自動轉換為帶有超連結的清單。</p>
        </div>

        <!-- 輸入區 -->
        <div class="space-y-6">
            <div>
                <label for="chat-input" class="block text-lg font-semibold mb-2 text-indigo-400">步驟一：在此貼上您的 LINE 聊天記錄</label>
                <textarea id="chat-input" rows="12" class="w-full p-4 bg-gray-900 border-2 border-gray-700 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors duration-200" placeholder="從您的文字檔複製並貼上聊天記錄..."></textarea>
            </div>

            <!-- 日期選擇區 -->
            <div class="grid md:grid-cols-2 gap-6">
                <div>
                    <label for="start-date" class="block text-lg font-semibold mb-2 text-indigo-400">步驟二：選擇開始日期</label>
                    <input type="date" id="start-date" class="w-full p-3 bg-gray-900 border-2 border-gray-700 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label for="end-date" class="block text-lg font-semibold mb-2 text-indigo-400">步驟三：選擇結束日期</label>
                    <input type="date" id="end-date" class="w-full p-3 bg-gray-900 border-2 border-gray-700 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
            </div>

            <!-- 按鈕 -->
            <button id="generate-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-6 rounded-lg text-lg transition-transform transform hover:scale-105 duration-300 shadow-lg">
                生成整理清單
            </button>
        </div>

        <!-- 分隔線 -->
        <hr class="border-gray-700">

        <!-- 結果區 -->
        <div>
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold text-white">整理結果</h2>
                <!-- 新增的操作按鈕 -->
                <div id="result-actions" class="hidden flex items-center gap-3">
                    <button id="copy-btn" class="btn-action">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1v-1z"/>
                            <path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h3zM-1 8a.5.5 0 0 1 .5-.5h15a.5.5 0 0 1 0 1H-.5A.5.5 0 0 1-1 8z"/>
                        </svg>
                        <span id="copy-btn-text">複製到剪貼簿</span>
                    </button>
                    <button id="download-btn" class="btn-action">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
                            <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/>
                        </svg>
                        <span>下載為 HTML</span>
                    </button>
                </div>
            </div>
            <div id="result-output" class="p-6 bg-gray-900 rounded-lg space-y-6 max-h-[50vh] overflow-y-auto">
                <p class="text-gray-500">結果將會顯示在這裡...</p>
            </div>
        </div>
    </div>

    <script>
        const chatInput = document.getElementById('chat-input');
        const startDateInput = document.getElementById('start-date');
        const endDateInput = document.getElementById('end-date');
        const generateBtn = document.getElementById('generate-btn');
        const resultOutput = document.getElementById('result-output');
        const resultActions = document.getElementById('result-actions');
        const downloadBtn = document.getElementById('download-btn');
        const copyBtn = document.getElementById('copy-btn');
        const copyBtnText = document.getElementById('copy-btn-text');

        generateBtn.addEventListener('click', () => {
            const rawText = chatInput.value;
            const startDate = startDateInput.value ? new Date(startDateInput.value) : null;
            const endDate = endDateInput.value ? new Date(endDateInput.value) : null;

            if (startDate) startDate.setHours(0, 0, 0, 0);
            if (endDate) endDate.setHours(23, 59, 59, 999);

            if (!rawText.trim()) {
                resultOutput.innerHTML = `<p class="text-yellow-400">請先貼上聊天記錄。</p>`;
                resultActions.classList.add('hidden');
                return;
            }
            if (!startDate || !endDate) {
                resultOutput.innerHTML = `<p class="text-yellow-400">請選擇開始與結束日期。</p>`;
                resultActions.classList.add('hidden');
                return;
            }

            const posts = parseChatLog(rawText);
            const filteredPosts = posts.filter(post => {
                const postDate = new Date(post.date);
                return postDate >= startDate && postDate <= endDate;
            });

            renderResults(filteredPosts);
        });

        downloadBtn.addEventListener('click', () => {
            const htmlContent = `
                <!DOCTYPE html>
                <html lang="zh-Hant">
                <head>
                    <meta charset="UTF-8">
                    <title>LINE 貼文整理結果</title>
                    <style>
                        body { font-family: sans-serif; line-height: 1.6; margin: 2em; background-color: #f8f9fa; color: #212529; }
                        .container { max-width: 800px; margin: auto; background-color: #ffffff; padding: 2em; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
                        h1 { color: #343a40; }
                        .post { border-left: 3px solid #0d6efd; padding-left: 1em; margin-bottom: 1.5em; }
                        .post p { margin: 0.25em 0; }
                        .author { color: #6c757d; }
                        a { color: #0d6efd; text-decoration: none; }
                        a:hover { text-decoration: underline; }
                    </style>
                </head>
                <body>
                    <div class="container">
                        <h1>LINE 貼文整理結果</h1>
                        <p>整理期間：${startDateInput.value} 至 ${endDateInput.value}</p>
                        <hr>
                        ${resultOutput.innerHTML}
                    </div>
                </body>
                </html>
            `;

            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `LINE貼文整理-${new Date().toISOString().slice(0, 10)}.html`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        copyBtn.addEventListener('click', () => {
            const content = resultOutput.innerHTML;
            const blob = new Blob([content], { type: 'text/html' });
            const item = new ClipboardItem({ 'text/html': blob });

            navigator.clipboard.write([item]).then(() => {
                copyBtnText.textContent = '已複製！';
                copyBtn.classList.add('bg-green-600', 'hover:bg-green-600');
                setTimeout(() => {
                    copyBtnText.textContent = '複製到剪貼簿';
                    copyBtn.classList.remove('bg-green-600', 'hover:bg-green-600');
                }, 2000);
            }).catch(err => {
                console.error('複製失敗:', err);
                copyBtnText.textContent = '複製失敗';
                 setTimeout(() => {
                    copyBtnText.textContent = '複製到剪貼簿';
                }, 2000);
            });
        });

        function parseChatLog(text) {
            const lines = text.split('\n');
            const posts = [];
            let currentDate = null;
            const dateRegex = /(\d{4})[年\/](\d{1,2})[月\/](\d{1,2})/;
            const messageRegex = /^(\d{2}:\d{2})\t([^\t]+)\t?(.*)$/;
            const urlRegexGlobal = /(https?:\/\/[^\s]+)/g;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                const dateMatch = line.match(dateRegex);
                if (dateMatch) {
                    const year = dateMatch[1];
                    const month = dateMatch[2].padStart(2, '0');
                    const day = dateMatch[3].padStart(2, '0');
                    currentDate = `${year}-${month}-${day}`;
                    continue;
                }
                if (!currentDate) continue;
                const messageMatch = line.match(messageRegex);
                if (messageMatch) {
                    const time = messageMatch[1];
                    const author = messageMatch[2].trim();
                    const content = messageMatch[3].trim();
                    if (author.includes("加入聊天") || content.includes("已收回訊息") || author.includes("變更了聊天室圖片")) continue;
                    let combinedContent = content;
                    let urls = content.match(urlRegexGlobal);
                    if (!urls && (i + 1) < lines.length) {
                        const nextLine = lines[i + 1].trim();
                        if (nextLine.startsWith('http') && !nextLine.match(messageRegex)) {
                            combinedContent = (combinedContent + ` ${nextLine}`).trim();
                            i++;
                        }
                    }
                    if (combinedContent.match(urlRegexGlobal)) {
                        posts.push({ date: currentDate, time: time, author: author, urlText: combinedContent });
                    }
                }
            }
            return posts;
        }

        function renderResults(posts) {
            if (posts.length === 0) {
                resultOutput.innerHTML = `<p class="text-gray-500">在選定的日期範圍內找不到任何包含網址的貼文。</p>`;
                resultActions.classList.add('hidden');
                return;
            }
            resultOutput.innerHTML = '';
            posts.forEach((post, index) => {
                const postElement = document.createElement('div');
                postElement.className = 'result-item bg-gray-900 p-4 rounded-lg';
                const urlRegex = /(https?:\/\/[^\s,]+)/g;
                const linkedContent = post.urlText.replace(urlRegex, (url) => `<a href="${url}" target="_blank" rel="noopener noreferrer" class="text-cyan-400 hover:text-cyan-300 hover:underline break-all">${url}</a>`);
                postElement.innerHTML = `
                    <p class="font-semibold text-white"><span class="text-indigo-400">${index + 1}.</span> 時間: ${post.date.replace(/-/g, '/')} ${post.time}</p>
                    <p class="mt-1 text-gray-300"><span class="font-medium text-gray-500">作者:</span> ${post.author}</p>
                    <div class="mt-2 text-gray-300"><span class="font-medium text-gray-500">內容:</span> ${linkedContent || '[只有網址]'}</div>
                `;
                resultOutput.appendChild(postElement);
            });
            resultActions.classList.remove('hidden');
        }
    </script>
</body>
</html>
