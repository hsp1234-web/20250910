<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINE 資料檢視器</title>
    <link rel="stylesheet" href="/static/css/main.css?v=1.1">
    <link rel="stylesheet" href="/static/css/nav.css?v=1.1">
    <link rel="stylesheet" href="/static/css/line_workflow.css?v=1.1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .table-container {
            width: 100%;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #dee2e6;
            white-space: nowrap; /* (Jules @ 2025-10-16) 修正：防止儲存格內容換行，確保表格可以水平捲動 */
        }
        th {
            background-color: #f8f9fa;
            font-weight: bold;
        }
        tr:hover {
            background-color: #f1f3f5;
        }
        .status-tag {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
            color: #fff;
        }
        .status-completed { background-color: #28a745; }
        .status-failed, .status-analysis_failed, .status-download_failed { background-color: #dc3545; }
        .status-running, .status-downloading, .status-analyzing { background-color: #007bff; }
        .status-pending, .status-skipped { background-color: #6c757d; }
        .status-downloaded, .status-success { background-color: #28a745; }
        .status-not_applicable { background-color: #f8f9fa; color: #6c757d; border: 1px solid #dee2e6;}
    </style>
</head>
<body>
    <nav class="top-nav">
        <ul>
            <li><a href="/">鳳凰主頁</a></li>
            <li><a href="/line_importer">LINE 內容整理</a></li>
        </ul>
    </nav>

    <div class="content">
        <div class="panel">
             <nav class="tab-nav">
                <a href="/line_importer">資料擷取與處理</a>
                <a href="/line_workflow_editor">工作流編輯器</a>
                <a href="/line_data_viewer" class="active">資料檢視器</a>
            </nav>
            <h1>LINE 資料檢視器</h1>
            <p>此頁面顯示所有已匯入的 LINE 項目，並提供手動檢視與編輯的入口。</p>
            <div class="table-container">
                <table id="items-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>發言者</th>
                            <th>下載狀態</th>
                            <th>提取狀態</th>
                            <th>OCR 狀態</th>
                            <th>AI 摘要</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="items-table-body">
                        <!-- 資料將由 JavaScript 動態填入 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tableBody = document.getElementById('items-table-body');

            const statusClassMap = {
                'success': 'status-success',
                'failed': 'status-failed',
                'running': 'status-running',
                'pending': 'status-pending',
                'not_applicable': 'status-not_applicable',
                'skipped': 'status-skipped',
            };

            const statusTextMap = {
                'success': '成功',
                'failed': '失敗',
                'running': '執行中',
                'pending': '待處理',
                'not_applicable': '不適用',
                'skipped': '已跳過',
            };

            const renderStatusTag = (status) => {
                const statusClass = statusClassMap[status] || 'status-pending';
                const statusText = statusTextMap[status] || status || '待處理';
                return `<span class="status-tag ${statusClass}">${statusText}</span>`;
            };

            const fetchItems = async () => {
                try {
                    const response = await fetch('/api/line_data/items?sort_by=author&sort_order=asc');
                    if (!response.ok) {
                        throw new Error('無法獲取資料');
                    }
                    const items = await response.json();

                    tableBody.innerHTML = '';
                    if (items.length === 0) {
                         tableBody.innerHTML = `<tr><td colspan="7" style="text-align:center;">目前沒有任何項目。</td></tr>`;
                         return;
                    }

                    items.forEach(item => {
                        const row = `
                            <tr>
                                <td>${item.id}</td>
                                <td>${item.author || 'N/A'}</td>
                                <td>${renderStatusTag(item.status_download)}</td>
                                <td>${renderStatusTag(item.status_extraction)}</td>
                                <td>${renderStatusTag(item.status_ocr)}</td>
                                <td>${renderStatusTag(item.status_ai_summary)}</td>
                                <td>
                                    <a href="/line_item_editor?id=${item.id}" class="button-small">查看/編輯</a>
                                </td>
                            </tr>
                        `;
                        tableBody.innerHTML += row;
                    });
                } catch (error) {
                    tableBody.innerHTML = `<tr><td colspan="7" style="text-align:center; color: red;">錯誤: ${error.message}</td></tr>`;
                }
            };

            // fetchItems(); // 改由就緒檢查器觸發
        });
    </script>
    <!-- JULES'S V9 REFACTOR (2025-10-16): 新增的、更穩健的啟動邏輯 -->
    <div id="readiness-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.7); color: white; display: flex; justify-content: center; align-items: center; font-size: 1.5em; z-index: 9999; flex-direction: column; text-align: center;">
        <div class="spinner" style="border: 4px solid rgba(255, 255, 255, 0.3); border-radius: 50%; border-top: 4px solid #fff; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px;"></div>
        <p>系統正在初始化核心服務，請稍候...</p>
    </div>
    <script>
        const checkSystemReadiness = async () => {
            const overlay = document.getElementById('readiness-overlay');
            const overlayText = overlay.querySelector('p');

            document.querySelectorAll('button, a.button').forEach(btn => {
                if (!btn.closest('.top-nav')) {
                    btn.disabled = true;
                    btn.title = '正在等待後端服務完全就緒...';
                }
            });
            overlay.style.display = 'flex';

            const poll = async (url, { maxRetries = 10, delay = 500, backoff = 1.5, timeout = 3000 }) => {
                for (let i = 0; i < maxRetries; i++) {
                    try {
                        const controller = new AbortController();
                        const id = setTimeout(() => controller.abort(), timeout);
                        const response = await fetch(url, { signal: controller.signal });
                        clearTimeout(id);
                        if (response.ok) return response;
                    } catch (error) {
                        console.warn(`[輪詢] 第 ${i + 1} 次請求 ${url} 失敗: ${error.message}`);
                    }
                    await new Promise(resolve => setTimeout(resolve, delay));
                    delay *= backoff;
                }
                throw new Error(`在 ${maxRetries} 次重試後，輪詢 ${url} 超時。`);
            };

            try {
                overlayText.textContent = '正在連接後端 API 伺服器...';
                await poll('/api/system_stats', { maxRetries: 15, delay: 300, backoff: 1.3 });
                overlay.style.display = 'none';

                await poll('/api/health/ready', { maxRetries: 60, delay: 1000, backoff: 1.1 });

                document.dispatchEvent(new Event('app-ready'));

            } catch (error) {
                overlayText.innerHTML = `❌ 連接後端失敗。<br><small>${error.message}</small>`;
                overlay.style.backgroundColor = 'rgba(121, 28, 28, 0.85)';
            }
        };

        document.addEventListener('app-ready', () => {
             // 找到 DOMContentLoaded 中的 fetchItems 函數並呼叫
            const fetchItemsFunc = document.querySelector('script:not([src])').textContent.match(/const fetchItems = async \(\) => {([\s\S]*?)};/);
            if(fetchItemsFunc) {
                eval(fetchItemsFunc[0]); // 重新宣告
                eval('fetchItems()'); // 呼叫
            }
        });

        checkSystemReadiness();
    </script>
</body>
</html>
