<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音訊報告生成器 - 主頁</title>
    <style>
        :root {
            --bg-color: #F8F9FA;
            --text-color: #202124;
            --card-bg-color: rgba(255, 255, 255, 0.9);
            --card-border-color: #e0e0e0;
            --button-bg-color: #007bff;
            --button-hover-bg-color: #0056b3;
            --success-color: #28a745;
            --secondary-btn-bg: #6c757d;
            --secondary-btn-hover-bg: #5a6268;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            font-size: 100%;
            line-height: 1.6;
        }
        .container { max-width: 900px; margin: auto; display: flex; flex-direction: column; gap: 24px; }
        .card {
            border: 1px solid var(--card-border-color);
            border-radius: 12px;
            padding: 24px;
            background-color: var(--card-bg-color);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h1 { font-size: 2em; font-weight: 700; text-align: center; margin-bottom: 8px; }
        h2 { font-size: 1.4em; font-weight: 600; margin-bottom: 16px; border-bottom: 2px solid var(--button-bg-color); padding-bottom: 8px;}
        p { color: #5f6368; }
        .nav-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 24px 0;
        }
        .nav-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            color: white;
            font-size: 1.2em;
            font-weight: 600;
            transition: all 0.3s ease;
            text-align: center;
            min-height: 120px;
        }
        .nav-button .step { font-size: 0.8em; opacity: 0.8; display: block; margin-bottom: 8px; }
        .nav-button:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
        .primary-action { background-color: var(--button-bg-color); }
        .primary-action:hover { background-color: var(--button-hover-bg-color); }
        .secondary-action { background-color: var(--success-color); }
        .secondary-action:hover { background-color: #218838; }
        .results-link-container { text-align: center; margin-top: 16px; }
        .results-link {
            color: var(--secondary-btn-bg);
            text-decoration: none;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .results-link:hover {
            color: var(--text-color);
            border-bottom-color: var(--text-color);
        }
        .task-list { max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .task-item {
            padding: 12px;
            border-radius: 8px;
            background-color: #f9f9f9;
            border: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .task-filename { font-weight: 600; }
        .task-status { font-size: 0.9em; color: #666; }
        .home-button {
            display: inline-block;
            text-decoration: none;
            padding: 8px 16px;
            font-size: 0.9em;
            color: #fff;
            background-color: var(--secondary-btn-bg);
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .home-button:hover { background-color: var(--secondary-btn-hover-bg); }
        @media (max-width: 600px) {
            .nav-buttons { grid-template-columns: 1fr; }
            h1 { font-size: 1.6em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="card" style="text-align: center;">
             <div style="display: flex; justify-content: space-between; align-items: center;">
                <a href="/" class="home-button">返回主系統</a>
                <span style="flex-grow: 1;"></span>
            </div>
            <h1>音訊報告生成器</h1>
            <p>一個強大的工具，能將音訊內容轉換為結構化的文字報告。</p>
        </header>

        <main>
            <div class="nav-buttons">
                <a href="/audio_report/source" class="nav-button primary-action">
                    <span class="step">第一步</span>
                    獲取音訊來源
                </a>
                <a href="/audio_report/process" class="nav-button secondary-action">
                    <span class="step">第二步</span>
                    處理與分析
                </a>
            </div>
            <div class="results-link-container">
                <a href="/audio_report/results" class="results-link">或直接查看已完成的報告 →</a>
            </div>
        </main>

        <div class="card">
            <h2>最近任務摘要</h2>
            <div id="recent-tasks" class="task-list">
                <p id="no-recent-tasks">目前沒有正在處理的任務。</p>
                <!-- 動態載入的任務會顯示在這裡 -->
            </div>
        </div>
    </div>

    <script>
        // 在未來，這裡可以加入 JavaScript 來動態載入「最近任務摘要」
        document.addEventListener('DOMContentLoaded', () => {
            console.log("音訊報告主頁已載入。");
            // 範例：可以從 API /api/tasks/recent 獲取資料並填充到 #recent-tasks
        });
    </script>
</body>
</html>
