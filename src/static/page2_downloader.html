<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>頁面二：批次下載</title>
    <link rel="stylesheet" href="/static/css/nav.css">
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/page2.css">
    <!-- 新增卡片樣式 -->
    <style>
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }
        .item-card {
            /* 使用 .panel 的樣式作為基礎 */
            background: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            transition: box-shadow 0.3s ease;
        }
        .item-card:hover {
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .card-header .checkbox-container {
            display: flex;
            align-items: center;
        }
        .card-header input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        .card-header .item-id {
            font-size: 0.9em;
            color: #6c757d;
        }
        .card-body p {
            margin: 0 0 10px 0;
            color: #495057;
            word-wrap: break-word;
        }
        .card-body p strong {
            color: #343a40;
            margin-right: 8px;
        }
        .card-body .url-link {
            color: #007bff;
            text-decoration: none;
            word-break: break-all;
        }
        .card-body .url-link:hover {
            text-decoration: underline;
        }
        .card-status {
            margin-top: auto;
            padding-top: 10px;
            font-weight: bold;
        }
        .status-processing { background-color: #eaf2f8; }
        .status-error { background-color: #fdedec; }
        .status-completed { background-color: #eafaf1; }
    </style>
</head>
<body>
    <nav class="top-nav">
        <!-- ... (導覽列維持不變) ... -->
        <ul>
            <li><a href="/">鳳凰主頁</a></li>
            <li><a href="/page1">網址提取</a></li>
            <li><a href="/page2" class="active">批次下載</a></li>
            <li><a href="/page3">檔案處理</a></li>
            <li><a href="/page4_stage1_ai">AI 分析</a></li>
            <li><a href="/page11_summary_center">摘要中心</a></li>
            <li><a href="/page5">備份管理</a></li>
            <li><a href="/page6">金鑰管理</a></li>
            <li><a href="/page7">提示詞管理</a></li>
            <li><a href="/page9">績效儀表板</a></li>
        </ul>
    </nav>

    <div class="content">
        <div class="panel">
            <h1>頁面二：批次下載</h1>
            <p>此頁面會列出所有已提取但尚未處理的網址。請勾選您想下載的項目，然後點擊按鈕開始下載。</p>

            <div class="action-bar">
                <div class="action-group">
                    <button id="select-all-button">全選</button>
                    <button id="deselect-all-button">取消全選</button>
                </div>
                <div class="action-group">
                    <button id="download-button" class="primary-action">開始下載選中項目</button>
                </div>
            </div>

            <!-- 容器將使用新的 card-grid 樣式 -->
            <div id="url-list-container" class="card-grid">
                <p>正在載入待處理的網址...</p>
            </div>
        </div>

        <!-- ... (其餘部分維持不變) ... -->
        <div class="panel">
            <div class="panel-header">
                <h2>狀態日誌</h2>
                <button id="copy-log-button" class="copy-button" title="複製日誌">📄</button>
            </div>
            <div id="status-area">
                <!-- 下載狀態將會顯示在這裡 -->
            </div>
        </div>

        <div class="panel">
            <h2>已完成下載</h2>
            <div id="completed-list-container">
                <p>此處會顯示已成功下載的檔案。</p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlListContainer = document.getElementById('url-list-container');
            const selectAllButton = document.getElementById('select-all-button');
            const deselectAllButton = document.getElementById('deselect-all-button');
            const downloadButton = document.getElementById('download-button');
            const statusArea = document.getElementById('status-area');
            const completedListContainer = document.getElementById('completed-list-container');

            const formatTaipeiTime = (isoString) => {
                if (!isoString) return '無效時間';
                try {
                    const date = new Date(isoString);
                    const formatter = new Intl.DateTimeFormat('en-CA', {
                        timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit',
                        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
                    });
                    return formatter.format(date).replace(/-/g, '/').replace(',', '');
                } catch (e) {
                    console.error("時間格式化失敗:", e, "輸入值:", isoString);
                    return '時間格式錯誤';
                }
            };

            const logStatus = (message, color = 'black') => {
                const timestamp = formatTaipeiTime(new Date().toISOString());
                statusArea.insertAdjacentHTML('afterbegin', `<p style="color: ${color};">${timestamp}: ${message}</p>`);
            };

            const fetchAndRenderUrls = async () => {
                try {
                    logStatus('正在從伺服器獲取最新的待處理網址列表...');
                    const response = await fetch('/api/downloader/pending_urls');
                    if (!response.ok) throw new Error(`伺服器錯誤 (狀態 ${response.status})`);
                    const urls = await response.json();

                    urlListContainer.innerHTML = ''; // 清空容器

                    if (urls.length === 0) {
                        urlListContainer.innerHTML = '<p>目前沒有待處理的網址。</p>';
                        downloadButton.disabled = true;
                        selectAllButton.disabled = true;
                        deselectAllButton.disabled = true;
                        logStatus('列表為空。');
                        return;
                    }

                    urls.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'item-card';
                        card.dataset.id = item.id; // 將 id 存在 dataset 中

                        // 注意：item.title 欄位是為後端升級預留的
                        const title = item.title || '無標題';

                        card.innerHTML = `
                            <div class="card-header">
                                <div class="checkbox-container">
                                    <input type="checkbox" class="url-checkbox" value="${item.id}">
                                </div>
                                <span class="item-id">ID: ${item.id}</span>
                            </div>
                            <div class="card-body">
                                <p><strong>標題:</strong> ${title}</p>
                                <p><strong>作者:</strong> ${item.author || '---'}</p>
                                <p><strong>時間:</strong> ${item.message_date || ''} ${item.message_time || ''}</p>
                                <p><strong>連結:</strong> <a href="${item.url}" title="${item.url}" target="_blank" class="url-link">${item.url}</a></p>
                            </div>
                            <div class="card-status"></div>
                        `;
                        urlListContainer.appendChild(card);
                    });

                    downloadButton.disabled = false;
                    selectAllButton.disabled = false;
                    deselectAllButton.disabled = false;
                    logStatus(`成功載入 ${urls.length} 個待處理的網址。`);
                } catch (error) {
                    urlListContainer.innerHTML = `<p style="color: red;">載入失敗：${error.message}</p>`;
                    logStatus(`載入失敗：${error.message}`, 'red');
                }
            };

            selectAllButton.addEventListener('click', () => document.querySelectorAll('.url-checkbox').forEach(cb => cb.checked = true));
            deselectAllButton.addEventListener('click', () => document.querySelectorAll('.url-checkbox').forEach(cb => cb.checked = false));

            downloadButton.addEventListener('click', async () => {
                const selectedIds = Array.from(document.querySelectorAll('.url-checkbox:checked')).map(cb => parseInt(cb.value, 10));
                if (selectedIds.length === 0) {
                    alert('請至少選擇一個要下載的項目。');
                    return;
                }
                logStatus(`正在發送下載請求給 ${selectedIds.length} 個項目...`);
                try {
                    const response = await fetch('/api/downloader/start_downloads', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ ids: selectedIds })
                    });
                    const result = await response.json();
                    if (!response.ok) throw new Error(result.detail || '啟動下載時發生未知錯誤。');
                    logStatus(result.message, 'green');
                    await fetchAndRenderUrls();
                } catch (error) {
                    logStatus(`請求失敗：${error.message}`, 'red');
                }
            });

            const setupWebSocket = () => {
                const ws = new WebSocket(`${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}/api/ws`);
                ws.onopen = () => logStatus('WebSocket 連線成功。等待即時更新...', 'blue');
                ws.onclose = () => {
                    logStatus('WebSocket 連線已中斷。5 秒後嘗試重新連線...', 'orange');
                    setTimeout(setupWebSocket, 5000);
                };
                ws.onerror = (error) => console.error("WebSocket Error:", error);

                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);

                    if (data.type === 'URLS_EXTRACTED') {
                         logStatus('偵測到新的 URL 已被提取，正在更新列表...', 'green');
                         setTimeout(fetchAndRenderUrls, 500);
                         return;
                    }
                    if (data.type !== 'task_update' || data.task_type !== 'download') {
                        return;
                    }

                    const taskId = data.task_id;
                    const status = data.status;
                    const result = data.result;

                    logStatus(`收到下載任務 #${taskId} 的更新: ${status}`, 'purple');

                    const card = document.querySelector(`.item-card[data-id="${taskId}"]`);
                    if (!card) {
                        if (status === 'completed') fetchAndRenderCompletedFiles();
                        return;
                    }

                    card.classList.remove('status-processing', 'status-error', 'status-completed');
                    const statusDiv = card.querySelector('.card-status');

                    switch (status) {
                        case 'downloading':
                            card.classList.add('status-processing');
                            statusDiv.innerHTML = `<span style="color: #2980b9;">📥 下載中...</span>`;
                            break;
                        case 'download_failed':
                        case 'failed':
                            card.classList.add('status-error');
                            const errorMessage = result.status_message || '未知錯誤';
                            statusDiv.innerHTML = `<span style="color: #c0392b;">❌ 失敗: ${errorMessage}</span>`;
                            break;
                        case 'completed':
                            card.classList.add('status-completed');
                            statusDiv.innerHTML = `<span style="color: #27ae60;">✅ 完成</span>`;
                            setTimeout(() => {
                                card.remove();
                                fetchAndRenderCompletedFiles();
                                logStatus(`任務 #${taskId} 已完成並從待辦列表移除。`);
                            }, 1500);
                            break;
                    }
                };
            };

            const fetchAndRenderCompletedFiles = async () => {
                try {
                    const response = await fetch('/api/downloader/completed');
                    if (!response.ok) throw new Error(`伺服器錯誤 (狀態 ${response.status})`);
                    const files = await response.json();

                    if (files.length === 0) {
                        completedListContainer.innerHTML = '<p>目前沒有已下載的檔案。</p>';
                        return;
                    }

                    let html = '<ul>';
                    files.forEach(file => {
                        const completedDate = formatTaipeiTime(file.completed_at);
                        html += `<li>- '${file.filename}' (${completedDate})</li>`;
                    });
                    html += '</ul>';
                    completedListContainer.innerHTML = html;
                } catch (error) {
                    completedListContainer.innerHTML = `<p style="color: red;">載入已完成列表失敗：${error.message}</p>`;
                }
            };

            const copyLogButton = document.getElementById('copy-log-button');
            copyLogButton.addEventListener('click', () => {
                navigator.clipboard.writeText(statusArea.innerText).then(() => {
                    const originalIcon = copyLogButton.innerText;
                    copyLogButton.innerText = '✅';
                    setTimeout(() => { copyLogButton.innerText = originalIcon; }, 2000);
                }).catch(err => console.error('無法複製日誌: ', err));
            });

            (async () => {
                await Promise.all([ fetchAndRenderUrls(), fetchAndRenderCompletedFiles() ]);
                setupWebSocket();
            })();
        });
    </script>

    <!-- V5.5 Readiness Overlay Start -->
    <style>
        #readiness-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5em;
            z-index: 9999;
            flex-direction: column;
            text-align: center;
        }
        #readiness-overlay .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #fff;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <div id="readiness-overlay">
        <div class="spinner"></div>
        <p>系統正在初始化核心服務，請稍候...</p>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const overlay = document.getElementById('readiness-overlay');
            const buttons = document.querySelectorAll('button, a.button, input[type="button"], input[type="submit"]');

            // 輔助函數：啟用UI
            function enableUI() {
                overlay.style.display = 'none';
                buttons.forEach(btn => {
                    btn.disabled = false;
                });
                console.log('系統已就緒，UI 已啟用。');
            }

            // 檢查 sessionStorage 中是否已有就緒標記
            if (sessionStorage.getItem('isSystemReady') === 'true') {
                enableUI();
                const overlayText = overlay.querySelector('p');
                if(overlayText) {
                    overlayText.innerText = '系統已就緒';
                }
                return; // 如果已就緒，則不執行後續的輪詢
            }

            // 1. 預設禁用所有按鈕並顯示遮罩
            buttons.forEach(btn => {
                if (!btn.closest('.navbar')) {
                    btn.disabled = true;
                }
            });
            overlay.style.display = 'flex';

            // 2. 定期輪詢 /api/health/ready 端點
            const readinessInterval = setInterval(() => {
                fetch('/api/health/ready')
                    .then(response => {
                        if (response.ok) {
                            // 3. 一旦請求成功，設定標記、啟用按鈕並隱藏遮罩
                            clearInterval(readinessInterval);
                            sessionStorage.setItem('isSystemReady', 'true'); // 設定標記
                            enableUI();
                        } else {
                            console.log('等待核心服務就緒...');
                        }
                    })
                    .catch(error => {
                        console.error('輪詢就緒狀態時發生錯誤:', error);
                        const overlayText = overlay.querySelector('p');
                        if(overlayText) {
                            overlayText.innerText = '無法連接到後端服務，請檢查連線或稍後重試。';
                        }
                    });
            }, 2000); // 每 2 秒輪詢一次
        });
    </script>
    <!-- V5.5 Readiness Overlay End -->
</body>
</html>
