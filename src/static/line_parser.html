<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINE 文章解析工具</title>
    <style>
        :root {
            --bg-color: #F8F9FA;
            --text-color: #202124;
            --card-bg-color: rgba(255, 255, 255, 0.85);
            --card-border-color: #e0e0e0;
            --button-bg-color: #007bff;
            --button-hover-bg-color: #0056b3;
            --disabled-bg-color: #ccc;
            --success-color: #28a745;
            --error-color: #dc3545;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            font-size: 100%;
            line-height: 1.5;
        }
        .container { max-width: 800px; margin: auto; display: flex; flex-direction: column; gap: 24px; }
        .card {
            border: 1px solid var(--card-border-color);
            border-radius: 12px;
            padding: 24px;
            background-color: var(--card-bg-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h1 { font-size: 1.8em; font-weight: 700; }
        textarea {
            width: 100%;
            min-height: 300px;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 1em;
            line-height: 1.6;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: var(--button-bg-color);
            color: white;
            font-weight: 600;
            font-size: 1.1em;
            transition: all 0.2s;
            width: 100%;
        }
        button:hover:not(:disabled) { background-color: var(--button-hover-bg-color); transform: translateY(-1px); }
        button:disabled { background-color: var(--disabled-bg-color); cursor: not-allowed; }
        #result-area {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            display: none; /* Initially hidden */
            font-weight: 500;
            white-space: pre-wrap;
        }
        #result-area.success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            display: block;
        }
        #result-area.error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="card" style="display: flex; justify-content: space-between; align-items: center;">
            <h1>LINE 文章解析工具</h1>
            <a href="/" style="text-decoration: none; padding: 8px 16px; color: #fff; background-color: #6c757d; border-radius: 5px;">返回主頁</a>
        </header>

        <main class="card">
            <h2>貼上聊天記錄</h2>
            <p>請將從 LINE 複製的完整聊天記錄文字貼到下方的輸入框中。</p>
            <textarea id="chat-input" placeholder="例如：&#10;2025/4/3（週四）&#10;17:11	501-0723486Mason	四月小作文-0050元大台灣50&#10;https://1drv.ms/u/s!Aoa..."></textarea>
            <button id="submit-btn" style="margin-top: 20px;">開始解析</button>
            <div id="result-area"></div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const submitBtn = document.getElementById('submit-btn');
            const chatInput = document.getElementById('chat-input');
            const resultArea = document.getElementById('result-area');

            submitBtn.addEventListener('click', async () => {
                const text = chatInput.value.trim();
                if (!text) {
                    showResult('輸入框內容不可為空。', true);
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = '正在處理中...';
                resultArea.style.display = 'none';

                try {
                    const response = await fetch('/api/parse_line_chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: text })
                    });

                    const result = await response.json();

                    if (!response.ok) {
                        throw new Error(result.detail || '伺服器發生錯誤。');
                    }

                    const message = `處理完成！\n- 共找到 ${result.total_found} 個項目\n- 成功新增 ${result.saved_count} 筆新資料\n- 已存在 ${result.existing_count} 筆重複資料`;
                    showResult(message, false);

                } catch (error) {
                    console.error('解析時發生錯誤:', error);
                    showResult(`錯誤: ${error.message}`, true);
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = '開始解析';
                }
            });

            function showResult(message, isError) {
                resultArea.textContent = message;
                resultArea.className = isError ? 'error' : 'success';
            }
        });
    </script>
</body>
</html>
