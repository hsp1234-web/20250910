<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <!-- 版本同步：2025-09-15，確保前端與後端 API 一致 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 分析 - 階段一</title>
    <link rel="stylesheet" href="/static/css/nav.css">
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/page4.css">
</head>
<body>
    <nav class="top-nav">
        <ul>
            <li><a href="/">鳳凰主頁</a></li>
            <li><a href="/page1">網址提取</a></li>
            <li><a href="/page2">批次下載</a></li>
            <li><a href="/page3">檔案處理</a></li>
            <li><a href="/page4_stage1_ai" class="active">AI 分析</a></li>
            <li><a href="/page11_summary_center">摘要中心</a></li>
            <li><a href="/page5">備份管理</a></li>
            <li><a href="/page6">金鑰管理</a></li>
            <li><a href="/page7">提示詞管理</a></li>
            <li><a href="/page9">績效儀表板</a></li>
        </ul>
    </nav>

    <div class="content">
        <h1>AI 分析流程</h1>

        <div class="sub-nav">
            <a href="/page4_stage1_ai" class="sub-nav-button active">1. AI 分析</a>
            <a href="/page4_stage1_5_date" class="sub-nav-button">1.5. 日期推斷</a>
            <a href="/page4_stage2_performance" class="sub-nav-button">2. 績效分析</a>
            <a href="/page4_stage3_report" class="sub-nav-button">3. 報告生成</a>
            <a href="/page4_stage4_download" class="sub-nav-button">4. Word 報告下載</a>
        </div>

        <div class="panel">
            <h2>階段一：AI 文字擷取</h2>
            <p>請從下方列表中勾選您想分析的檔案，選擇模型後啟動第一階段分析。完成後，項目將會出現在「績效分析」頁面。</p>

            <div class="form-group" style="margin-top: 20px; display: flex; align-items: center; gap: 20px;">
                <div>
                    <label for="stage1-model-select">選擇分析模型:</label>
                    <select id="stage1-model-select" disabled>
                        <option value="">正在檢查 API 金鑰...</option>
                    </select>
                </div>
                <div>
                    <label for="request-delay-seconds">請求間隔(秒):</label>
                    <input type="number" id="request-delay-seconds" value="2" min="0" step="0.1" style="width: 80px;">
                </div>
            </div>

            <div class="action-bar">
                <div class="action-group">
                    <button id="select-all-button">全選可分析項</button>
                    <button id="deselect-all-button">取消全選</button>
                </div>
                <div class="action-group">
                    <button id="start-stage1-btn" class="primary-action">🚀 開始第一階段分析</button>
                </div>
            </div>

            <!-- 卡片容器 -->
            <div id="file-cards-container">
                <p>正在載入已處理的檔案...</p>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <h2>狀態日誌</h2>
                <button id="copy-log-button" class="copy-button" title="複製日誌">複製</button>
            </div>
            <div id="status-area"></div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // --- DOM Element Cache & State ---
        const fileCardsContainer = document.getElementById('file-cards-container');
        const selectAllButton = document.getElementById('select-all-button');
        const deselectAllButton = document.getElementById('deselect-all-button');
        const startStage1Btn = document.getElementById('start-stage1-btn');
        const statusArea = document.getElementById('status-area');
        const copyLogButton = document.getElementById('copy-log-button');
        const modelSelect = document.getElementById('stage1-model-select');
        let availableModels = []; // JULES: Store models for reuse

        // --- Utility Functions ---
        const logStatus = (message, color = 'black') => {
            const timestamp = new Date().toLocaleTimeString('zh-TW', { hour12: false });
            statusArea.insertAdjacentHTML('afterbegin', `<p style="color: ${color};">[${timestamp}] ${message}</p>`);
        };

        const createModelSelectorHtml = (taskId) => {
            if (availableModels.length === 0) return '';
            let optionsHtml = '';
            availableModels.forEach(modelName => {
                optionsHtml += `<option value="${modelName}">${modelName.replace('models/', '')}</option>`;
            });
            return `
                <select class="retry-model-select" data-task-id="${taskId}">
                    ${optionsHtml}
                </select>
            `;
        };

        // --- Core Render Functions ---
        const renderFileList = async () => {
            try {
                logStatus('正在從後端獲取檔案列表...');
                const response = await fetch('/api/analyzer/files_for_stage1');
                if (!response.ok) throw new Error(`無法獲取待分析檔案 (HTTP ${response.status})`);
                const tasks = await response.json();
                logStatus(`成功獲取 ${tasks.length} 個檔案的任務資訊。`, 'green');

                if (tasks.length === 0) {
                    fileCardsContainer.innerHTML = '<p>目前沒有可供分析的檔案。請至「檔案處理」頁面處理新檔案。</p>';
                    return;
                }

                const statusMap = {
                    'pending': '待分析',
                    'processing': '佇列中...',
                    'gemini_processing': 'AI 分析中...',
                    'completed': '✅ 分析完成',
                    'failed': '❌ 分析失敗',
                    'validation_failed': '❌ 代號無效'
                };

                // 獲取所有已完成任務的 symbol
                const symbolPromises = tasks.map(task => {
                    if (task.stage1_status === 'completed' && task.stage1_json_path) {
                        return fetch(`/api/analyzer/stage1_result/${task.id}`)
                            .then(res => res.ok ? res.json() : Promise.resolve({ symbol: '讀取錯誤' }))
                            .then(data => ({ id: task.id, symbol: data.symbol || 'N/A' }))
                            .catch(() => ({ id: task.id, symbol: '請求失敗' }));
                    }
                    return Promise.resolve({ id: task.id, symbol: null });
                });

                const symbols = await Promise.all(symbolPromises);
                const symbolMap = symbols.reduce((acc, s) => {
                    if (s.symbol) acc[s.id] = s.symbol;
                    return acc;
                }, {});


                let cardsHtml = '';
                tasks.forEach(task => {
                    const statusText = statusMap[task.stage1_status] || task.stage1_status;
                    const isPending = task.stage1_status === 'pending';
                    const isCompleted = task.stage1_status === 'completed';
                    const isFailed = task.stage1_status === 'failed' || task.stage1_status === 'validation_failed';
                    const fileId = task.source_document_id;
                    const taskId = task.id;
                    const symbol = symbolMap[taskId] || 'N/A';

                    // JULES: Build retry UI if the task has failed
                    const retryUI = isFailed ? `
                        <div class="retry-controls">
                            ${createModelSelectorHtml(taskId)}
                            <button class="action-btn btn-retry" data-task-id="${taskId}">重試分析</button>
                        </div>
                    ` : '';

                    cardsHtml += `
                        <div class="file-card status-${task.stage1_status}" data-task-id="${taskId}" data-file-id="${fileId}">
                            <div class="card-header">
                                <input type="checkbox" class="file-checkbox" value="${fileId}" ${!isPending ? 'disabled' : ''}>
                                <h3 class="filename" title="${task.filename}">${task.filename}</h3>
                            </div>
                            <div class="card-body">
                                <div class="info-grid">
                                    <div class="info-item"><strong>狀態:</strong> <span class="status-badge">${statusText}</span></div>
                                    <div class="info-item"><strong>分析標的:</strong> <span class="symbol-badge">${isCompleted ? symbol : 'N/A'}</span></div>
                                    <div class="info-item"><strong>模型:</strong> <span class="model-name">${task.stage1_model || 'N/A'}</span></div>
                                    <div class="info-item"><strong>Token 耗用:</strong> <span class="token-usage">${task.stage1_token_usage || 'N/A'}</span></div>
                                </div>
                            </div>
                            <div class="card-footer">
                                <button class="action-btn btn-json" data-task-id="${taskId}" ${!isCompleted ? 'disabled' : ''}>查看 JSON</button>
                                <a href="/page8?hash=${task.file_hash}" class="action-btn btn-details" ${!task.file_hash ? 'style="display:none;"' : ''}>詳細資料</a>
                                ${retryUI}
                            </div>
                            <div class="json-viewer-container" style="display: none;"></div>
                            ${isFailed ? `<div class="error-log-container"><strong class="error-title">錯誤日誌:</strong><pre class="error-log">${task.stage1_error_log || '無詳細錯誤資訊。'}</pre></div>` : ''}
                        </div>
                    `;
                });
                fileCardsContainer.innerHTML = cardsHtml;
            } catch (error) {
                logStatus(`載入檔案列表失敗: ${error.message}`, 'red');
                fileCardsContainer.innerHTML = `<p style="color:red;">載入檔案列表失敗: ${error.message}</p>`;
            }
        };

        // --- API Call Functions ---
        const populateModelSelector = (models) => {
            modelSelect.innerHTML = '';
            const priorityOrder = ["models/gemini-2.0-flash-lite", "models/gemini-2.0-flash", "models/gemini-2.5-flash-lite", "models/gemini-2.5-flash"];
            const sortedModels = [...models].sort((a, b) => {
                let aPriority = priorityOrder.indexOf(a);
                let bPriority = priorityOrder.indexOf(b);
                if (aPriority === -1) aPriority = priorityOrder.length;
                if (bPriority === -1) bPriority = priorityOrder.length;
                if (aPriority !== bPriority) return aPriority - bPriority;
                return a.localeCompare(b);
            });

            availableModels = sortedModels; // JULES: Save models

            sortedModels.forEach((modelName, index) => {
                const option = document.createElement('option');
                option.value = modelName;
                option.textContent = modelName.replace('models/', '');
                if (index === 0) option.selected = true;
                modelSelect.appendChild(option);
            });
        };

        const checkKeysAndLoadModels = async () => {
            try {
                const response = await fetch('/api/keys');
                const keys = await response.json();
                const validKeys = keys.filter(k => k.is_valid);
                if (validKeys.length > 0) {
                    const modelResponse = await fetch('/api/keys/models');
                    const models = await modelResponse.json();
                    populateModelSelector(models);
                    modelSelect.disabled = false;
                } else {
                    modelSelect.innerHTML = '<option value="">請先在「金鑰管理」頁面新增有效的 API 金鑰</option>';
                    modelSelect.disabled = true;
                    logStatus('偵測到無有效 API 金鑰，模型選單已禁用。', 'orange');
                }
            } catch (error) {
                logStatus(`檢查 API 金鑰或載入模型時發生錯誤: ${error.message}`, 'red');
                modelSelect.disabled = true;
            }
        };

        const startAnalysisForFiles = async (fileIds) => {
            if (fileIds.length === 0) return alert('請至少選擇一個檔案。');
            if (modelSelect.disabled) return alert('請先新增有效的 API 金鑰才能開始分析。');
            const modelName = modelSelect.value;
            if (!modelName) return alert('請選擇分析模型。');
            const delaySeconds = parseFloat(document.getElementById('request-delay-seconds').value) || 0;

            logStatus(`啟動第一階段分析，共 ${fileIds.length} 個檔案，請求間隔 ${delaySeconds} 秒...`, 'blue');
            try {
                const response = await fetch('/api/analyzer/start_stage1_analysis', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ file_ids: fileIds, model_name: modelName, delay_seconds: delaySeconds })
                });
                const result = await response.json();
                if (response.ok) {
                    logStatus(`分析請求已成功發送: ${result.message}`, 'green');
                    logStatus('稍後將自動更新列表...', 'purple');
                    setTimeout(renderFileList, 1000);
                } else {
                    throw new Error(result.detail || '未知錯誤');
                }
            } catch (error) {
                logStatus(`啟動分析失敗: ${error.message}`, 'red');
            }
        };

        // JULES: New function for retrying a single task
        const retryAnalysisForTask = async (taskId, modelName, button) => {
            button.disabled = true;
            button.textContent = '請求中...';
            logStatus(`為任務 #${taskId} 啟動重試，模型: ${modelName}`, 'blue');
            try {
                const response = await fetch('/api/analyzer/retry_stage1_analysis', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ task_id: taskId, model_name: modelName })
                });
                const result = await response.json();
                if (response.ok) {
                    logStatus(`任務 #${taskId} 重試請求已成功發送: ${result.message}`, 'green');
                    logStatus('稍後將自動更新列表...', 'purple');
                    setTimeout(renderFileList, 1000);
                } else {
                    throw new Error(result.detail || '未知錯誤');
                }
            } catch (error) {
                logStatus(`任務 #${taskId} 重試失敗: ${error.message}`, 'red');
                button.disabled = false;
                button.textContent = '重試分析';
            }
        };

        // --- Event Listeners ---
        startStage1Btn.addEventListener('click', () => {
            const selectedIds = Array.from(document.querySelectorAll('.file-checkbox:checked')).map(cb => parseInt(cb.value, 10));
            startAnalysisForFiles(selectedIds);
        });

        fileCardsContainer.addEventListener('click', async (e) => {
            if (e.target.classList.contains('btn-json')) {
                const button = e.target;
                const card = button.closest('.file-card');
                const viewer = card.querySelector('.json-viewer-container');
                const taskId = button.dataset.taskId;

                if (viewer.style.display === 'none') {
                    button.disabled = true;
                    button.textContent = '載入中...';
                    try {
                        const response = await fetch(`/api/analyzer/stage1_result/${taskId}`);
                        if (!response.ok) throw new Error(`無法獲取 JSON (HTTP ${response.status})`);
                        const data = await response.json();
                        viewer.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                        viewer.style.display = 'block';
                        button.textContent = '隱藏 JSON';
                    } catch (error) {
                        viewer.innerHTML = `<p style="color:red;">${error.message}</p>`;
                        button.textContent = '查看 JSON';
                    } finally {
                        button.disabled = false;
                    }
                } else {
                    viewer.style.display = 'none';
                    viewer.innerHTML = '';
                    button.textContent = '查看 JSON';
                }
            }

            // JULES: Updated retry logic
            if (e.target.classList.contains('btn-retry')) {
                const button = e.target;
                const taskId = parseInt(button.dataset.taskId, 10);
                const card = button.closest('.file-card');
                const retrySelect = card.querySelector('.retry-model-select');
                if (!retrySelect) {
                    logStatus(`找不到任務 #${taskId} 的重試模型選單。`, 'red');
                    return;
                }
                const modelName = retrySelect.value;
                retryAnalysisForTask(taskId, modelName, button);
            }
        });

        selectAllButton.addEventListener('click', () => document.querySelectorAll('.file-checkbox:not(:disabled)').forEach(cb => cb.checked = true));
        deselectAllButton.addEventListener('click', () => document.querySelectorAll('.file-checkbox:checked').forEach(cb => cb.checked = false));

        copyLogButton.addEventListener('click', () => {
            navigator.clipboard.writeText(statusArea.innerText).then(() => {
                const originalText = copyLogButton.innerText;
                copyLogButton.innerText = '已複製 ✅';
                setTimeout(() => { copyLogButton.innerText = originalText; }, 2000);
            });
        });

        const setupWebSocket = () => {
            const ws = new WebSocket(`${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}/api/ws`);
            ws.onopen = () => logStatus('WebSocket 狀態更新連線成功。', 'blue');
            ws.onclose = () => {
                logStatus('WebSocket 連線已中斷。5 秒後嘗試重新連線...', 'orange');
                setTimeout(setupWebSocket, 5000);
            };
            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.task_type === 'analysis_stage_1') {
                         logStatus(`收到第一階段任務 #${data.task_id} 狀態更新: ${data.status}。正在刷新列表...`, 'purple');
                         renderFileList();
                    }
                } catch (err) {
                    logStatus(`處理 WebSocket 訊息時發生錯誤: ${err}`, 'red');
                }
            };
        };

        (async () => {
            logStatus('頁面載入完成，正在初始化...');
            await checkKeysAndLoadModels();
            await renderFileList();
            setupWebSocket();
            logStatus('初始化完成，等待操作。', 'green');
        })();
    });
    </script>

    <!-- V5.5 Readiness Overlay Start -->
    <style>
        #readiness-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5em;
            z-index: 9999;
            flex-direction: column;
            text-align: center;
        }
        #readiness-overlay .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #fff;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <div id="readiness-overlay">
        <div class="spinner"></div>
        <p>系統正在初始化核心服務，請稍候...</p>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const overlay = document.getElementById('readiness-overlay');
            const buttons = document.querySelectorAll('button, a.button, input[type="button"], input[type="submit"]');

            // 輔助函數：啟用UI
            function enableUI() {
                overlay.style.display = 'none';
                buttons.forEach(btn => {
                    btn.disabled = false;
                });
                console.log('系統已就緒，UI 已啟用。');
            }

            // 檢查 sessionStorage 中是否已有就緒標記
            if (sessionStorage.getItem('isSystemReady') === 'true') {
                enableUI();
                const overlayText = overlay.querySelector('p');
                if(overlayText) {
                    overlayText.innerText = '系統已就緒';
                }
                return; // 如果已就緒，則不執行後續的輪詢
            }

            // 1. 預設禁用所有按鈕並顯示遮罩
            buttons.forEach(btn => {
                if (!btn.closest('.navbar')) {
                    btn.disabled = true;
                }
            });
            overlay.style.display = 'flex';

            // 2. 定期輪詢 /api/health/ready 端點
            const readinessInterval = setInterval(() => {
                fetch('/api/health/ready')
                    .then(response => {
                        if (response.ok) {
                            // 3. 一旦請求成功，設定標記、啟用按鈕並隱藏遮罩
                            clearInterval(readinessInterval);
                            sessionStorage.setItem('isSystemReady', 'true'); // 設定標記
                            enableUI();
                        } else {
                            console.log('等待核心服務就緒...');
                        }
                    })
                    .catch(error => {
                        console.error('輪詢就緒狀態時發生錯誤:', error);
                        const overlayText = overlay.querySelector('p');
                        if(overlayText) {
                            overlayText.innerText = '無法連接到後端服務，請檢查連線或稍後重試。';
                        }
                    });
            }, 2000); // 每 2 秒輪詢一次
        });
    </script>
    <!-- V5.5 Readiness Overlay End -->
</body>
</html>
