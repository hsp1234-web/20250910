<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音訊報告生成器 - 結果瀏覽</title>
    <!-- 引入 marked.js 以便將 Markdown 轉譯為 HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #F8F9FA;
            --text-color: #202124;
            --card-bg-color: rgba(255, 255, 255, 0.9);
            --card-border-color: #e0e0e0;
            --button-bg-color: #007bff;
            --button-hover-bg-color: #0056b3;
            --secondary-btn-bg: #6c757d;
            --secondary-btn-hover-bg: #5a6268;
            --danger-btn-bg: #dc3545;
            --danger-btn-hover-bg: #c82333;
            --success-color: #28a745;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            font-size: 100%;
            line-height: 1.6;
        }
        .container { max-width: 1200px; margin: auto; display: flex; flex-direction: column; gap: 24px; }
        .card {
            border: 1px solid var(--card-border-color);
            border-radius: 12px;
            padding: 24px;
            background-color: var(--card-bg-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h1 { font-size: 2em; font-weight: 700; }
        .home-button {
            display: inline-block;
            text-decoration: none;
            padding: 8px 16px;
            font-size: 0.9em;
            color: #fff;
            background-color: var(--secondary-btn-bg);
            border-radius: 5px;
            transition: background-color: 0.3s;
        }
        .home-button:hover { background-color: var(--secondary-btn-hover-bg); }

        /* --- 報告卡片網格佈局 --- */
        .report-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            min-height: 200px;
        }

        /* --- 報告卡片樣式 --- */
        .report-card {
            border: 1px solid var(--card-border-color);
            border-radius: 10px;
            background-color: #fff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: box-shadow 0.3s ease, transform 0.3s ease;
        }
        .report-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.08);
        }
        .report-card-header {
            font-weight: 600;
            font-size: 1.1em;
            margin-bottom: 12px;
            word-break: break-all; /* 避免長檔名破壞佈局 */
        }
        .report-card-body {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 16px;
        }

        /* --- 折疊內容的樣式 --- */
        .details-toggle-btn {
            background: none;
            border: none;
            color: var(--button-bg-color);
            cursor: pointer;
            padding: 4px 0;
            margin-bottom: 12px;
            font-size: 0.9em;
        }
        .details-toggle-btn:hover { text-decoration: underline; }
        .report-card-details {
            display: none; /* 預設隱藏 */
            padding-left: 10px;
            border-left: 2px solid #eee;
            margin-top: 8px;
        }
        .report-card-details p { margin: 6px 0; }

        .report-card-footer {
            display: flex;
            flex-wrap: wrap; /* 允許換行 */
            gap: 10px;
            justify-content: flex-start; /* 從左邊開始排 */
            align-items: center;
            margin-top: auto;
        }
        .report-card-footer .action-btn {
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            color: white;
            font-size: 0.9em;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
        }
        .report-card-footer select {
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--card-border-color);
            flex-grow: 1; /* 佔滿剩餘空間 */
        }
        .btn-preview { background-color: var(--button-bg-color); }
        .btn-preview:hover { background-color: var(--button-hover-bg-color); }
        .btn-download { background-color: var(--success-color); }
        .btn-download:hover { background-color: #218838; }

        /* --- Modal 彈窗樣式 (從 mp3.html 借鑒) --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: none; /* 預設隱藏 */
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-content {
            background-color: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 800px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 12px;
        }
        .modal-header h2 { margin: 0; }
        .modal-close-button {
            background: none;
            border: none;
            font-size: 2em;
            cursor: pointer;
            color: #888;
            line-height: 1;
            padding: 0;
        }
        .modal-close-button:hover { color: #333; }
        .modal-body {
            overflow-y: auto;
            flex-grow: 1;
            /* 改善 Markdown 預覽的樣式 */
            line-height: 1.7;
        }
        .modal-body h1, .modal-body h2, .modal-body h3 { border-bottom: 1px solid #eee; padding-bottom: 0.3em; margin-top: 24px; }
        .modal-body pre { background-color: #f6f8fa; padding: 16px; border-radius: 6px; }
        .modal-body code { font-family: monospace; }
        .modal-body hr { border: none; border-top: 1px solid #eee; margin: 1em 0; }

        @media (max-width: 600px) {
            body { font-size: 90%; padding: 10px; } /* 調整基礎字體大小 */
            .container { gap: 16px; }
            .card { padding: 16px; }
            h1 { font-size: 1.6em; }
            .button-like {
                font-size: 1em;
                padding: 10px 18px;
            }
            .report-grid { grid-template-columns: 1fr; gap: 16px; }
            .report-card { padding: 16px; }
            .report-card-header { font-size: 1.0em; }
            .report-card-footer { flex-direction: column; align-items: stretch; } /* 手機上讓按鈕垂直排列 */
            .report-card-footer .action-btn, .report-card-footer select { width: 100%; box-sizing: border-box; text-align: center;}
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="card" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
            <div>
                <h1>結果瀏覽</h1>
                <p>查看、預覽、下載或刪除已生成的音訊報告。</p>
            </div>
            <a href="/audio_report/main" class="home-button">返回功能主頁</a>
        </header>

        <main class="card">
            <div id="report-grid" class="report-grid">
                <p id="no-reports-message">正在從伺服器載入報告列表...</p>
                <!-- 動態載入的報告卡片會顯示在這裡 -->
            </div>
        </main>
    </div>

    <!-- 預覽彈窗 (Modal) -->
    <div id="preview-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">報告預覽</h2>
                <button id="modal-close-btn" class="modal-close-button">&times;</button>
            </div>
            <div id="modal-body" class="modal-body">
                <!-- Markdown 轉譯後的 HTML 會被插入到這裡 -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const reportGrid = document.getElementById('report-grid');
            const noReportsMessage = document.getElementById('no-reports-message');
            const previewModal = document.getElementById('preview-modal');
            const modalTitle = document.getElementById('modal-title');
            const modalBody = document.getElementById('modal-body');
            const modalCloseBtn = document.getElementById('modal-close-btn');

            /**
             * 從後端 API 獲取詳細的報告列表並更新 UI。
             */
            async function loadReports() {
                try {
                    const response = await fetch('/api/audio_report/reports');
                    if (!response.ok) {
                        throw new Error(`伺服器錯誤: ${response.status}`);
                    }
                    const data = await response.json();
                    const reports = data.reports;

                    if (!reports || reports.length === 0) {
                        noReportsMessage.textContent = '目前尚無已完成的報告。';
                        reportGrid.innerHTML = ''; // 確保清空
                        return;
                    }

                    noReportsMessage.style.display = 'none';
                    reportGrid.innerHTML = '';

                    reports.forEach(report => {
                        const card = createDetailedReportCard(report);
                        reportGrid.appendChild(card);
                    });

                } catch (error) {
                    console.error('載入報告列表失敗:', error);
                    noReportsMessage.textContent = `❌ 載入報告失敗: ${error.message}`;
                    noReportsMessage.style.color = 'red';
                    noReportsMessage.style.display = 'block';
                }
            }

            /**
             * 根據詳細的報告資料建立一個 HTML 卡片元素。
             * @param {object} report - 詳細報告物件。
             * @returns {HTMLElement} 建立的卡片 div 元素。
             */
            function createDetailedReportCard(report) {
                const card = document.createElement('div');
                card.className = 'report-card';

                const creationDate = new Date(report.creationDate).toLocaleString('zh-TW', { hour12: false });

                // 動態生成檔案選項 HTML
                let fileOptionsHtml = '';
                if (report.outputFiles && report.outputFiles.length > 0) {
                    report.outputFiles.forEach(file => {
                        const webPath = `/${file.path}`;
                        fileOptionsHtml += `<option value="${webPath}" data-name="${file.name}">${file.type}</option>`;
                    });
                }

                card.innerHTML = `
                    <div class="report-card-header" title="${report.reportTitle}">${report.reportTitle}</div>
                    <div class="report-card-body">
                        <button class="details-toggle-btn">顯示詳細資訊</button>
                        <div class="report-card-details">
                            <p title="${report.sourceFilename}"><strong>來源:</strong> ${report.sourceFilename}</p>
                            <p><strong>模型:</strong> ${report.modelUsed}</p>
                            <p><strong>處理時間:</strong> ${report.processingTime} 秒</p>
                            <p><strong>消耗 Tokens:</strong> ${report.totalTokens}</p>
                            <p><strong>建立時間:</strong> ${creationDate}</p>
                        </div>
                    </div>
                    <div class="report-card-footer">
                        <select class="file-selector" ${!fileOptionsHtml ? 'disabled' : ''}>
                            ${fileOptionsHtml || '<option>無可用檔案</option>'}
                        </select>
                        <button class="action-btn btn-preview" ${!fileOptionsHtml ? 'disabled' : ''}>▶️ 預覽</button>
                        <a href="#" class="action-btn btn-download" download ${!fileOptionsHtml ? 'disabled' : ''} style="background-color: var(--warning-color); color: var(--text-color);">📥 下載</a>
                    </div>
                `;

                const detailsContainer = card.querySelector('.report-card-details');
                const toggleBtn = card.querySelector('.details-toggle-btn');
                const fileSelector = card.querySelector('.file-selector');
                const previewBtn = card.querySelector('.btn-preview');
                const downloadLink = card.querySelector('.btn-download');

                // 折疊/展開功能
                toggleBtn.addEventListener('click', () => {
                    const isHidden = detailsContainer.style.display === 'none' || detailsContainer.style.display === '';
                    detailsContainer.style.display = isHidden ? 'block' : 'none';
                    toggleBtn.textContent = isHidden ? '隱藏詳細資訊' : '顯示詳細資訊';
                });

                // 更新下載連結的函式
                const updateDownloadLink = () => {
                    if (fileSelector.value) {
                        const selectedOption = fileSelector.options[fileSelector.selectedIndex];
                        downloadLink.href = fileSelector.value;
                        downloadLink.download = selectedOption.dataset.name;
                        previewBtn.disabled = false;
                        downloadLink.removeAttribute('disabled');
                        downloadLink.style.pointerEvents = 'auto';
                        downloadLink.style.opacity = '1';

                    } else {
                        previewBtn.disabled = true;
                        downloadLink.setAttribute('disabled', 'true');
                        downloadLink.style.pointerEvents = 'none';
                        downloadLink.style.opacity = '0.6';
                    }
                };

                // 預覽按鈕事件
                previewBtn.addEventListener('click', () => {
                    if (fileSelector.value) {
                        const selectedOption = fileSelector.options[fileSelector.selectedIndex];
                        openPreviewModal(fileSelector.value, selectedOption.dataset.name);
                    }
                });

                // 下拉選單變更事件
                fileSelector.addEventListener('change', updateDownloadLink);

                // 初始化
                updateDownloadLink();

                return card;
            }


            /**
             * 開啟預覽彈窗並顯示 Markdown 檔案內容。
             * @param {string} path - 報告檔案的 Web 可存取路徑。
             * @param {string} name - 報告檔案的名稱。
             */
            async function openPreviewModal(path, name) {
                modalTitle.textContent = `預覽: ${name}`;
                modalBody.innerHTML = '<p>正在載入內容...</p>';
                previewModal.style.display = 'flex';

                try {
                    // 直接使用 web path 進行 fetch
                    const response = await fetch(path);
                    if (!response.ok) {
                        throw new Error(`無法擷取檔案: ${response.statusText}`);
                    }
                    const markdownText = await response.text();

                    // 使用 marked.js 將 Markdown 轉為 HTML
                    modalBody.innerHTML = marked.parse(markdownText);

                } catch (error) {
                    console.error('預覽檔案失敗:', error);
                    modalBody.innerHTML = `<p style="color: red;">❌ 載入預覽失敗: ${error.message}</p>`;
                }
            }

            /**
             * 關閉預覽彈窗。
             */
            function closePreviewModal() {
                previewModal.style.display = 'none';
                modalBody.innerHTML = ''; // 清空內容
            }

            // --- 事件監聽器 ---
            modalCloseBtn.addEventListener('click', closePreviewModal);
            previewModal.addEventListener('click', (e) => {
                if (e.target === previewModal) {
                    closePreviewModal();
                }
            });

            // --- 初始化 ---
            loadReports();
        });
    </script>
</body>
</html>
