<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>匯出選項</title>
    <link rel="stylesheet" href="/static/css/page1_unified.css">
</head>
<body>
    <div class="content">
        <div class="panel">
            <a href="/page1/overview" class="button-link" style="margin-bottom: 20px; display: inline-block;">&larr; 返回資料總覽</a>
            <h2>匯出選項</h2>
            <div class="filter-summary">
                <p><strong>再次確認篩選範圍</strong></p>
                <p>開始日期: <span id="start-date-summary">未設定</span></p>
                <p>結束日期: <span id="end-date-summary">未設定</span></p>
                <p>(共篩選出 <span id="record-count">N/A</span> 筆資料)</p>
            </div>
        </div>

        <div class="panel">
            <h2>請選擇您想要的匯出格式:</h2>
            <div class="export-grid">
                <button class="export-button" data-format="pdf">匯出 PDF</button>
                <button class="export-button" data-format="html">匯出 HTML</button>
                <button class="export-button" data-format="docx">匯出 DOCX</button>
                <button class="export-button" data-format="excel">匯出 EXCEL</button>
                <button class="export-button" data-format="csv">匯出 CSV</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const exportButtons = document.querySelectorAll('.export-button');
            const startDateSummary = document.getElementById('start-date-summary');
            const endDateSummary = document.getElementById('end-date-summary');
            const recordCount = document.getElementById('record-count');

            const urlParams = new URLSearchParams(window.location.search);
            const startDate = urlParams.get('start_date') || '未設定';
            const endDate = urlParams.get('end_date') || '未設定';

            startDateSummary.textContent = startDate;
            endDateSummary.textContent = endDate;

            const fetchRecordCount = async () => {
                let url = `/api/page1/overview_data?count_only=true`;
                const params = new URLSearchParams();
                if (startDate !== '未設定') params.append('start_date', startDate);
                if (endDate !== '未設定') params.append('end_date', endDate);
                if (params.toString()) {
                    url += `&${params.toString()}`;
                }

                try {
                    const response = await fetch(url);
                    const data = await response.json();
                    recordCount.textContent = data.count;
                } catch (error) {
                    recordCount.textContent = '無法取得';
                }
            };
            fetchRecordCount();

            exportButtons.forEach(button => {
                button.addEventListener('click', () => {
                    const format = button.dataset.format;
                    let exportUrl = `/api/page1/export?format=${format}`;
                    if (startDate !== '未設定') exportUrl += `&start_date=${startDate}`;
                    if (endDate !== '未設定') exportUrl += `&end_date=${endDate}`;

                    window.open(exportUrl, '_blank');
                });
            });
        });
    </script>

    <!-- V5.5 Readiness Overlay Start -->
    <style>
        #readiness-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5em;
            z-index: 9999;
            flex-direction: column;
            text-align: center;
        }
        #readiness-overlay .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #fff;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <div id="readiness-overlay">
        <div class="spinner"></div>
        <p>系統正在初始化核心服務，請稍候...</p>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const overlay = document.getElementById('readiness-overlay');
            const buttons = document.querySelectorAll('button, a.button, input[type="button"], input[type="submit"]');

            // 1. 預設禁用所有按鈕並顯示遮罩
            buttons.forEach(btn => {
                if (!btn.closest('.navbar')) {
                    btn.disabled = true;
                }
            });
            overlay.style.display = 'flex';

            // 2. 定期輪詢 /api/health/ready 端點
            const readinessInterval = setInterval(() => {
                fetch('/api/health/ready')
                    .then(response => {
                        if (response.ok) {
                            // 3. 一旦請求成功，啟用按鈕並隱藏遮罩
                            clearInterval(readinessInterval);
                            overlay.style.display = 'none';
                            buttons.forEach(btn => {
                                btn.disabled = false;
                            });
                            console.log('系統已就緒，UI 已啟用。');
                        } else {
                            console.log('等待核心服務就緒...');
                        }
                    })
                    .catch(error => {
                        console.error('輪詢就緒狀態時發生錯誤:', error);
                        const overlayText = overlay.querySelector('p');
                        if(overlayText) {
                            overlayText.innerText = '無法連接到後端服務，請檢查連線或稍後重試。';
                        }
                    });
            }, 2000); // 每 2 秒輪詢一次
        });
    </script>
    <!-- V5.5 Readiness Overlay End -->
</body>
</html>
