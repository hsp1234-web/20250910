<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 分析 - 階段 1.5</title>
    <link rel="stylesheet" href="/static/css/nav.css">
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/page4.css">
</head>
<body>
    <nav class="top-nav">
        <ul>
            <li><a href="/">鳳凰主頁</a></li>
            <li><a href="/page1">網址提取</a></li>
            <li><a href="/page2">批次下載</a></li>
            <li><a href="/page3">檔案處理</a></li>
            <li><a href="/page4_stage1_ai" class="active">AI 分析</a></li>
            <li><a href="/page5">備份管理</a></li>
            <li><a href="/page6">金鑰管理</a></li>
            <li><a href="/page7">提示詞管理</a></li>
            <li><a href="/page9">績效儀表板</a></li>
        </ul>
    </nav>

    <div class="content">
        <h1>AI 分析流程</h1>

        <div class="sub-nav">
            <a href="/page4_stage1_ai" class="sub-nav-button">1. AI 分析</a>
            <a href="/page4_stage1_5_date" class="sub-nav-button active">1.5. 日期推斷</a>
            <a href="/page4_stage2_performance" class="sub-nav-button">2. 績效分析</a>
            <a href="/page4_stage3_report" class="sub-nav-button">3. 報告生成</a>
        </div>

        <div class="panel">
            <h2>階段 1.5：AI 日期推斷</h2>
            <p>此處顯示已完成第一階段分析，但尚未進行 AI 日期推斷的任務。勾選後即可開始推斷。完成後，項目將會出現在「績效分析」頁面。</p>

            <div class="form-group" style="margin-top: 20px;">
                <label for="model-select">選擇分析模型 (建議使用與第一階段相同的模型):</label>
                <select id="model-select" disabled>
                    <option value="">正在檢查 API 金鑰...</option>
                </select>
            </div>

            <div style="margin-bottom: 10px; margin-top: 20px;">
                <button id="select-all-button">全選</button>
                <button id="deselect-all-button">取消全選</button>
            </div>

            <div id="task-cards-container">
                <p>正在載入待處理任務...</p>
            </div>

            <div style="margin-top: 20px;">
                <button id="start-inference-btn">⏰ 開始日期推斷</button>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <h2>狀態日誌</h2>
                <button id="copy-log-button" class="copy-button" title="複製日誌">複製</button>
            </div>
            <div id="status-area"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const taskCardsContainer = document.getElementById('task-cards-container');
            const selectAllButton = document.getElementById('select-all-button');
            const deselectAllButton = document.getElementById('deselect-all-button');
            const startInferenceBtn = document.getElementById('start-inference-btn');
            const statusArea = document.getElementById('status-area');
            const copyLogButton = document.getElementById('copy-log-button');
            const modelSelect = document.getElementById('model-select');

            const logStatus = (message, color = 'black') => {
                const timestamp = new Date().toLocaleTimeString('zh-TW', { hour12: false });
                statusArea.insertAdjacentHTML('afterbegin', `<p style="color: ${color};">[${timestamp}] ${message}</p>`);
            };

            const renderTaskList = async () => {
                try {
                    logStatus('正在從後端獲取待處理任務...');
                    const response = await fetch('/api/analyzer/files_for_date_inference');
                    if (!response.ok) throw new Error(`無法獲取待處理任務 (HTTP ${response.status})`);
                    const tasks = await response.json();
                    logStatus(`成功獲取 ${tasks.length} 個任務。`, 'green');

                    if (tasks.length === 0) {
                        taskCardsContainer.innerHTML = '<p>目前沒有可進行日期推斷的任務。請先完成第一階段 AI 分析。</p>';
                        return;
                    }

                    let cardsHtml = '';
                    tasks.forEach(task => {
                        cardsHtml += `
                            <div class="file-card status-completed" data-task-id="${task.id}">
                                <div class="card-header">
                                    <input type="checkbox" class="task-checkbox" value="${task.id}">
                                    <h3 class="filename" title="${task.filename}">${task.filename}</h3>
                                </div>
                                <div class="card-body">
                                    <div class="info-grid">
                                        <div class="info-item"><strong>第一階段狀態:</strong> <span class="status-badge">✅ 完成</span></div>
                                        <div class="info-item"><strong>模型:</strong> <span class="model-name">${task.stage1_model || 'N/A'}</span></div>
                                    </div>
                                </div>
                                <div class="card-footer">
                                   <a href="/page8?hash=${task.file_hash}" class="action-btn btn-details" ${!task.file_hash ? 'style="display:none;"' : ''}>詳細資料</a>
                                </div>
                            </div>
                        `;
                    });
                    taskCardsContainer.innerHTML = cardsHtml;
                } catch (error) {
                    logStatus(`載入任務列表失敗: ${error.message}`, 'red');
                    taskCardsContainer.innerHTML = `<p style="color:red;">載入任務列表失敗: ${error.message}</p>`;
                }
            };

            const populateModelSelector = (models) => {
                modelSelect.innerHTML = '';
                const priorityOrder = ["models/gemini-2.0-flash-lite", "models/gemini-2.0-flash", "models/gemini-2.5-flash-lite", "models/gemini-2.5-flash"];
                const sortedModels = [...models].sort((a, b) => {
                    let aPriority = priorityOrder.indexOf(a);
                    let bPriority = priorityOrder.indexOf(b);
                    if (aPriority === -1) aPriority = priorityOrder.length;
                    if (bPriority === -1) bPriority = priorityOrder.length;
                    if (aPriority !== bPriority) return aPriority - bPriority;
                    return a.localeCompare(b);
                });
                sortedModels.forEach((modelName, index) => {
                    const option = document.createElement('option');
                    option.value = modelName;
                    option.textContent = modelName.replace('models/', '');
                    if (index === 0) option.selected = true;
                    modelSelect.appendChild(option);
                });
            };

            const checkKeysAndLoadModels = async () => {
                try {
                    const response = await fetch('/api/keys');
                    const keys = await response.json();
                    const validKeys = keys.filter(k => k.is_valid);
                    if (validKeys.length > 0) {
                        const modelResponse = await fetch('/api/keys/models');
                        const models = await modelResponse.json();
                        populateModelSelector(models);
                        modelSelect.disabled = false;
                    } else {
                        modelSelect.innerHTML = '<option value="">請先在「金鑰管理」頁面新增有效的 API 金鑰</option>';
                        modelSelect.disabled = true;
                        logStatus('偵測到無有效 API 金鑰，模型選單已禁用。', 'orange');
                    }
                } catch (error) {
                    logStatus(`檢查 API 金鑰或載入模型時發生錯誤: ${error.message}`, 'red');
                    modelSelect.disabled = true;
                }
            };

            startInferenceBtn.addEventListener('click', async () => {
                const selectedIds = Array.from(document.querySelectorAll('.task-checkbox:checked')).map(cb => parseInt(cb.value, 10));
                if (selectedIds.length === 0) return alert('請至少選擇一個任務。');
                if (modelSelect.disabled) return alert('請先新增有效的 API 金鑰才能開始分析。');
                const modelName = modelSelect.value;
                if (!modelName) return alert('請選擇分析模型。');

                logStatus(`啟動日期推斷，共 ${selectedIds.length} 個任務...`, 'blue');
                try {
                    const response = await fetch('/api/analyzer/start_date_inference', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ task_ids: selectedIds, model_name: modelName })
                    });
                    const result = await response.json();
                    if (response.ok) {
                        logStatus(`推斷請求已成功發送: ${result.message}`, 'green');
                        logStatus('請稍後至「績效分析」頁面查看結果。正在重新整理列表...', 'purple');
                        setTimeout(renderTaskList, 1000);
                    } else {
                        throw new Error(result.detail || '未知錯誤');
                    }
                } catch (error) {
                    logStatus(`啟動推斷失敗: ${error.message}`, 'red');
                }
            });

            selectAllButton.addEventListener('click', () => document.querySelectorAll('.task-checkbox:not(:disabled)').forEach(cb => cb.checked = true));
            deselectAllButton.addEventListener('click', () => document.querySelectorAll('.task-checkbox:checked').forEach(cb => cb.checked = false));

            copyLogButton.addEventListener('click', () => {
                navigator.clipboard.writeText(statusArea.innerText).then(() => {
                    const originalText = copyLogButton.innerText;
                    copyLogButton.innerText = '已複製 ✅';
                    setTimeout(() => { copyLogButton.innerText = originalText; }, 2000);
                });
            });

            const setupWebSocket = () => {
                const ws = new WebSocket(`${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}/api/ws`);
                ws.onopen = () => logStatus('WebSocket 連線成功。', 'blue');
                ws.onclose = () => {
                    logStatus('WebSocket 連線已中斷。5 秒後嘗試重新連線...', 'orange');
                    setTimeout(setupWebSocket, 5000);
                };
                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        if (data.task_type === 'analysis_stage_date_inference' && (data.status === 'completed' || data.status === 'failed')) {
                             logStatus(`收到日期推斷任務 #${data.task_id} 完成通知，正在刷新列表...`, 'purple');
                             renderTaskList();
                        } else if (data.task_type === 'analysis_stage_1' && data.status === 'completed') {
                             logStatus(`收到第一階段任務 #${data.task_id} 完成通知，正在刷新列表...`, 'purple');
                             renderTaskList();
                        }
                    } catch (err) {
                        logStatus(`處理 WebSocket 訊息時發生錯誤: ${err}`, 'red');
                    }
                };
            };

            (async () => {
                logStatus('頁面載入完成，正在初始化...');
                await Promise.all([
                    checkKeysAndLoadModels(),
                    renderTaskList()
                ]);
                setupWebSocket();
                logStatus('初始化完成。', 'green');
            })();
        });
    </script>
</body>
</html>
