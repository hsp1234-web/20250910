<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作流歷史紀錄</title>
    <link rel="stylesheet" href="/static/css/main.css?v=1.1">
    <link rel="stylesheet" href="/static/css/nav.css?v=1.1">
    <link rel="stylesheet" href="/static/css/line_workflow.css?v=1.1">
    <style>
        .table-container {
            width: 100%;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #dee2e6;
        }
        th {
            background-color: #f8f9fa;
            font-weight: bold;
        }
        tr:hover {
            background-color: #f1f3f5;
        }
        .status-tag {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
            color: #fff;
        }
        .status-completed, .status-completed_with_errors { background-color: #28a745; }
        .status-failed { background-color: #dc3545; }
        .status-running { background-color: #007bff; }
        .status-pending { background-color: #6c757d; }
    </style>
</head>
<body>
    <nav class="top-nav">
        <ul>
            <li><a href="/">鳳凰主頁</a></li>
            <li><a href="/line_importer">LINE 內容整理</a></li>
        </ul>
    </nav>

    <div class="content">
        <div class="panel">
             <nav class="tab-nav">
                <a href="/line_importer">資料擷取與處理</a>
                <a href="/line_workflow_editor">工作流編輯器</a>
                <a href="/line_data_viewer">資料檢視器</a>
                <a href="/line_workflow_history" class="active">工作流歷史</a>
            </nav>
            <h1>工作流歷史紀錄</h1>
            <p>此頁面顯示所有已建立的工作流，點擊「查看詳情」以進入對應的工作流編輯器。</p>
            <div class="table-container">
                <table id="workflows-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>名稱</th>
                            <th>狀態</th>
                            <th>建立時間</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="workflows-table-body">
                        <!-- 資料將由 JavaScript 動態填入 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tableBody = document.getElementById('workflows-table-body');

            const statusClassMap = {
                'completed': 'status-completed',
                'completed_with_errors': 'status-completed',
                'failed': 'status-failed',
                'running': 'status-running',
                'pending': 'status-pending',
            };

            const statusTextMap = {
                'pending': '待處理',
                'running': '執行中',
                'completed': '已完成',
                'completed_with_errors': '完成但有錯誤',
                'failed': '已失敗',
            };

            const fetchWorkflows = async () => {
                try {
                    const response = await fetch('/api/workflows');
                    if (!response.ok) {
                        throw new Error('無法獲取工作流歷史資料');
                    }
                    const workflows = await response.json();

                    tableBody.innerHTML = '';
                    if (workflows.length === 0) {
                        tableBody.innerHTML = `<tr><td colspan="5" style="text-align:center;">目前沒有任何工作流歷史紀錄。</td></tr>`;
                        return;
                    }

                    workflows.forEach(workflow => {
                        const statusClass = statusClassMap[workflow.status] || 'status-pending';
                        const statusText = statusTextMap[workflow.status] || workflow.status;
                        const formattedDate = new Date(workflow.created_at).toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' });

                        const row = `
                            <tr>
                                <td>${workflow.id}</td>
                                <td>${workflow.name || '未命名'}</td>
                                <td><span class="status-tag ${statusClass}">${statusText}</span></td>
                                <td>${formattedDate}</td>
                                <td>
                                    <a href="/line_workflow_editor?workflow_id=${workflow.id}" class="button-small">查看詳情</a>
                                </td>
                            </tr>
                        `;
                        tableBody.innerHTML += row;
                    });
                } catch (error) {
                    tableBody.innerHTML = `<tr><td colspan="5" style="text-align:center; color: red;">錯誤: ${error.message}</td></tr>`;
                }
            };

            fetchWorkflows();
        });
    </script>
</body>
</html>
