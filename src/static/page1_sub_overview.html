<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資料總覽</title>
    <link rel="stylesheet" href="/static/css/page1_unified.css">
</head>
<body>
    <div class="content">
        <div class="panel">
            <h2>資料總覽 (卡片視圖)</h2>
            <div class="filter-container">
                <label for="start-date">開始日期:</label>
                <input type="date" id="start-date">
                <label for="end-date">結束日期:</label>
                <input type="date" id="end-date">
                <button id="filter-button">篩選</button>
                <button id="export-button">匯出目前結果</button>
            </div>
        </div>

        <div id="card-container" class="card-grid">
            <!-- 卡片將由 JavaScript 動態生成 -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const startDateInput = document.getElementById('start-date');
            const endDateInput = document.getElementById('end-date');
            const filterButton = document.getElementById('filter-button');
            const exportButton = document.getElementById('export-button');
            const cardContainer = document.getElementById('card-container');

            const fetchAndDisplayData = async (startDate = '', endDate = '') => {
                let url = '/api/page1/overview_data';
                const params = new URLSearchParams();
                if (startDate) params.append('start_date', startDate);
                if (endDate) params.append('end_date', endDate);
                if (params.toString()) {
                    url += `?${params.toString()}`;
                }

                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error(`HTTP 錯誤！狀態: ${response.status}`);
                    const data = await response.json();

                    cardContainer.innerHTML = '';

                    if (data.length === 0) {
                        cardContainer.innerHTML = '<p>在此範圍內沒有找到資料。</p>';
                        return;
                    }

                    data.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.innerHTML = `
                            <div class="card-header">卡片 ${item.id}</div>
                            <div class="card-body">
                                <p><strong>網址:</strong> <a href="${item.url}" target="_blank">${item.url}</a></p>
                                <p><strong>作者:</strong> ${item.author || 'N/A'}</p>
                                <p><strong>日期:</strong> ${item.date || 'N/A'}</p>
                            </div>
                        `;
                        cardContainer.appendChild(card);
                    });

                } catch (error) {
                    cardContainer.innerHTML = `<p style="color: var(--error-color);">載入資料失敗: ${error.message}</p>`;
                }
            };

            filterButton.addEventListener('click', () => {
                fetchAndDisplayData(startDateInput.value, endDateInput.value);
            });

            exportButton.addEventListener('click', () => {
                const startDate = startDateInput.value;
                const endDate = endDateInput.value;
                let exportUrl = `/page1/export`;
                const params = new URLSearchParams();
                if (startDate) params.append('start_date', startDate);
                if (endDate) params.append('end_date', endDate);
                if (params.toString()) {
                    exportUrl += `?${params.toString()}`;
                }
                // 在父級 iframe 中載入匯出頁面以保留主導覽列
                window.parent.document.querySelector('[name="content-frame"]').src = exportUrl;
            });

            // 初始載入所有資料
            fetchAndDisplayData();
        });
    </script>

    <!-- V5.5 Readiness Overlay Start -->
    <style>
        #readiness-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5em;
            z-index: 9999;
            flex-direction: column;
            text-align: center;
        }
        #readiness-overlay .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #fff;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <div id="readiness-overlay">
        <div class="spinner"></div>
        <p>系統正在初始化核心服務，請稍候...</p>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const overlay = document.getElementById('readiness-overlay');
            const buttons = document.querySelectorAll('button, a.button, input[type="button"], input[type="submit"]');

            // 輔助函數：啟用UI
            function enableUI() {
                overlay.style.display = 'none';
                buttons.forEach(btn => {
                    btn.disabled = false;
                });
                console.log('系統已就緒，UI 已啟用。');
            }

            // 檢查 sessionStorage 中是否已有就緒標記
            if (sessionStorage.getItem('isSystemReady') === 'true') {
                enableUI();
                const overlayText = overlay.querySelector('p');
                if(overlayText) {
                    overlayText.innerText = '系統已就緒';
                }
                return; // 如果已就緒，則不執行後續的輪詢
            }

            // 1. 預設禁用所有按鈕並顯示遮罩
            buttons.forEach(btn => {
                if (!btn.closest('.navbar')) {
                    btn.disabled = true;
                }
            });
            overlay.style.display = 'flex';

            // 2. 定期輪詢 /api/health/ready 端點
            const readinessInterval = setInterval(() => {
                fetch('/api/health/ready')
                    .then(response => {
                        if (response.ok) {
                            // 3. 一旦請求成功，設定標記、啟用按鈕並隱藏遮罩
                            clearInterval(readinessInterval);
                            sessionStorage.setItem('isSystemReady', 'true'); // 設定標記
                            enableUI();
                        } else {
                            console.log('等待核心服務就緒...');
                        }
                    })
                    .catch(error => {
                        console.error('輪詢就緒狀態時發生錯誤:', error);
                        const overlayText = overlay.querySelector('p');
                        if(overlayText) {
                            overlayText.innerText = '無法連接到後端服務，請檢查連線或稍後重試。';
                        }
                    });
            }, 2000); // 每 2 秒輪詢一次
        });
    </script>
    <!-- V5.5 Readiness Overlay End -->
</body>
</html>
