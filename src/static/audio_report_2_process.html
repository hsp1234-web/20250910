<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音訊報告生成器 - 步驟2：分析與處理</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #F8F9FA;
            --text-color: #202124;
            --card-bg-color: rgba(255, 255, 255, 0.9);
            --card-border-color: #e0e0e0;
            --button-bg-color: #28a745; /* Green for go */
            --button-hover-bg-color: #218838;
            --secondary-btn-bg: #6c757d;
            --secondary-btn-hover-bg: #5a6268;
            --info-bg-color: #e9ecef;
            --success-color: #28a745;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            font-size: 100%;
            line-height: 1.6;
        }
        .container { max-width: 1200px; margin: auto; display: flex; flex-direction: column; gap: 24px; }
        .card {
            border: 1px solid var(--card-border-color);
            border-radius: 12px;
            padding: 24px;
            background-color: var(--card-bg-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .grid-2-col {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
        }
        @media (max-width: 992px) {
            .grid-2-col { grid-template-columns: 1fr; }
        }
        .flex-col { display: flex; flex-direction: column; gap: 20px; }
        h1 { font-size: 2em; font-weight: 700; }
        h2 { font-size: 1.4em; font-weight: 600; margin-bottom: 0; } /* Reduced margin */
        .home-button {
            display: inline-block;
            text-decoration: none;
            padding: 8px 16px;
            font-size: 0.9em;
            color: #fff;
            background-color: var(--secondary-btn-bg);
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .home-button:hover { background-color: var(--secondary-btn-hover-bg); }
        select, input[type="text"] {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        button {
            padding: 15px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: var(--button-bg-color);
            color: white;
            font-weight: 600;
            font-size: 1.2em;
            transition: all 0.2s;
            width: 100%;
        }
        button:hover:not(:disabled) { background-color: var(--button-hover-bg-color); }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        .log-output {
            min-height: 150px; /* Reduced height */
            max-height: 250px;
            background-color: var(--info-bg-color);
            padding: 16px;
            border-radius: 8px;
            white-space: pre-wrap;
            font-family: monospace;
            color: #495057;
            overflow-y: auto;
        }
        .checkbox-group label {
            display: block;
            margin-bottom: 10px;
            background-color: #fff;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ddd;
            cursor: pointer;
        }
        .checkbox-group label:hover { background-color: #f8f9fa; }
        .api-key-status {
            padding: 16px;
            background-color: var(--info-bg-color);
            border-radius: 8px;
        }
        .button-like {
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            background-color: var(--secondary-btn-bg);
            color: white;
            font-weight: 500;
            transition: all 0.2s;
            display: inline-block;
            font-size: 0.9em;
            text-align: center;
        }
        .button-like:hover {
            background-color: var(--secondary-btn-hover-bg);
            transform: translateY(-1px);
        }

        /* --- 報告卡片樣式 (從 results.html 移植並統一樣式) --- */
        .report-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); /* 改為多欄網格 */
            gap: 20px;
        }
        .report-card {
            border: 1px solid var(--card-border-color); border-radius: 10px; background-color: #fff;
            padding: 20px; display: flex; flex-direction: column;
            transition: box-shadow 0.3s ease, transform 0.3s ease;
        }
        .report-card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.08); }
        .report-card-header { font-weight: 600; font-size: 1.1em; margin-bottom: 12px; word-break: break-all; }
        .report-card-body { font-size: 0.9em; color: #666; margin-bottom: 16px; }
        .details-toggle-btn {
            background: none; border: none; color: #007bff; cursor: pointer;
            padding: 4px 0; margin-bottom: 12px; font-size: 0.9em;
        }
        .details-toggle-btn:hover { text-decoration: underline; }
        .report-card-details { display: none; padding-left: 10px; border-left: 2px solid #eee; margin-top: 8px; }
        .report-card-details p { margin: 6px 0; }
        .report-card-footer {
            display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-start;
            align-items: center; margin-top: auto;
        }
        .report-card-footer .action-btn {
            text-decoration: none; padding: 8px 16px; border-radius: 6px; color: white;
            font-size: 0.9em; transition: all 0.2s; border: none; cursor: pointer;
        }
        .report-card-footer select { padding: 8px; border-radius: 6px; border: 1px solid var(--card-border-color); flex-grow: 1; }
        .btn-preview { background-color: #007bff; }
        .btn-preview:hover { background-color: #0056b3; }
        .btn-download { background-color: var(--warning-color); color: var(--text-color); } /* Yellow download button */
        .btn-download:hover { background-color: #e0a800; }

        /* --- Modal 彈窗樣式 --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6); display: none; justify-content: center;
            align-items: center; z-index: 1000; padding: 20px; box-sizing: border-box;
        }
        .modal-content {
            background-color: white; padding: 24px; border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); width: 100%; max-width: 800px;
            max-height: 90vh; display: flex; flex-direction: column; gap: 16px;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 12px; }
        .modal-header h2 { margin: 0; }
        .modal-close-button { background: none; border: none; font-size: 2em; cursor: pointer; color: #888; line-height: 1; padding: 0; }
        .modal-body { overflow-y: auto; flex-grow: 1; line-height: 1.7; }
        .modal-body h1, .modal-body h2, .modal-body h3 { border-bottom: 1px solid #eee; padding-bottom: 0.3em; margin-top: 24px; }
        .modal-body pre { background-color: #f6f8fa; padding: 16px; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <header class="card" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
            <div>
                <h1>步驟二：分析與處理中心</h1>
                <p>請選擇要分析的音訊檔案，並設定 AI 處理任務。</p>
            </div>
            <a href="/audio_report/main" class="home-button">返回功能主頁</a>
        </header>

        <div class="grid-2-col">
            <!-- 左側：主要設定與操作 -->
            <main class="card flex-col">
                <div>
                    <label for="audio-file-select"><strong>1. 選擇要分析的音訊檔案</strong></label>
                    <select id="audio-file-select">
                        <option value="">正在從伺服器載入已完成的下載列表...</option>
                    </select>
                </div>

                <div>
                    <label for="model-select"><strong>2. 選擇 AI 模型</strong></label>
                    <select id="model-select">
                        <option>等待從伺服器載入模型列表...</option>
                    </select>
                </div>

                <div>
                    <label><strong>3. 勾選要執行的任務</strong></label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="ai-task" value="summary" checked> 產生重點摘要</label>
                        <label><input type="checkbox" name="ai-task" value="transcript" checked> 生成逐字稿</label>
                        <label><input type="checkbox" name="ai-task" value="translate_zh"> 翻譯成繁體中文 (基於逐字稿)</label>
                    </div>
                </div>

                <button id="start-analysis-btn" disabled>🚀 開始分析</button>
            </main>

            <!-- 右側：狀態與日誌 -->
            <aside class="flex-col">
                <div class="card api-key-status flex-col">
                     <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
                        <h2 style="margin: 0;">AI 相關設定</h2>
                        <div>
                            <a href="/page7" class="button-like" style="background-color: #6c757d; margin-right: 8px;">管理提示詞</a>
                            <a href="/page6" class="button-like" style="background-color: #17a2b8;">管理金鑰池</a>
                        </div>
                    </div>
                    <div id="key-status-container" style="margin-top: 12px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; background-color: #f9f9f9; text-align: center;">
                        <p id="api-key-status-text" style="margin: 0; font-weight: 500;">正在檢查...</p>
                    </div>
                    <div style="margin-top: 12px;">
                        <a href="#" id="toggle-temp-key-link" style="text-decoration: none; color: var(--button-bg-color); font-weight: 500; font-size: 0.9em;">使用臨時金鑰...</a>
                        <div id="temp-key-input-area" style="display: none; margin-top: 8px; padding: 12px; border: 1px dashed #ccc; border-radius: 8px;">
                            <input type="password" id="api-key-input" placeholder="貼上臨時 Google API 金鑰" style="width: 100%; margin-bottom: 8px;">
                            <button id="validate-api-key-btn" style="width: 100%; padding: 8px; font-size: 0.9em;">驗證並使用</button>
                        </div>
                    </div>
                </div>
                <div class="card flex-col" style="flex-grow: 1;">
                    <h2>即時進度</h2>
                    <div id="progress-log" class="log-output">等待任務開始...</div>
                </div>
            </aside>
        </div>

        <!-- 新增的報告卡片顯示區 -->
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h2>已完成的分析報告</h2>
                <a href="/audio_report/results" class="button-like">前往完整報告頁面 →</a>
            </div>
            <div id="report-grid" class="report-grid">
                <p id="no-reports-message">正在載入報告列表...</p>
            </div>
        </div>
    </div>

    <!-- 預覽彈窗 (Modal) -->
    <div id="preview-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">報告預覽</h2>
                <button id="modal-close-btn" class="modal-close-button">&times;</button>
            </div>
            <div id="modal-body" class="modal-body"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- DOM 元素宣告 (主要功能) ---
            const audioSelect = document.getElementById('audio-file-select');
            const modelSelect = document.getElementById('model-select');
            const startBtn = document.getElementById('start-analysis-btn');
            const apiKeyStatusText = document.getElementById('api-key-status-text');
            const progressLog = document.getElementById('progress-log');
            const toggleTempKeyLink = document.getElementById('toggle-temp-key-link');
            const tempKeyInputArea = document.getElementById('temp-key-input-area');
            const apiKeyInput = document.getElementById('api-key-input');
            const validateApiKeyBtn = document.getElementById('validate-api-key-btn');

            // --- DOM 元素宣告 (報告卡片功能) ---
            const reportGrid = document.getElementById('report-grid');
            const noReportsMessage = document.getElementById('no-reports-message');
            const previewModal = document.getElementById('preview-modal');
            const modalTitle = document.getElementById('modal-title');
            const modalBody = document.getElementById('modal-body');
            const modalCloseBtn = document.getElementById('modal-close-btn');

            let socket;
            let validatedTempApiKey = null;

            // --- WebSocket 處理 ---
            function setupWebSocket() {
                const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${wsProtocol}//${window.location.host}/api/audio_report/ws`;
                socket = new WebSocket(wsUrl);
                socket.onopen = () => console.log("WebSocket 連線成功。");
                socket.onmessage = (event) => handleWebSocketMessage(JSON.parse(event.data));
                socket.onclose = () => setTimeout(setupWebSocket, 3000);
            }

            function handleWebSocketMessage(message) {
                if (message.type === 'ANALYSIS_STATUS') {
                    const { payload } = message;
                    const logEntry = document.createElement('p');
                    logEntry.innerHTML = `<strong>[${new Date().toLocaleTimeString()}]</strong> ${payload.message}`;
                    if (payload.status === 'failed') logEntry.style.color = 'red';
                    if (payload.status === 'completed') logEntry.style.color = 'green';
                    progressLog.prepend(logEntry);

                    if (payload.status === 'completed') {
                        startBtn.disabled = false;
                        startBtn.textContent = '🚀 開始新分析';
                        // 當分析完成時，重新載入報告卡片列表
                        loadReports();
                    } else if (payload.status === 'failed') {
                        startBtn.disabled = false;
                        startBtn.textContent = '🚀 重試分析';
                    }
                }
            }

            // --- 報告卡片相關函式 (從 results.html 移植並優化) ---
            async function loadReports() {
                 try {
                    const response = await fetch('/api/audio_report/reports');
                    if (!response.ok) throw new Error(`伺服器錯誤: ${response.status}`);
                    const data = await response.json();
                    const reports = data.reports;

                    reportGrid.innerHTML = ''; // 清空
                    if (!reports || reports.length === 0) {
                        noReportsMessage.textContent = '目前尚無已完成的報告。';
                        noReportsMessage.style.display = 'block';
                        return;
                    }
                    noReportsMessage.style.display = 'none';
                    reports.forEach(report => {
                        const card = createDetailedReportCard(report);
                        reportGrid.appendChild(card);
                    });
                } catch (error) {
                    noReportsMessage.textContent = `❌ 載入報告失敗: ${error.message}`;
                }
            }

            function createDetailedReportCard(report) {
                const card = document.createElement('div');
                card.className = 'report-card';
                const creationDate = new Date(report.creationDate).toLocaleString('zh-TW', { hour12: false });

                let fileOptionsHtml = '';
                if (report.outputFiles && report.outputFiles.length > 0) {
                    report.outputFiles.forEach(file => {
                        const webPath = `/${file.path}`;
                        fileOptionsHtml += `<option value="${webPath}" data-name="${file.name}">${file.type}</option>`;
                    });
                }

                card.innerHTML = `
                    <div class="report-card-header" title="${report.reportTitle}">${report.reportTitle}</div>
                    <div class="report-card-body">
                        <button class="details-toggle-btn">顯示詳細資訊</button>
                        <div class="report-card-details">
                            <p title="${report.sourceFilename}"><strong>來源:</strong> ${report.sourceFilename}</p>
                            <p><strong>模型:</strong> ${report.modelUsed}</p>
                            <p><strong>處理時間:</strong> ${report.processingTime} 秒</p>
                            <p><strong>消耗 Tokens:</strong> ${report.totalTokens}</p>
                            <p><strong>建立時間:</strong> ${creationDate}</p>
                        </div>
                    </div>
                    <div class="report-card-footer">
                        <select class="file-selector" ${!fileOptionsHtml ? 'disabled' : ''}>
                            ${fileOptionsHtml || '<option>無可用檔案</option>'}
                        </select>
                        <button class="action-btn btn-preview" ${!fileOptionsHtml ? 'disabled' : ''}>▶️ 預覽</button>
                        <a href="#" class="action-btn btn-download" download ${!fileOptionsHtml ? 'disabled' : ''}>📥 下載</a>
                    </div>
                `;

                const detailsContainer = card.querySelector('.report-card-details');
                const toggleBtn = card.querySelector('.details-toggle-btn');
                const fileSelector = card.querySelector('.file-selector');
                const previewBtn = card.querySelector('.btn-preview');
                const downloadLink = card.querySelector('.btn-download');

                toggleBtn.addEventListener('click', () => {
                    const isHidden = detailsContainer.style.display === 'none' || !detailsContainer.style.display;
                    detailsContainer.style.display = isHidden ? 'block' : 'none';
                    toggleBtn.textContent = isHidden ? '隱藏詳細資訊' : '顯示詳細資訊';
                });

                const updateActions = () => {
                    if (fileSelector.value) {
                        const selectedOption = fileSelector.options[fileSelector.selectedIndex];
                        downloadLink.href = fileSelector.value;
                        downloadLink.download = selectedOption.dataset.name;
                        previewBtn.disabled = false;
                        downloadLink.style.pointerEvents = 'auto';
                        downloadLink.style.opacity = '1';
                    } else {
                        previewBtn.disabled = true;
                        downloadLink.style.pointerEvents = 'none';
                        downloadLink.style.opacity = '0.6';
                    }
                };

                previewBtn.addEventListener('click', () => {
                    if (fileSelector.value) {
                        const selectedOption = fileSelector.options[fileSelector.selectedIndex];
                        openPreviewModal(fileSelector.value, selectedOption.dataset.name);
                    }
                });

                fileSelector.addEventListener('change', updateActions);
                updateActions(); // Initial setup

                return card;
            }

            async function openPreviewModal(path, name) {
                modalTitle.textContent = `預覽: ${name}`;
                modalBody.innerHTML = '<p>正在載入內容...</p>';
                previewModal.style.display = 'flex';
                try {
                    const response = await fetch(path);
                    if (!response.ok) throw new Error(`無法擷取檔案: ${response.statusText}`);
                    modalBody.innerHTML = marked.parse(await response.text());
                } catch (error) {
                    modalBody.innerHTML = `<p style="color: red;">❌ 載入預覽失敗: ${error.message}</p>`;
                }
            }

            function closePreviewModal() {
                previewModal.style.display = 'none';
                modalBody.innerHTML = '';
            }

            // --- 主要分析功能函式 ---
            async function fetchWithRetry(url) {
                // ... (原有 fetchWithRetry 邏輯)
            }

            async function updateKeyAndModelStatus(apiKeyToValidate = null) {
                apiKeyStatusText.textContent = '正在檢查金鑰與模型...';
                apiKeyStatusText.style.color = '#666';
                let apiKeyForModelLoading = apiKeyToValidate || validatedTempApiKey;
                try {
                    const modelPayload = {};
                    if (apiKeyForModelLoading) modelPayload.api_key = apiKeyForModelLoading;
                    const response = await fetch('/api/youtube/models', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(modelPayload)
                    });
                    const result = await response.json();
                    if (!response.ok) {
                        if(apiKeyToValidate) validatedTempApiKey = null;
                        throw new Error(result.detail || `伺服器錯誤`);
                    }
                    modelSelect.innerHTML = '';
                    result.models.forEach(model => {
                        const option = document.createElement('option');
                        option.value = model.id;
                        option.textContent = model.name;
                        modelSelect.appendChild(option);
                    });
                    if (apiKeyToValidate) {
                        validatedTempApiKey = apiKeyToValidate;
                        apiKeyStatusText.textContent = '✅ 臨時金鑰驗證成功';
                        apiKeyStatusText.style.color = 'green';
                    } else {
                         apiKeyStatusText.textContent = '✅ 系統金鑰池可用';
                         apiKeyStatusText.style.color = 'green';
                    }
                } catch (error) {
                    apiKeyStatusText.textContent = `❌ 金鑰或模型錯誤: ${error.message}`;
                    apiKeyStatusText.style.color = '#dc3545';
                    modelSelect.innerHTML = '<option>模型載入失敗</option>';
                } finally {
                    updateStartButtonState();
                }
            }

            async function loadCompletedDownloads() {
                try {
                    const response = await fetch('/api/audio_report/completed_downloads');
                    if (!response.ok) throw new Error('無法載入已下載檔案');
                    const files = await response.json();
                    audioSelect.innerHTML = '<option value="">請從已暫存列表中選擇一個檔案...</option>';
                    files.forEach(file => {
                        const option = document.createElement('option');
                        option.value = file.path;
                        option.textContent = file.title || file.filename;
                        audioSelect.appendChild(option);
                    });
                    const preselectedFile = localStorage.getItem('selected_media_for_process');
                    if (preselectedFile) {
                        const fileInfo = JSON.parse(preselectedFile);
                        if (audioSelect.querySelector(`option[value="${fileInfo.path}"]`)) {
                            audioSelect.value = fileInfo.path;
                        }
                        localStorage.removeItem('selected_media_for_process');
                    }
                } catch (error) {
                    audioSelect.innerHTML = `<option value="">${error.message}</option>`;
                } finally {
                     updateStartButtonState();
                }
            }

            function updateStartButtonState() {
                const isFileSelected = !!audioSelect.value;
                const isKeyReady = apiKeyStatusText.textContent.startsWith('✅');
                startBtn.disabled = !(isFileSelected && isKeyReady);
                if (!startBtn.disabled) startBtn.textContent = '🚀 開始分析';
            }

            // --- 事件監聽器 ---
            audioSelect.addEventListener('change', updateStartButtonState);
            toggleTempKeyLink.addEventListener('click', (e) => {
                e.preventDefault();
                tempKeyInputArea.style.display = tempKeyInputArea.style.display === 'none' ? 'block' : 'none';
            });
            validateApiKeyBtn.addEventListener('click', () => {
                const key = apiKeyInput.value.trim();
                if(key) updateKeyAndModelStatus(key);
            });
            modalCloseBtn.addEventListener('click', closePreviewModal);
            previewModal.addEventListener('click', (e) => {
                if (e.target === previewModal) closePreviewModal();
            });

            startBtn.addEventListener('click', async () => {
                const filePath = audioSelect.value;
                const model = modelSelect.value;
                const tasks = Array.from(document.querySelectorAll('input[name="ai-task"]:checked')).map(cb => cb.value);
                if (!filePath || !model || tasks.length === 0) return;

                startBtn.disabled = true;
                startBtn.textContent = '正在建立任務...';
                progressLog.innerHTML = `<p><strong>[${new Date().toLocaleTimeString()}]</strong> 正在建立分析任務...</p>`;

                const payload = { file_path: filePath, model, tasks, api_key: validatedTempApiKey };
                try {
                    const response = await fetch('/api/audio_report/analyze', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) throw new Error((await response.json()).detail || '建立任務失敗');
                } catch (error) {
                    progressLog.prepend(`<p style="color: red;"><strong>[${new Date().toLocaleTimeString()}]</strong> 錯誤: ${error.message}</p>`);
                    startBtn.disabled = false;
                    startBtn.textContent = '🚀 開始分析';
                }
            });

            // --- 初始化 ---
            loadCompletedDownloads();
            updateKeyAndModelStatus();
            loadReports(); // 頁面載入時獲取報告
            setupWebSocket();
        });
    </script>
</body>
</html>
