<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>債券分析儀</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <style>
        /* --- Page-specific styles --- */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
        }
        .chart-container {
            width: 100%;
            height: 400px; /* Or any desired height */
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">鳳凰主頁</a>
        <ul class="navbar-links">
            <li><a href="/page_bond" class="active">債券分析儀</a></li>
        </ul>
    </nav>

    <div class="content">
        <h1>債券分析儀表板</h1>

        <div class="panel">
            <h2>控制面板</h2>
            <p>手動觸發特定指標的資料更新。</p>
            <button id="btn-fetch-gdp">更新GDP數據</button>
            <button id="btn-fetch-cpi">更新CPI數據</button>
            <button id="btn-fetch-fedfunds">更新利率數據</button>
            <button id="btn-fetch-ism" disabled title="資料來源待尋">更新ISM數據 (暫停)</button>
            <div id="update-status" style="margin-top: 10px;"></div>
        </div>

        <div class="dashboard-grid">
            <div class="panel">
                <h2>美國實質GDP (季)</h2>
                <div class="chart-container">
                    <canvas id="gdp-chart"></canvas>
                </div>
                <small>最後更新時間: <span id="gdp-last-updated">N/A</span></small>
            </div>
            <div class="panel">
                <h2>美國CPI年增率</h2>
                <div class="chart-container">
                    <canvas id="cpi-chart"></canvas>
                </div>
                <small>最後更新時間: <span id="cpi-last-updated">N/A</span></small>
            </div>
            <div class="panel">
                <h2>聯準會基準利率</h2>
                <div class="chart-container">
                    <canvas id="fedfunds-chart"></canvas>
                </div>
                <small>最後更新時間: <span id="fedfunds-last-updated">N/A</span></small>
            </div>
            <div class="panel">
                <h2>美國ISM製造業PMI</h2>
                <div class="chart-container">
                    <canvas id="ism-chart"></canvas>
                </div>
                <small>最後更新時間: <span id="ism-last-updated">N/A</span></small>
            </div>
        </div>
    </div>

    <script src="/static/js/page_bond.js"></script>
</body>
</html>
