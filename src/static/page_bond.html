<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>債券分析儀</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <style>
        /* --- Page-specific styles --- */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
        }
        .chart-container {
            width: 100%;
            /* Let height be auto */
        }
        .chart-container img {
            width: 100%;
            height: auto;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">鳳凰主頁</a>
        <ul class="navbar-links">
            <li><a href="/page_bond" class="active">債券分析儀</a></li>
        </ul>
    </nav>

    <div class="content">
        <h1>債券分析儀表板</h1>

        <div class="panel">
            <h2>控制面板</h2>
            <p>請選擇您想分析的日期範圍，然後點擊按鈕以生成完整的壓力指標報告。</p>

            <label for="start-date">開始日期:</label>
            <input type="date" id="start-date" name="start-date">

            <label for="end-date">結束日期:</label>
            <input type="date" id="end-date" name="end-date">

            <button id="btn-generate-report">產生報告</button>

            <div id="update-status" style="margin-top: 10px;"></div>
        </div>

        <div id="charts-container" class="dashboard-grid">
            <!-- 圖表將由 JavaScript 動態載入此處 -->
        </div>
    </div>

    <script src="/static/js/page_bond.js"></script>
</body>
</html>
